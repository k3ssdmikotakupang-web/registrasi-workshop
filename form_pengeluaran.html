<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catat Pengeluaran - EMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background-color: #f8f9fa; color: #333; font-family: 'Segoe UI', sans-serif; padding-bottom: 50px; }
        .header-panel { background: #0f172a; color: #00f2fe; padding: 20px; border-bottom: 5px solid #dc3545; }
        .form-card { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); padding: 25px; border-top: 4px solid #dc3545; }
        .kalkulator-box { background: #f1f5f9; border-radius: 8px; padding: 15px; border: 1px dashed #cbd5e1; }
        .text-netto { color: #198754; font-size: 1.5rem; font-weight: bold; }
    </style>
</head>
<body>

<div class="header-panel mb-4">
    <div class="container d-flex justify-content-between align-items-center">
        <div>
            <h4 class="fw-bold mb-0 text-white">CATAT PENGELUARAN</h4>
            <p class="mb-0 text-white-50">Kalkulator Pajak Otomatis</p>
        </div>
        <button class="btn btn-outline-light" onclick="window.location.href='dashboard_bendahara_panitia.html'"><i class="bi bi-arrow-left"></i> Batal</button>
    </div>
</div>

<div class="container">
    <div class="form-card mx-auto" style="max-width: 700px;">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label small fw-bold text-muted">Kategori Belanja</label>
                <select class="form-select" id="f_kategori">
                    <option value="Jasa Pemateri / Narasumber">Jasa Pemateri / Narasumber</option>
                    <option value="Konsumsi & Snack">Konsumsi & Snack</option>
                    <option value="Belanja ATK & Penggandaan">Belanja ATK & Penggandaan</option>
                    <option value="Sewa Gedung / Alat">Sewa Gedung / Alat</option>
                    <option value="Transportasi / Operasional">Transportasi / Operasional</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label small fw-bold text-muted">Nama Penerima Dana</label>
                <input type="text" id="f_penerima" class="form-control" placeholder="Contoh: Bpk. Gabriel (Pemateri)">
            </div>
            
            <div class="col-12 mt-4">
                <h6 class="fw-bold border-bottom pb-2"><i class="bi bi-calculator"></i> Rincian & Kalkulator Pajak</h6>
            </div>

            <div class="col-md-6">
                <label class="form-label small fw-bold text-muted">Nominal Bruto (Kotor) Rp</label>
                <input type="number" id="f_bruto" class="form-control" placeholder="Ketik angka saja, cth: 1000000" oninput="hitungPajak()">
            </div>
            <div class="col-md-6">
                <label class="form-label small fw-bold text-muted">Potongan Pajak</label>
                <select class="form-select border-warning" id="f_pajak" onchange="hitungPajak()">
                    <option value="0|Tanpa Potongan Pajak">Tanpa Potongan (0%)</option>
                    <option value="0.05|PPh 21 - ASN Gol III (5%)">PPh 21 - ASN Gol III (5%)</option>
                    <option value="0.15|PPh 21 - ASN Gol IV (15%)">PPh 21 - ASN Gol IV (15%)</option>
                    <option value="0.025|PPh 21 - Non ASN Ber-NPWP (2,5%)">PPh 21 - Non ASN Ber-NPWP (2,5%)</option>
                    <option value="0.03|PPh 21 - Non ASN Tanpa NPWP (3%)">PPh 21 - Non ASN Tanpa NPWP (3%)</option>
                </select>
            </div>

            <!-- Layar Kalkulator -->
            <div class="col-12">
                <div class="kalkulator-box mt-2">
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Potongan Pajak:</span>
                        <span class="text-danger fw-bold" id="tampilPotongan">- Rp 0</span>
                    </div>
                    <div class="d-flex justify-content-between align-items-center border-top pt-2">
                        <span class="fw-bold">Nominal Netto (Bersih):</span>
                        <span class="text-netto" id="tampilNetto">Rp 0</span>
                    </div>
                    <p class="small text-muted mt-2 mb-0 fst-italic">*Nominal Netto ini yang akan dicairkan ke penerima dan tercatat memotong Saldo Kas.</p>
                </div>
            </div>

            <div class="col-12">
                <label class="form-label small fw-bold text-muted">Keterangan / Uraian Belanja</label>
                <textarea id="f_keterangan" class="form-control" rows="2" placeholder="Contoh: Honor materi Implementasi Kurikulum Merdeka 2 Sesi"></textarea>
            </div>

            <div class="col-12 mt-4">
                <button class="btn btn-danger w-100 py-3 fw-bold" id="btnSimpan" onclick="prosesSimpan()">
                    <i class="bi bi-save-fill me-2"></i> Simpan & Buat Kwitansi Pencairan
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwLdvXuLpbUvBE666hblNZm4y1HuoogGUl8vdHorb-aT9s6T5X6xHwXAcPaeEvrZ5RS/exec"; 

    // Mencegah selain Bendahara Pusat masuk
    const userData = JSON.parse(localStorage.getItem('userLogin'));
    if(!userData || userData.role !== 'Bendahara_Panitia') window.location.href = "index.html";

    const formatRp = (angka) => new Intl.NumberFormat('id-ID').format(angka);
    
    // Variabel penyimpan hasil hitung
    let hasilNetto = 0;
    let hasilPajak = 0;
    let namaPajakTerpilih = "";

    function hitungPajak() {
        let bruto = parseFloat(document.getElementById('f_bruto').value) || 0;
        
        // Memecah value select (cth: "0.05|PPh 21 - ASN Gol III (5%)")
        let pajakPilihan = document.getElementById('f_pajak').value.split("|"); 
        let persenPajak = parseFloat(pajakPilihan[0]);
        namaPajakTerpilih = pajakPilihan[1];

        hasilPajak = bruto * persenPajak;
        hasilNetto = bruto - hasilPajak;

        document.getElementById('tampilPotongan').innerText = '- Rp ' + formatRp(hasilPajak);
        document.getElementById('tampilNetto').innerText = 'Rp ' + formatRp(hasilNetto);
    }

    async function prosesSimpan() {
        let kategori = document.getElementById('f_kategori').value;
        let penerima = document.getElementById('f_penerima').value;
        let bruto = document.getElementById('f_bruto').value;
        let keterangan = document.getElementById('f_keterangan').value;

        if(!bruto || !penerima || bruto <= 0) {
            Swal.fire('Data Belum Lengkap', 'Nominal Bruto dan Nama Penerima wajib diisi!', 'warning');
            return;
        }

        document.getElementById('btnSimpan').innerHTML = '<span class="spinner-border spinner-border-sm"></span> Menyimpan...';
        
        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    action: 'simpan_pengeluaran',
                    kategori: kategori,
                    penerima: penerima,
                    bruto: bruto,
                    pajak_persen: namaPajakTerpilih, // Kita simpan nama pajaknya sbg bukti
                    netto: hasilNetto,
                    keterangan: keterangan
                })
            });
            
            const result = await response.json();
            
            if(result.status === 'success') {
                Swal.fire({
                    icon: 'success',
                    title: 'Berhasil Dicatat!',
                    text: 'Pengeluaran berhasil memotong BKU.',
                    confirmButtonText: 'OK'
                }).then(() => {
                    // Nantinya tombol OK ini akan kita arahkan ke halaman Cetak Kwitansi
                    window.location.href = 'dashboard_bendahara_panitia.html';
                });
            } else {
                Swal.fire('Gagal', result.message, 'error');
                document.getElementById('btnSimpan').innerHTML = '<i class="bi bi-save-fill me-2"></i> Simpan & Buat Kwitansi Pencairan';
            }
        } catch(e) {
            Swal.fire('Error', 'Gagal terhubung ke server', 'error');
            document.getElementById('btnSimpan').innerHTML = '<i class="bi bi-save-fill me-2"></i> Simpan & Buat Kwitansi Pencairan';
        }
    }
</script>
</body>
</html>

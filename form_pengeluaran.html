<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Pengeluaran - EMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        body { background-color: #0f172a; color: #ffffff; font-family: 'Segoe UI', sans-serif; padding-bottom: 50px; }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 15px; box-shadow: 0 8px 32px 0 rgba(0,0,0,0.3); }
        .text-neon { background: linear-gradient(to right, #00f2fe, #4facfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: bold; }
        .btn-neon { background: linear-gradient(45deg, #00f2fe, #4facfe); border: none; color: white; border-radius: 8px; font-weight: 600; }
        .form-control, .form-select { background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.2); color: white; }
        .form-control:focus, .form-select:focus { background: rgba(0, 0, 0, 0.4); border-color: #00f2fe; color: white; box-shadow: 0 0 10px rgba(0, 242, 254, 0.3); }
        .swal2-popup.swal-dark { background: #1e293b !important; color: #ffffff !important; border: 1px solid rgba(255,255,255,0.1); border-radius: 15px !important; }
    </style>
</head>
<body>

<div class="container mt-4">
    <button class="btn btn-outline-secondary mb-3" onclick="window.location.href='dashboard_bendahara_panitia.html'"><i class="bi bi-arrow-left"></i> Kembali ke BKU</button>
    
    <div class="glass-card p-4 mx-auto" style="max-width: 600px; border-left: 4px solid #dc3545;">
        <h4 class="text-neon text-center mb-1">CATAT PENGELUARAN</h4>
        <p class="text-center text-white-50 small mb-4">Input transaksi uang keluar (jasa, ATK, konsumsi, dll).</p>

        <form id="formKeluar">
            <div class="mb-3">
                <label class="form-label small">Kategori Pengeluaran</label>
                <select id="kategori" class="form-select" required>
                    <option value="Jasa Pemateri">Jasa Pemateri</option>
                    <option value="ATK & Penggandaan">ATK & Penggandaan</option>
                    <option value="Konsumsi">Konsumsi</option>
                    <option value="Sewa Tempat/Alat">Sewa Tempat/Alat</option>
                    <option value="Lembur Panitia">Lembur Panitia</option>
                    <option value="Lainnya">Lainnya</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label small">Nominal (Rp)</label>
                <input type="number" id="nominal" class="form-control" placeholder="Contoh: 1500000" required>
            </div>
            <div class="mb-3">
                <label class="form-label small">Dibayarkan Kepada (Penerima)</label>
                <input type="text" id="penerima" class="form-control" placeholder="Nama orang/toko" required>
            </div>
            <div class="mb-3">
                <label class="form-label small">Keterangan Detail</label>
                <textarea id="keterangan" class="form-control" rows="2" placeholder="Uraian pembayaran..."></textarea>
            </div>
            <div class="mb-4">
                <label class="form-label small text-info">Upload Bukti/Nota (Opsional, PDF/JPG)</label>
                <input type="file" id="fileNota" class="form-control" accept=".pdf, .jpg, .jpeg, .png">
            </div>

            <button type="button" id="btnSimpanKeluar" class="btn btn-danger w-100 py-2 fw-bold" onclick="prosesSimpanKeluar()">Simpan Pengeluaran</button>
        </form>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwLdvXuLpbUvBE666hblNZm4y1HuoogGUl8vdHorb-aT9s6T5X6xHwXAcPaeEvrZ5RS/exec";
    const userData = JSON.parse(localStorage.getItem('userLogin'));
    if(!userData || userData.role !== 'Bendahara_Panitia') window.location.href = "index.html";
    
    const Toast = Swal.mixin({ customClass: { popup: 'swal-dark' }, confirmButtonColor: '#00f2fe' });

    function getBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = error => reject(error);
        });
    }

    async function prosesSimpanKeluar() {
        const kategori = document.getElementById('kategori').value;
        const nominal = document.getElementById('nominal').value;
        const penerima = document.getElementById('penerima').value;
        const keterangan = document.getElementById('keterangan').value;
        const fileInput = document.getElementById('fileNota');

        if(!nominal || !penerima) {
            Toast.fire({ icon: 'warning', title: 'Data belum lengkap!' });
            return;
        }

        let base64Data = null;
        let mimeType = null;
        let fileName = null;

        if(fileInput.files.length > 0) {
            if(fileInput.files[0].size > 2 * 1024 * 1024) {
                Toast.fire({ icon: 'warning', title: 'Ukuran nota maksimal 2MB!' });
                return;
            }
            base64Data = await getBase64(fileInput.files[0]);
            mimeType = fileInput.files[0].type;
            fileName = `Nota_${new Date().getTime()}_${fileInput.files[0].name}`;
        }

        const btnSimpan = document.getElementById('btnSimpanKeluar');
        btnSimpan.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Menyimpan...';
        btnSimpan.disabled = true;

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    action: 'catat_pengeluaran',
                    kategori: kategori,
                    nominal: nominal,
                    penerima: penerima,
                    keterangan: keterangan,
                    base64Data: base64Data,
                    mimeType: mimeType,
                    fileName: fileName
                })
            });
            const result = await response.json();

            if(result.status === 'success') {
                Swal.fire({
                    icon: 'success', title: 'Berhasil!', text: result.message,
                    customClass: { popup: 'swal-dark' }, background: '#1e293b', color: '#fff', confirmButtonColor: '#00f2fe'
                }).then(() => {
                    window.location.href = 'dashboard_bendahara_panitia.html';
                });
            } else {
                Toast.fire({ icon: 'error', title: 'Gagal', text: result.message });
            }
        } catch (error) {
            Toast.fire({ icon: 'error', title: 'Error Koneksi', text: 'Server tidak merespons.' });
        } finally {
            btnSimpan.innerHTML = 'Simpan Pengeluaran';
            btnSimpan.disabled = false;
        }
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bendahara Pusat - EMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        body { background-color: #0f172a; color: #ffffff; font-family: 'Segoe UI', sans-serif; padding-bottom: 50px; }
        .neon-nav { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0, 242, 254, 0.3); }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 15px; box-shadow: 0 8px 32px 0 rgba(0,0,0,0.3); }
        .text-neon { background: linear-gradient(to right, #00f2fe, #4facfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: bold; }
        .btn-neon { background: linear-gradient(45deg, #00f2fe, #4facfe); border: none; color: white; border-radius: 8px; font-weight: 600; }
        
        /* Kartu Saldo */
        .card-saldo { background: linear-gradient(135deg, rgba(0,242,254,0.1) 0%, rgba(79,172,254,0.1) 100%); border-left: 5px solid #00f2fe; }
        .card-masuk { border-left: 5px solid #198754; background: rgba(25,135,84,0.05); }
        .card-keluar { border-left: 5px solid #dc3545; background: rgba(220,53,69,0.05); }
    </style>
</head>
<body>

<nav class="navbar navbar-dark neon-nav sticky-top mb-4">
    <div class="container">
        <span class="navbar-brand text-neon">Bendahara Pusat EMS</span>
        <button class="btn btn-sm btn-outline-danger" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</button>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="fw-bold mb-0" id="namaPic">Memuat...</h4>
            <p class="text-white-50 small mb-0">Buku Kas Umum (BKU) Panitia</p>
        </div>
    </div>

    <!-- Panel Keuangan -->
    <div class="row g-3 mb-4">
        <div class="col-12">
            <div class="glass-card card-saldo p-4 text-center">
                <p class="text-info mb-1 small text-uppercase fw-bold">Saldo Kas Saat Ini</p>
                <h2 class="fw-bold mb-0 text-white" id="txtSaldo">Rp 0</h2>
            </div>
        </div>
        <div class="col-6">
            <div class="glass-card card-masuk p-3 text-center h-100">
                <i class="bi bi-arrow-down-circle text-success fs-3"></i>
                <p class="text-white-50 mb-1 small">Total Penerimaan</p>
                <h5 class="text-success fw-bold" id="txtMasuk">Rp 0</h5>
            </div>
        </div>
        <div class="col-6">
            <div class="glass-card card-keluar p-3 text-center h-100">
                <i class="bi bi-arrow-up-circle text-danger fs-3"></i>
                <p class="text-white-50 mb-1 small">Total Pengeluaran</p>
                <h5 class="text-danger fw-bold" id="txtKeluar">Rp 0</h5>
            </div>
        </div>
    </div>

    <!-- Tombol Navigasi Operasional -->
    <h6 class="text-white-50 mb-3">Menu Operasional</h6>
    <div class="row g-3 mb-4">
        <div class="col-12">
            <button onclick="window.location.href='rekap_sekolah.html'" class="btn btn-outline-info w-100 py-3 text-start"><i class="bi bi-file-earmark-spreadsheet me-2"></i> Rekap Daftar Sekolah & Penerimaan</button>
        </div>
        <div class="col-12">
            <button onclick="window.location.href='validasi_v2.html'" class="btn btn-outline-warning w-100 py-3 text-start">
                <i class="bi bi-check-circle-fill me-2"></i> Validasi Transfer & Terima Tunai
            </button>
        </div>
        <div class="col-12">
            <button onclick="window.location.href='form_pengeluaran.html'" class="btn btn-neon w-100 py-3 text-start text-dark"><i class="bi bi-cart-dash me-2"></i> Catat Pengeluaran Panitia (Jasa/ATK)</button>
        </div>
        <div class="col-12">
            <button onclick="window.location.href='laporan_bku.html'" class="btn btn-outline-light w-100 py-3 text-start"><i class="bi bi-journal-check me-2"></i> Laporan BKU / RKAS</button>
        </div>
    </div>

    <!-- KARTU CETAK TRANSPORT -->
    <div class="card bg-dark text-white border-secondary mb-4 shadow">
        <div class="card-header border-secondary text-info fw-bold">
            <i class="bi bi-file-earmark-excel-fill me-2"></i> Cetak Format Transport Peserta
        </div>
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="small text-white-50">Sub Rayon</label>
                    <select id="trans-subrayon" class="form-select bg-dark text-white border-secondary">
                        <option value="Oebobo">Oebobo</option>
                        <option value="Kelapa Lima">Kelapa Lima</option>
                        <option value="Maulafa">Maulafa</option>
                        <option value="Alak">Alak</option>
                        <option value="Kota Raja">Kota Raja</option>
                        <option value="Kota Lama">Kota Lama</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="small text-white-50">Kategori Peserta</label>
                    <select id="trans-jabatan" class="form-select bg-dark text-white border-secondary">
                        <option value="Guru">Guru</option>
                        <option value="Kepala Sekolah">Kepala Sekolah</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="small text-white-50">Nominal Transport (Rp)</label>
                    <input type="text" id="trans-nominal" class="form-control bg-dark text-white border-secondary fw-bold" placeholder="Contoh: 150.000" oninput="this.value = this.value.replace(/[^0-9]/g, '').replace(/\B(?=(\d{3})+(?!\d))/g, '.')">
                </div>
                <div class="col-md-3 d-flex align-items-end">
                    <button class="btn btn-success w-100 fw-bold" onclick="downloadExcelTransport()">
                        <i class="bi bi-download me-2"></i> Unduh Excel
                    </button>
                </div>
            </div>
        </div>
    </div>

</div> <!-- Akhir dari Container Utama -->

<!-- Library Eksternal Dimuat di Sini (Sudah Tersusun Rapi) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Mesin Logika Javascript -->
<script>
    // JANGAN LUPA PASTE API KAPTEN DI SINI!
    const API_URL = "https://script.google.com/macros/s/AKfycbwLdvXuLpbUvBE666hblNZm4y1HuoogGUl8vdHorb-aT9s6T5X6xHwXAcPaeEvrZ5RS/exec";
    
    const userData = JSON.parse(localStorage.getItem('userLogin'));
    if(!userData || userData.role !== 'Bendahara_Panitia') window.location.href = "index.html";
    
    document.getElementById('namaPic').innerText = userData.nama_pic;

    const formatRp = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);

    async function muatDataKeuangan() {
        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'get_keuangan_panitia' })
            });
            const result = await response.json();

            if(result.status === 'success') {
                document.getElementById('txtSaldo').innerText = formatRp(result.data.saldo);
                document.getElementById('txtMasuk').innerText = formatRp(result.data.masuk);
                document.getElementById('txtKeluar').innerText = formatRp(result.data.keluar);
            }
        } catch (error) {
            console.error("Gagal menarik data keuangan: ", error);
        }
    }

    function logout() { localStorage.removeItem('userLogin'); window.location.href = "index.html"; }

    muatDataKeuangan();

    // Fungsi Cetak Transport + SweetAlert Pop-up Modern
    async function downloadExcelTransport() {
        const subrayon = document.getElementById('trans-subrayon').value;
        const jabatan = document.getElementById('trans-jabatan').value;
        
        // Sedot nilai dan hapus titik pemisah ribuan agar database tidak bingung
        const nominalRaw = document.getElementById('trans-nominal').value;
        const nominal = nominalRaw.replace(/\./g, ''); 

        if(!nominal) {
            Swal.fire({
                icon: 'warning',
                title: 'Tunggu Dulu Kapten!',
                text: 'Mohon isi besaran nominal transport terlebih dahulu.',
                confirmButtonColor: '#ffc107'
            });
            return;
        }

        let btn = document.querySelector('button[onclick="downloadExcelTransport()"]');
        let teksAsli = btn.innerHTML;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Menyusun Data...';
        btn.disabled = true;

        try {
            const res = await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ 
                    action: 'get_data_transport', 
                    subrayon: subrayon, 
                    jabatan: jabatan,
                    nominal: parseInt(nominal)
                })
            });
            const result = await res.json();

            if (result.status === 'success') {
                if (result.data && result.data.length > 0) {
                    const ws = XLSX.utils.json_to_sheet(result.data);
                    const wscols = [ {wch:5}, {wch:35}, {wch:30}, {wch:15}, {wch:20}, {wch:20}, {wch:25} ];
                    ws['!cols'] = wscols;

                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, "Tanda_Terima_Transport");

                    let namaFile = `Transport_${jabatan}_${subrayon}.xlsx`;
                    XLSX.writeFile(wb, namaFile);
                    
                    Swal.fire({
                        icon: 'success',
                        title: 'Berhasil!',
                        text: `File Excel Transport ${jabatan} wilayah ${subrayon} siap dicetak.`,
                        confirmButtonColor: '#198754'
                    });
                } else {
                    Swal.fire({
                        icon: 'info',
                        title: 'Data Kosong',
                        text: `Data ${jabatan} di ${subrayon} tidak ditemukan. (Cek apakah NPSN di Data_Peserta sudah sama persis dengan di DB_Sekolah).`,
                        confirmButtonColor: '#0dcaf0'
                    });
                }
            } else {
                // Menangkap error dari server (misalnya typo penamaan fungsi)
                Swal.fire({
                    icon: 'error',
                    title: 'Sistem Error',
                    text: result.message || 'Terjadi masalah pada logika server.',
                    confirmButtonColor: '#dc3545'
                });
            }
        } catch (error) {
            Swal.fire({
                icon: 'error',
                title: 'Koneksi Gagal',
                text: 'Terjadi masalah saat menghubungi server.',
                confirmButtonColor: '#dc3545'
            });
        } finally {
            btn.innerHTML = teksAsli;
            btn.disabled = false;
        }
    }
</script>
</body>
</html>

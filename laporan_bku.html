<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan BKU - EMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        body { background-color: #f8f9fa; color: #333; font-family: 'Segoe UI', sans-serif; }
        .bku-header { background: #0f172a; color: #00f2fe; padding: 20px; border-bottom: 5px solid #4facfe; }
        .table-bku th { background-color: #e9ecef; }
        .text-masuk { color: #198754; font-weight: 600; }
        .text-keluar { color: #dc3545; font-weight: 600; }
        @media print {
            body { background: #fff; }
            .no-print { display: none !important; }
            .bku-header { background: #fff; color: #000; border-bottom: 2px solid #000; }
            .table-bku th { background-color: #f0f0f0 !important; }
        }
    </style>
</head>
<body>

<div class="bku-header text-center mb-4">
    <div class="container">
        <h4 class="fw-bold mb-0">BUKU KAS UMUM (BKU)</h4>
        <p class="mb-0 text-white-50">Panitia Workshop Kepala SD/MI Kota Kupang 2026</p>
    </div>
</div>

<div class="container mb-5">
    <div class="d-flex justify-content-between mb-3 no-print">
        <button class="btn btn-dark" onclick="window.location.href='dashboard_bendahara_panitia.html'"><i class="bi bi-arrow-left"></i> Kembali</button>
        <button class="btn btn-outline-primary" onclick="window.print()"><i class="bi bi-printer"></i> Cetak PDF/Print</button>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0 overflow-auto">
            <table class="table table-bordered table-bku table-hover mb-0" style="min-width: 800px;">
                <thead>
                    <tr class="text-center align-middle">
                        <th width="5%">No</th>
                        <th width="15%">Tanggal</th>
                        <th width="35%">Uraian Keterangan</th>
                        <th width="15%">Penerimaan (Rp)</th>
                        <th width="15%">Pengeluaran (Rp)</th>
                        <th width="15%">Saldo (Rp)</th>
                    </tr>
                </thead>
                <tbody id="tabelBKU">
                    <tr><td colspan="6" class="text-center py-4">Memuat data pembukuan...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwLdvXuLpbUvBE666hblNZm4y1HuoogGUl8vdHorb-aT9s6T5X6xHwXAcPaeEvrZ5RS/exec";
    const userData = JSON.parse(localStorage.getItem('userLogin'));
    if(!userData || userData.role !== 'Bendahara_Panitia') window.location.href = "index.html";

    const formatRp = (angka) => new Intl.NumberFormat('id-ID', { minimumFractionDigits: 0 }).format(angka);
    
    // Format Tanggal jadi DD/MM/YYYY
    const formatTgl = (tglStr) => {
        const d = new Date(tglStr);
        return `${d.getDate().toString().padStart(2,'0')}/${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getFullYear()}`;
    };

    async function muatLaporanBKU() {
        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'get_laporan_bku' })
            });
            const result = await response.json();

            let htmlTable = '';
            let saldoBerjalan = 0;

            if(result.status === 'success' && result.data.length > 0) {
                result.data.forEach((trx, index) => {
                    let tdMasuk = '-';
                    let tdKeluar = '-';

                    if (trx.tipe === 'Masuk') {
                        saldoBerjalan += Number(trx.nominal);
                        tdMasuk = formatRp(trx.nominal);
                    } else if (trx.tipe === 'Keluar') {
                        saldoBerjalan -= Number(trx.nominal);
                        tdKeluar = formatRp(trx.nominal);
                    }

                    htmlTable += `
                        <tr>
                            <td class="text-center">${index + 1}</td>
                            <td class="text-center">${formatTgl(trx.tanggal)}</td>
                            <td>${trx.keterangan}</td>
                            <td class="text-end text-masuk">${tdMasuk}</td>
                            <td class="text-end text-keluar">${tdKeluar}</td>
                            <td class="text-end fw-bold">${formatRp(saldoBerjalan)}</td>
                        </tr>
                    `;
                });
                
                // Baris Total Akhir
                htmlTable += `
                    <tr class="table-dark text-dark fw-bold" style="background-color: #dee2e6;">
                        <td colspan="3" class="text-end py-3">SALDO KAS AKHIR :</td>
                        <td colspan="3" class="text-center py-3 fs-5">Rp ${formatRp(saldoBerjalan)}</td>
                    </tr>
                `;

                document.getElementById('tabelBKU').innerHTML = htmlTable;
            } else {
                document.getElementById('tabelBKU').innerHTML = '<tr><td colspan="6" class="text-center py-4">Belum ada transaksi keuangan.</td></tr>';
            }
        } catch (error) {
            document.getElementById('tabelBKU').innerHTML = '<tr><td colspan="6" class="text-danger text-center py-4">Gagal memuat data dari server.</td></tr>';
        }
    }

    muatLaporanBKU();
</script>
</body>
</html>

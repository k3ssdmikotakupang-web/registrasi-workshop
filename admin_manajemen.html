<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Sistem - EMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background-color: #0f172a; color: #ffffff; font-family: 'Segoe UI', sans-serif; padding-bottom: 50px; }
        .glass-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 15px; }
        .form-control, .form-select { background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.2); color: white; }
        .form-control:focus, .form-select:focus { background: rgba(0, 0, 0, 0.4); border-color: #00f2fe; color: white; box-shadow: 0 0 10px rgba(0, 242, 254, 0.3); }
        .swal2-popup.swal-dark { background: #1e293b !important; color: #ffffff !important; border-radius: 15px !important; }
    </style>
</head>
<body>
<div class="container mt-4">
    <button class="btn btn-outline-secondary mb-3" onclick="window.location.href='dashboard_admin.html'"><i class="bi bi-arrow-left"></i> Kembali ke Dasbor</button>

    <!-- ZONA HIJAU: TAMBAH AKUN -->
    <div class="glass-card p-4 mb-4" style="border-left: 4px solid #00f2fe;">
        <h5 class="text-info fw-bold"><i class="bi bi-person-plus-fill"></i> Tambah Akun Baru</h5>
        <p class="small text-white-50">Buat akun untuk Panitia atau Bendahara Subrayon baru.</p>
        
        <div class="row g-2 mb-3">
            <div class="col-md-6">
                <label class="small text-info">Username (Tanpa Spasi)</label>
                <input type="text" id="a_user" class="form-control" placeholder="Contoh: oebobo_01">
            </div>
            <div class="col-md-6">
                <label class="small text-info">Password</label>
                <input type="text" id="a_pass" class="form-control" placeholder="Minimal 6 karakter">
            </div>
        </div>
        <div class="row g-2 mb-3">
            <div class="col-md-4">
                <label class="small text-info">Role / Peran</label>
                <select id="a_role" class="form-select">
                    <option value="Bendahara_Subrayon">Bendahara Subrayon</option>
                    <option value="Admin_Sekolah">Admin Sekolah Baru</option>
                    <option value="Bendahara_Panitia">Panitia / Keuangan</option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="small text-info">Wilayah Subrayon</label>
                <input type="text" id="a_rayon" class="form-control" placeholder="Contoh: Oebobo 1">
            </div>
            <div class="col-md-4">
                <label class="small text-info">Nama Lengkap Pemegang Akun</label>
                <input type="text" id="a_nama" class="form-control" placeholder="Nama pengurus">
            </div>
        </div>
        <button class="btn btn-primary w-100 fw-bold" id="btnTambah" onclick="simpanAkun()"><i class="bi bi-save"></i> Buat Akun</button>
    </div>

    <!-- ZONA MERAH: RESET PESERTA -->
    <div class="glass-card p-4" style="border-left: 4px solid #dc3545;">
        <h5 class="text-danger fw-bold"><i class="bi bi-exclamation-triangle-fill"></i> Reset / Hapus Peserta</h5>
        <p class="small text-white-50">Jika admin sekolah salah ketik nama, hapus data lamanya di sini agar mereka bisa input ulang.</p>
        
        <div class="input-group mb-3">
            <input type="text" id="hapus_id" class="form-control" placeholder="Masukkan ID QR Peserta (Contoh: QR-12345678)">
            <button class="btn btn-danger" id="btnHapus" onclick="hapusPeserta()"><i class="bi bi-trash-fill"></i> Hapus Permanen</button>
        </div>
    </div>

</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwLdvXuLpbUvBE666hblNZm4y1HuoogGUl8vdHorb-aT9s6T5X6xHwXAcPaeEvrZ5RS/exec";
    const userData = JSON.parse(localStorage.getItem('userLogin'));
    if(!userData || userData.role !== 'Admin_Pusat') window.location.href = "index.html";
    
    const Toast = Swal.mixin({ customClass: { popup: 'swal-dark' }, confirmButtonColor: '#00f2fe' });

    async function simpanAkun() {
        const u = document.getElementById('a_user').value;
        const p = document.getElementById('a_pass').value;
        const r = document.getElementById('a_role').value;
        const s = document.getElementById('a_rayon').value;
        const n = document.getElementById('a_nama').value;

        if(!u || !p || !n) { Swal.fire('Data Tidak Lengkap', 'Username, Password, dan Nama wajib diisi.', 'warning'); return; }

        document.getElementById('btnTambah').innerHTML = 'Memproses...';
        try {
            const res = await fetch(API_URL, {
                method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'add_user', username: u, password: p, role: r, subrayon: s, nama_pic: n })
            });
            const result = await res.json();
            if(result.status === 'success') {
                Swal.fire({ icon: 'success', title: 'Sukses', text: result.message, customClass: { popup: 'swal-dark' }, background: '#1e293b', color: '#fff' });
                // Kosongkan form
                document.getElementById('a_user').value = ''; document.getElementById('a_pass').value = ''; document.getElementById('a_nama').value = '';
            } else {
                Swal.fire({ icon: 'error', title: 'Gagal', text: result.message, customClass: { popup: 'swal-dark' }, background: '#1e293b', color: '#fff' });
            }
        } catch(e) { Swal.fire('Error', 'Gagal tersambung ke server.', 'error'); }
        document.getElementById('btnTambah').innerHTML = '<i class="bi bi-save"></i> Buat Akun';
    }

    async function hapusPeserta() {
        const id = document.getElementById('hapus_id').value;
        if(!id) { Swal.fire('Kosong', 'Masukkan ID QR yang ingin dihapus.', 'warning'); return; }

        Swal.fire({
            title: 'Yakin hapus peserta ini?',
            text: "Data yang dihapus tidak bisa dikembalikan!",
            icon: 'warning', showCancelButton: true, confirmButtonColor: '#dc3545', cancelButtonColor: '#6c757d', confirmButtonText: 'Ya, Hapus!',
            customClass: { popup: 'swal-dark' }, background: '#1e293b', color: '#fff'
        }).then(async (resConfirm) => {
            if (resConfirm.isConfirmed) {
                document.getElementById('btnHapus').innerHTML = 'Menghapus...';
                try {
                    const res = await fetch(API_URL, {
                        method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: 'hapus_peserta', id_qr: id })
                    });
                    const result = await res.json();
                    if(result.status === 'success') {
                        Swal.fire({ icon: 'success', title: 'Terhapus!', text: result.message, customClass: { popup: 'swal-dark' }, background: '#1e293b', color: '#fff' });
                        document.getElementById('hapus_id').value = '';
                    } else {
                        Swal.fire({ icon: 'error', title: 'Gagal', text: result.message, customClass: { popup: 'swal-dark' }, background: '#1e293b', color: '#fff' });
                    }
                } catch(e) { Swal.fire('Error', 'Koneksi gagal.', 'error'); }
                document.getElementById('btnHapus').innerHTML = '<i class="bi bi-trash-fill"></i> Hapus Permanen';
            }
        });
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

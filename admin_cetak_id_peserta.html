<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cetak Massal ID Card Peserta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body { background-color: #f1f5f9; font-family: 'Poppins', sans-serif; }
        
        .id-card-wrapper { 
            width: 10.5cm; height: 15cm; background: #ffffff; border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.15); position: relative; 
            display: flex; flex-direction: column; 
            border: 1px solid #cbd5e1; page-break-inside: avoid; margin-bottom: 20px;
        }

        .header-maroon { 
            background: linear-gradient(135deg, #7f1d1d, #991b1b); color: #fbbf24; 
            padding: 25px 10px 90px 10px; 
            border-bottom-left-radius: 35px; border-bottom-right-radius: 35px; 
            text-align: center; 
        }
        .header-maroon h5 { font-size: 1.05rem; font-weight: 800; margin: 0 0 5px 0; text-transform: uppercase; letter-spacing: 0.5px; }
        .header-maroon p { font-size: 0.7rem; color: #fca5a5; margin: 0; line-height: 1.3; font-weight: 600; text-transform: uppercase; }

        .card-main { 
            background: #fff; border-radius: 20px; 
            padding: 0 15px 25px 15px; margin: -50px 15px 15px 15px; 
            position: relative; z-index: 10; text-align: center; border-top: 5px solid #fbbf24;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08); flex-grow: 1;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        
        .foto-box { 
            width: 110px; height: 110px; background: #f8fafc; border-radius: 50%; border: 4px solid #fbbf24; 
            margin: -65px auto 10px auto; display: flex; align-items: center; justify-content: center; 
            font-size: 3.5rem; color: #94a3b8; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.15); 
            position: relative; z-index: 11; 
        }
        .foto-box img { width: 100%; height: 100%; object-fit: cover; }

        .id-name { font-size: 1.15rem; font-weight: 800; color: #0f172a; margin-bottom: 2px; line-height: 1.2; text-transform: uppercase; }
        .id-school { font-size: 0.8rem; font-weight: 600; color: #64748b; margin-bottom: 2px; line-height: 1.2; }
        .id-subrayon { font-size: 0.75rem; font-weight: 700; color: #dc3545; margin-bottom: 10px; }
        
        .id-role { 
            display: inline-block; background: #7f1d1d; color: #fbbf24; font-size: 0.8rem; 
            font-weight: 800; padding: 6px 20px; border-radius: 20px; text-transform: uppercase; 
            letter-spacing: 0.5px; margin-bottom: 10px; 
        }

        .qr-box { background: #f8fafc; padding: 10px; border-radius: 12px; display: inline-block; border: 2px dashed #cbd5e1; margin-bottom: 5px; }
        .qr-box img { width: 125px; height: 125px; display: block; }
        .id-qr-text { font-size: 0.85rem; font-weight: 800; color: #7f1d1d; letter-spacing: 1px; margin-bottom: 0; }

        @media print {
            body { background: none !important; }
            .no-print { display: none !important; }
            .id-card-wrapper { box-shadow: none !important; border: 1px dashed #cbd5e1 !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; margin-bottom: 10px; }
        }
    </style>
</head>
<body>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4 no-print bg-white p-3 rounded shadow-sm" style="border-top: 4px solid #7f1d1d;">
        <h4 class="fw-bold text-dark mb-0"><i class="bi bi-people-fill me-2 text-danger"></i> Cetak Massal ID Card Peserta</h4>
        <div>
            <button class="btn btn-danger fw-bold" onclick="window.print()"><i class="bi bi-printer-fill me-2"></i> Cetak Semua</button>
            <button class="btn btn-outline-secondary ms-2" onclick="window.history.back()"><i class="bi bi-arrow-left"></i> Kembali</button>
        </div>
    </div>

    <div id="loading" class="text-center py-5">
        <div class="spinner-border text-danger" style="width: 3rem; height: 3rem;" role="status"></div>
        <p class="text-muted mt-3 fw-bold">Menarik Data Seluruh Peserta...</p>
    </div>
    <div class="d-flex flex-wrap justify-content-center gap-4" id="containerCard"></div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyXhfdbHD1LhvGR_AKTfHVpVtLOm3DOT4hx7zp9YwdQGeBHdni0JXuMbqBYs5j5X5fx/exec";

    async function muatDataPeserta() {
        try {
            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'get_all_peserta' }) });
            const result = await res.json();
            document.getElementById('loading').classList.add('d-none');

            if(result.status === 'success' && result.data.length > 0) {
                let html = '';
                result.data.forEach(p => {
                    let qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=350x350&data=${encodeURIComponent(p.id_qr)}`;
                    let fotoHtml = `<i class="bi bi-person-fill"></i>`;
                    
                    if(p.foto_url && p.foto_url.trim() !== '') {
                        let urlFoto = p.foto_url; let fileIdMatch = urlFoto.match(/[-\w]{25,}/);
                        if (fileIdMatch) { urlFoto = 'https://lh3.googleusercontent.com/d/' + fileIdMatch[0]; }
                        fotoHtml = `<img src="${urlFoto}" alt="Foto Profil">`;
                    }
                    
                    html += `
                        <div class="id-card-wrapper">
                            <div class="header-maroon">
                                <h5>K3S SD/MI KOTA KUPANG</h5>
                                <p>Panitia Pelaksana Workshop Manajemen Kepala SD/MI Kota Kupang 2026</p>
                            </div>
                            <div class="card-main">
                                <div class="foto-box">${fotoHtml}</div>
                                <div class="id-name">${p.nama}</div>
                                <div class="id-school">${p.sekolah || 'Asal Sekolah Tidak Ditemukan'}</div>
                                <div class="id-subrayon"><i class="bi bi-geo-alt-fill"></i> Subrayon: ${p.subrayon || '-'}</div>
                                <div><span class="id-role">${p.jabatan}</span></div>
                                <div class="qr-box"><img src="${qrUrl}" alt="QR Validasi"></div>
                                <div class="id-qr-text">${p.id_qr}</div>
                            </div>
                        </div>
                    `;
                });
                document.getElementById('containerCard').innerHTML = html;
            } else { document.getElementById('containerCard').innerHTML = '<div class="col-12 text-center text-muted fw-bold">Belum ada data peserta yang terdaftar.</div>'; }
        } catch(e) { document.getElementById('loading').innerHTML = '<span class="text-danger fw-bold">Gagal memuat data dari server.</span>'; }
    }
    
    // Keamanan Admin
    const userData = JSON.parse(localStorage.getItem('userLogin'));
    if (!userData || (!userData.role.includes('admin') && !userData.role.includes('panitia'))) window.location.href = "index.html";
    else muatDataPeserta();
</script>
</body>
</html>

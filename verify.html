<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Kwitansi Resmi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { background-color: #e2e8f0; font-family: 'Plus Jakarta Sans', sans-serif; color: #000; }
        
        .kwitansi-box { 
            background: #fff; border: 2px solid #000; 
            width: 21cm; min-height: 10.5cm; height: auto;
            margin: 20px auto; padding: 15px 25px; 
            position: relative; overflow: hidden; 
            color: #000; box-sizing: border-box; 
        }
        
        .kwitansi-box::before {
            content: "K3S SD/MI KOTA KUPANG K3S SD/MI KOTA KUPANG K3S SD/MI KOTA KUPANG \A K3S SD/MI KOTA KUPANG K3S SD/MI KOTA KUPANG K3S SD/MI KOTA KUPANG \A K3S SD/MI KOTA KUPANG K3S SD/MI KOTA KUPANG K3S SD/MI KOTA KUPANG";
            white-space: pre-wrap; position: absolute; top: -50%; left: -20%; width: 200%; height: 200%;
            font-size: 14px; font-weight: 800; color: rgba(0, 0, 0, 0.03); transform: rotate(-25deg); z-index: 0; pointer-events: none; line-height: 3; text-align: center;
        }
        
        .k-header { text-align: center; border-bottom: 2px solid #000; padding-bottom: 5px; margin-bottom: 10px; position: relative; z-index: 1; }
        .k-title { font-weight: 800; font-size: 1.2rem; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 2px; }
        .k-subtitle { font-size: 0.75rem; font-weight: 700; }
        .k-no { display: inline-block; padding: 2px 10px; border: 1px solid #000; font-family: monospace; font-size: 0.8rem; margin-top: 5px; font-weight: bold; background: #fff; }
        
        .k-body { position: relative; z-index: 1; font-size: 0.8rem; line-height: 1.4; }
        .k-row { display: flex; margin-bottom: 4px; }
        .k-label { width: 30%; font-weight: 600; color: #000; }
        .k-value { width: 70%; font-weight: 700; border-bottom: 1px dotted #000; padding-bottom: 1px; }
        .k-nominal-box { border: 2px solid #000; padding: 4px 15px; font-size: 1.1rem; font-weight: 800; display: inline-block; margin: 8px 0; background: #f8f9fa; }
        
        .k-footer { display: flex; justify-content: space-between; align-items: end; margin-top: 5px; position: relative; z-index: 1; }
        .k-qr-box { padding: 3px; border: 1px solid #000; display: inline-block; background: #fff; }
        
        /* Penyesuaian Tanda Tangan Tunggal (Bendahara Saja di Kanan) */
        .k-ttd-container { width: 35%; text-align: center; font-size: 0.8rem; margin-left: auto; }
        .k-sign-box { margin-top: 45px; }
        .k-sign-name { font-weight: 800; border-bottom: 1px solid #000; padding-bottom: 2px; display: inline-block; width: 100%; }
        .k-sign-nip { font-size: 0.75rem; margin-top: 2px; }
        
        .btn-print { background: #000; color: #fff; font-weight: 700; padding: 10px 25px; display: block; width: fit-content; margin: 0 auto; border-radius: 5px; }
    </style>
</head>
<body>

<div class="container py-4">
    <div id="box-loading" class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <h5 class="mt-3 text-secondary">Memverifikasi Transaksi...</h5>
    </div>

    <div id="box-valid" class="d-none">
        <div class="kwitansi-box" id="kwitansi-capture">
            <div class="k-header">
                <div class="k-title">E-Kwitansi Pembayaran</div>
                <div class="k-subtitle">K3S SD/MI Kota Kupang</div>
                <div class="k-no">NO: <span id="v-no"></span></div>
            </div>
            
            <div class="k-body">
                <div class="k-row"><div class="k-label">Telah Terima Dari</div><div class="k-value" id="v-pembayar"></div></div>
                <div class="k-row"><div class="k-label">Asal Sekolah</div><div class="k-value"><span id="v-sekolah"></span> (NPSN: <span id="v-npsn"></span>)</div></div>
                <div class="k-row"><div class="k-label">Metode Pembayaran</div><div class="k-value" id="v-metode"></div></div>
                <div class="k-row"><div class="k-label">Waktu Transaksi</div><div class="k-value" id="v-tgl"></div></div>
                <div class="k-row"><div class="k-label">Tujuan Pembayaran</div><div class="k-value" style="border: none;">Kontribusi Workshop Manajemen Kepala SD/MI Kota Kupang 2026</div></div>
                
                <div class="k-nominal-box" id="v-nominal"></div>
            </div>
            
            <div class="k-footer">
                <div class="k-qr-box"><img id="v-qr" src="" width="70" height="70"></div>
                
                <!-- BLOK TANDA TANGAN (Hanya Bendahara Panitia) -->
                <div class="k-ttd-container">
                    <div>Kupang, <span id="v-tgl-pendek"></span></div>
                    <div class="fw-bold">Bendahara Panitia</div>
                    <div class="k-sign-box">
                        <div class="k-sign-name" id="nama-bendahara">Memuat...</div>
                        <div class="k-sign-nip">NIP. <span id="nip-bendahara">-</span></div>
                    </div>
                </div>
            </div>
        </div>

        <button class="btn btn-print mb-5 shadow" onclick="downloadSebagaiGambar()">
            UNDUH KWITANSI DIGITAL
        </button>
    </div>
</div>

<script>
    // WAJIB PASTE API URL KAPTEN DI SINI!
    const API_URL = "https://script.google.com/macros/s/AKfycbwLdvXuLpbUvBE666hblNZm4y1HuoogGUl8vdHorb-aT9s6T5X6xHwXAcPaeEvrZ5RS/exec";
    
    const urlParams = new URLSearchParams(window.location.search);
    const kw = urlParams.get('kw');

    if(kw) {
        fetch(API_URL, { 
            method: 'POST', 
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'get_receipt_info', noKwitansi: kw }) 
        }).then(r => r.json()).then(res => {
            document.getElementById('box-loading').classList.add('d-none');
            if(res.success) {
                document.getElementById('box-valid').classList.remove('d-none');
                document.getElementById('v-no').innerText = res.receipt.noKwitansi;
                document.getElementById('v-pembayar').innerText = res.receipt.namaPembayar;
                document.getElementById('v-sekolah').innerText = res.receipt.namaSekolah;
                document.getElementById('v-npsn').innerText = res.receipt.npsn;
                document.getElementById('v-nominal').innerText = "Rp " + Number(res.receipt.nominal).toLocaleString('id-ID');
                document.getElementById('v-metode').innerText = res.receipt.metode;
                
                let tgl = new Date(res.receipt.tglBayar);
                if(!isNaN(tgl)) {
                    let optionsDate = { day: '2-digit', month: 'long', year: 'numeric' };
                    let optionsTime = { hour: '2-digit', minute:'2-digit' };
                    document.getElementById('v-tgl').innerText = tgl.toLocaleDateString('id-ID', optionsDate) + ' | Pukul ' + tgl.toLocaleTimeString('id-ID', optionsTime) + ' WITA';
                    document.getElementById('v-tgl-pendek').innerText = tgl.toLocaleDateString('id-ID', optionsDate);
                } else {
                    document.getElementById('v-tgl').innerText = res.receipt.tglBayar;
                    document.getElementById('v-tgl-pendek').innerText = res.receipt.tglBayar.split(' ')[0];
                }
                
                let isiQR = "No. TRX: " + res.receipt.noKwitansi + " | Pembayar: " + res.receipt.namaSekolah + " | Total: Rp " + Number(res.receipt.nominal).toLocaleString('id-ID') + " | Waktu: " + document.getElementById('v-tgl-pendek').innerText;
                document.getElementById('v-qr').src = "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=" + encodeURIComponent(isiQR);
                
                fetchPejabat();
            } else {
                document.getElementById('box-loading').classList.remove('d-none');
                document.getElementById('box-loading').innerHTML = '<h4 class="text-danger fw-bold">Data Kwitansi Tidak Ditemukan.</h4>';
            }
        }).catch(err => {
            document.getElementById('box-loading').innerHTML = '<h4 class="text-danger fw-bold">Gagal Menghubungi Server.</h4>';
        });
    }

    function fetchPejabat() {
        fetch(API_URL, { 
            method: 'POST', 
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'get_pejabat_kepanitiaan' }) 
        }).then(r => r.json()).then(resP => {
            if(resP.status === 'success') {
                document.getElementById('nama-bendahara').innerText = resP.data.bendahara.nama;
                document.getElementById('nip-bendahara').innerText = (resP.data.bendahara.nip === '-' || !resP.data.bendahara.nip) ? '' : resP.data.bendahara.nip;
            } else {
                document.getElementById('nama-bendahara').innerText = "Belum Diatur";
                document.getElementById('nip-bendahara').innerText = "-";
            }
        });
    }

    function downloadSebagaiGambar() {
        const box = document.getElementById('kwitansi-capture');
        html2canvas(box, { scale: 2 }).then(canvas => {
            let link = document.createElement('a');
            link.download = document.getElementById('v-no').innerText + '.jpg';
            link.href = canvas.toDataURL('image/jpeg', 0.9);
            link.click();
        });
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifikasi Kwitansi Digital - YPKR Event</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #0b0f19; color: white; font-family: sans-serif; padding: 20px; }
    .card-verify { background: #151c2e; border: 2px solid #38ef7d; border-radius: 20px; box-shadow: 0 0 25px rgba(56, 239, 125, 0.3); }
  </style>
</head>
<body>

<div class="container mt-4" style="max-width: 500px;">
  <div class="card card-verify p-4 text-center" id="box-loading">
    <div class="spinner-border text-success mx-auto mb-3"></div>
    <p>Memverifikasi Keaslian Kwitansi Digital...</p>
  </div>

  <div class="card card-verify p-4 d-none" id="box-valid">
    <div class="text-center mb-3">
      <i class="bi bi-patch-check-fill text-success display-1"></i>
      <h3 class="fw-bold text-success mt-2">KWITANSI VALID & ASLI</h3>
      <p class="text-muted small mb-0">Terverifikasi Sistem Database YPKR 2026</p>
    </div>
    
    <table class="table table-dark table-striped small rounded overflow-hidden">
      <tr><td>No. Kwitansi</td><td class="fw-bold text-warning" id="v-no">-</td></tr>
      <tr><td>Telah Terima Dari</td><td class="fw-bold" id="v-pembayar">-</td></tr>
      <tr><td>Sekolah</td><td id="v-sekolah">-</td></tr>
      <tr><td>NPSN</td><td id="v-npsn">-</td></tr>
      <tr><td>Nominal</td><td class="fw-bold text-success" id="v-nominal">-</td></tr>
      <tr><td>Metode</td><td id="v-metode">-</td></tr>
      <tr><td>Tanggal Bayar</td><td id="v-tgl">-</td></tr>
      <tr><td>Penerima/Operator</td><td id="v-operator">-</td></tr>
    </table>
  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbwLdvXuLpbUvBE666hblNZm4y1HuoogGUl8vdHorb-aT9s6T5X6xHwXAcPaeEvrZ5RS/exec";
  const urlParams = new URLSearchParams(window.location.search);
  const kw = urlParams.get('kw');

  if(kw) {
    fetch(API_URL, {
      method: 'POST',
      body: new URLSearchParams({ action: 'get_receipt_info', noKwitansi: kw })
    })
    .then(r => r.json())
    .then(res => {
      document.getElementById('box-loading').classList.add('d-none');
      if(res.success) {
        document.getElementById('box-valid').classList.remove('d-none');
        document.getElementById('v-no').innerText = res.receipt.noKwitansi;
        document.getElementById('v-pembayar').innerText = res.receipt.namaPembayar;
        document.getElementById('v-sekolah').innerText = res.receipt.namaSekolah;
        document.getElementById('v-npsn').innerText = res.receipt.npsn;
        document.getElementById('v-nominal').innerText = "Rp " + Number(res.receipt.nominal).toLocaleString('id-ID');
        document.getElementById('v-metode').innerText = res.receipt.metode;
        document.getElementById('v-tgl').innerText = res.receipt.tglBayar;
        document.getElementById('v-operator').innerText = res.receipt.operator;
      } else {
        alert("Kwitansi Tidak Ditemukan.");
      }
    });
  }
</script>
</body>
</html>

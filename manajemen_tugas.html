<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papan Manajemen Tugas - EMS K3S Kupang</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        body { background-color: #f1f5f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #1e293b; padding-bottom: 50px; }
        .nav-app { background: #0f172a; border-bottom: 4px solid #00f2fe; }
        
        .papan-kolom { background: #e2e8f0; border-radius: 10px; padding: 15px; min-height: 70vh; }
        .judul-kolom { font-weight: 700; text-transform: uppercase; font-size: 0.9rem; padding-bottom: 10px; border-bottom: 2px solid #cbd5e1; margin-bottom: 15px; }
        
        .kolom-belum { border-top: 4px solid #64748b; }
        .kolom-proses { border-top: 4px solid #f59e0b; }
        .kolom-kendala { border-top: 4px solid #ef4444; }
        .kolom-selesai { border-top: 4px solid #10b981; }

        .kartu-tugas { background: #ffffff; border-radius: 8px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); border-left: 4px solid transparent; transition: transform 0.2s; }
        .kartu-tugas:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        
        .kartu-belum { border-left-color: #64748b; }
        .kartu-proses { border-left-color: #f59e0b; }
        .kartu-kendala { border-left-color: #ef4444; }
        .kartu-selesai { border-left-color: #10b981; opacity: 0.8; }

        .kartu-judul { font-weight: 700; font-size: 1rem; color: #0f172a; margin-bottom: 5px; line-height: 1.3; }
        .kartu-info { font-size: 0.8rem; color: #64748b; margin-bottom: 3px; }
        
        .progress-container { background: #ffffff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); margin-bottom: 30px; }
        .mini-progress-title { font-size: 0.75rem; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark nav-app sticky-top mb-4 py-3">
    <div class="container-fluid px-4">
        <span class="navbar-brand fw-bold"><i class="bi bi-kanban me-2 text-info"></i> Ruang Kendali Kepanitiaan</span>
        <button class="btn btn-outline-light btn-sm fw-bold" onclick="kembaliKeDasbor()"><i class="bi bi-arrow-left"></i> Kembali ke Beranda</button>
    </div>
</nav>

<div class="container-fluid px-4">
    
    <div id="alertMendesak"></div>

    <!-- Indikator Kesiapan Acara & Tahapan -->
    <div class="progress-container">
        <div class="d-flex justify-content-between align-items-end mb-2">
            <div>
                <h5 class="fw-bold mb-0">Indikator Kesiapan Acara Keseluruhan</h5>
                <small class="text-muted">K3S SD/MI Kota Kupang</small>
            </div>
            <h2 class="fw-bold text-success mb-0" id="teksPersentase">0%</h2>
        </div>
        <div class="progress mb-4" style="height: 25px; border-radius: 20px; background-color: #e2e8f0;">
            <div id="barPersentase" class="progress-bar progress-bar-striped progress-bar-animated bg-success" role="progressbar" style="width: 0%;"></div>
        </div>

        <div class="row g-3 border-top pt-3 mb-2">
            <div class="col-6 col-md-3">
                <div class="mini-progress-title text-info"><i class="bi bi-1-circle-fill me-1"></i> Perencanaan</div>
                <div class="progress" style="height: 8px;"><div id="barPerencanaan" class="progress-bar bg-info" style="width: 0%;"></div></div>
                <div class="text-end small text-muted mt-1" id="txtPerencanaan">0% (0/0)</div>
            </div>
            <div class="col-6 col-md-3">
                <div class="mini-progress-title text-warning"><i class="bi bi-2-circle-fill me-1"></i> Persiapan</div>
                <div class="progress" style="height: 8px;"><div id="barPersiapan" class="progress-bar bg-warning" style="width: 0%;"></div></div>
                <div class="text-end small text-muted mt-1" id="txtPersiapan">0% (0/0)</div>
            </div>
            <div class="col-6 col-md-3">
                <div class="mini-progress-title text-primary"><i class="bi bi-3-circle-fill me-1"></i> Pelaksanaan</div>
                <div class="progress" style="height: 8px;"><div id="barPelaksanaan" class="progress-bar bg-primary" style="width: 0%;"></div></div>
                <div class="text-end small text-muted mt-1" id="txtPelaksanaan">0% (0/0)</div>
            </div>
            <div class="col-6 col-md-3">
                <div class="mini-progress-title text-success"><i class="bi bi-4-circle-fill me-1"></i> Pasca-Acara</div>
                <div class="progress" style="height: 8px;"><div id="barPasca" class="progress-bar bg-success" style="width: 0%;"></div></div>
                <div class="text-end small text-muted mt-1" id="txtPasca">0% (0/0)</div>
            </div>
        </div>
        
        <div class="d-flex flex-wrap justify-content-between align-items-center mt-3 pt-3 border-top gap-2">
            <div class="d-flex flex-wrap gap-2">
                <button class="btn btn-primary fw-bold shadow-sm" id="btnTambahTugas" data-bs-toggle="modal" data-bs-target="#modalTambahTugas">
                    <i class="bi bi-plus-lg me-2"></i> Tambah Pekerjaan Baru
                </button>
                
                <div class="btn-group shadow-sm" id="filterTugasContainer">
                    <input type="radio" class="btn-check" name="filterTugas" id="filterSemua" autocomplete="off" onchange="terapkanFilter()">
                    <label class="btn btn-outline-primary fw-bold" for="filterSemua"><i class="bi bi-globe me-1"></i> Semua Pekerjaan</label>

                    <input type="radio" class="btn-check" name="filterTugas" id="filterSaya" autocomplete="off" onchange="terapkanFilter()">
                    <label class="btn btn-outline-primary fw-bold" for="filterSaya"><i class="bi bi-people-fill me-1"></i> Tugas Divisi Saya</label>
                </div>
            </div>
            <button class="btn btn-outline-secondary fw-bold bg-white shadow-sm" onclick="muatDataPapan()">
                <i class="bi bi-arrow-clockwise me-1"></i> Segarkan Data
            </button>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-3"><div class="papan-kolom kolom-belum"><div class="judul-kolom text-secondary"><i class="bi bi-list-task me-2"></i>Belum Mulai <span class="badge bg-secondary float-end" id="jmlBelum">0</span></div><div id="wadahBelum"></div></div></div>
        <div class="col-md-3"><div class="papan-kolom kolom-proses"><div class="judul-kolom text-warning"><i class="bi bi-gear-fill me-2"></i>Dikerjakan <span class="badge bg-warning text-dark float-end" id="jmlProses">0</span></div><div id="wadahProses"></div></div></div>
        <div class="col-md-3"><div class="papan-kolom kolom-kendala"><div class="judul-kolom text-danger"><i class="bi bi-exclamation-triangle-fill me-2"></i>Terkendala <span class="badge bg-danger float-end" id="jmlKendala">0</span></div><div id="wadahKendala"></div></div></div>
        <div class="col-md-3"><div class="papan-kolom kolom-selesai"><div class="judul-kolom text-success"><i class="bi bi-check-circle-fill me-2"></i>Selesai <span class="badge bg-success float-end" id="jmlSelesai">0</span></div><div id="wadahSelesai"></div></div></div>
    </div>
</div>

<!-- Modal Tambah Pekerjaan -->
<div class="modal fade" id="modalTambahTugas" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title fw-bold">Penugasan Baru</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Tutup"></button>
            </div>
            <form id="formTugas" onsubmit="simpanTugas(event)">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Nama Pekerjaan</label>
                        <input type="text" class="form-control" id="inputPekerjaan" placeholder="Contoh: Menyiapkan Spanduk Utama" required>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Tahapan Kegiatan <span class="text-danger">*</span></label>
                            <select class="form-select border-info" id="inputTahapan" required>
                                <option value="">-- Pilih Tahapan --</option>
                                <option value="Perencanaan">1. Tahap Perencanaan</option>
                                <option value="Persiapan">2. Tahap Persiapan</option>
                                <option value="Pelaksanaan">3. Tahap Pelaksanaan</option>
                                <option value="Pasca-Acara">4. Pasca-Acara & Pelaporan</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Divisi / Penanggung Jawab <span class="text-danger">*</span></label>
                            <select class="form-select border-info" id="inputDivisi" required>
                                <option value="">Memuat daftar divisi...</option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Batas Waktu (Tanggal & Jam)</label>
                            <input type="datetime-local" class="form-control" id="inputWaktu" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">PIC Individu (Opsional)</label>
                            <select class="form-select" id="inputPic">
                                <option value="">-- Bebas / Tim --</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                    <button type="submit" class="btn btn-primary fw-bold" id="btnSimpan">Simpan Penugasan</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    // ⚠️ WAJIB PASTE API URL KAPTEN DI SINI! ⚠️
    const API_URL = "https://script.google.com/macros/s/AKfycbyXhfdbHD1LhvGR_AKTfHVpVtLOm3DOT4hx7zp9YwdQGeBHdni0JXuMbqBYs5j5X5fx/exec";

// --- BAGIAN YANG DISEMPURNAKAN ---
    const userData = JSON.parse(localStorage.getItem('userLogin'));
    
    if (!userData) {
        window.location.href = "index.html";
        return; // Menghentikan eksekusi skrip agar tidak error
    } else {
        let idUser = userData.id_panitia || userData.id || '';
        let roleUser = (userData.role || '').toLowerCase();
        
        // Meloloskan Admin Pusat, Admin, atau akun panitia berawalan PAN- / mengandung kata panitia
        if (roleUser !== 'admin_pusat' && roleUser !== 'admin' && !idUser.startsWith('PAN-') && !roleUser.includes('panitia')) {
            window.location.href = "index.html";
            return; // Menghentikan eksekusi skrip
        }
    }
    
    const isAdmin = (userData.role === 'Admin_Pusat');
    let dataGlobal = [];

    // FUNGSI PEMBERSIH TEKS (Menghindari error spasi dan huruf besar/kecil)
    const bersihkanTeks = (teks) => {
        return teks ? teks.toString().trim().toLowerCase() : '';
    };

    function kembaliKeDasbor() {
        if(isAdmin) window.location.href = "dashboard_admin.html";
        else if(userData.role === 'Bendahara_Panitia') window.location.href = "dashboard_bendahara_panitia.html";
        else window.location.href = "dashboard_panitia.html";
    }

    const formatTgl = (tglSting) => {
        if(!tglSting) return '-';
        let d = new Date(tglSting);
        if(isNaN(d)) return tglSting;
        return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }) + ' - ' + d.toLocaleTimeString('id-ID', { hour: '2-digit', minute:'2-digit' });
    };

    window.onload = function() {
        if(isAdmin) { document.getElementById('filterSemua').checked = true; } 
        else { document.getElementById('btnTambahTugas').style.display = 'none'; document.getElementById('filterSaya').checked = true; }
        muatDataPapan();
        if(isAdmin) tarikDaftarPanitia(); 
    };

    async function tarikDaftarPanitia() {
        try {
            const respon = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'get_all_panitia' }) });
            const hasil = await respon.json();
            
            let htmlPic = '<option value="">-- Bebas / Tim --</option>';
            let setDivisi = new Set();

            if(hasil.status === 'success') {
                hasil.data.forEach(p => { 
                    htmlPic += `<option value="${p.nama}">${p.nama} (${p.jabatan})</option>`; 
                    if(p.jabatan && p.jabatan !== '-') setDivisi.add(p.jabatan.toString().trim()); 
                });
                
                let htmlDivisi = '<option value="">-- Pilih Divisi / Jabatan --</option>';
                // Ubah Set ke Array, lalu urutkan sesuai abjad
                Array.from(setDivisi).sort().forEach(div => { htmlDivisi += `<option value="${div}">${div}</option>`; });
                document.getElementById('inputDivisi').innerHTML = htmlDivisi;
            } else { 
                htmlPic = '<option value="">Gagal memuat</option>'; 
                document.getElementById('inputDivisi').innerHTML = '<option value="">Gagal memuat divisi</option>'; 
            }
            document.getElementById('inputPic').innerHTML = htmlPic;
        } catch(e) { console.log(e); }
    }

    async function muatDataPapan() {
        document.getElementById('wadahBelum').innerHTML = '<div class="text-center py-4"><div class="spinner-border text-secondary spinner-border-sm"></div></div>';
        try {
            const respon = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'get_tugas' }) });
            const hasil = await respon.json();
            if(hasil.status === 'success') { dataGlobal = hasil.data; terapkanFilter(); } 
            else { Swal.fire('Gagal!', hasil.message, 'error'); }
        } catch (e) { Swal.fire('Error', 'Gagal terhubung ke server.', 'error'); }
    }

    function terapkanFilter() {
        let filterMode = document.getElementById('filterSaya').checked ? 'saya' : 'semua';
        renderPapan(dataGlobal, filterMode);
    }

    function updateProgressBar(elementId, textId, dataObj) {
        let persentase = dataObj.total === 0 ? 0 : Math.round((dataObj.selesai / dataObj.total) * 100);
        document.getElementById(elementId).style.width = persentase + '%';
        document.getElementById(textId).innerText = `${persentase}% (${dataObj.selesai}/${dataObj.total})`;
    }

    function renderPapan(semuaData, filterMode) {
        let jmlTotal = { belum: 0, proses: 0, kendala: 0, selesai: 0 };
        let statsTahapan = {
            'perencanaan': { total: 0, selesai: 0 },
            'persiapan': { total: 0, selesai: 0 },
            'pelaksanaan': { total: 0, selesai: 0 },
            'pasca-acara': { total: 0, selesai: 0 }
        };
        
        let jabatanSayaBersih = bersihkanTeks(userData.jabatan);

        semuaData.forEach(item => {
            // PEMBERSIH STATUS (Kebal terhadap spasi atau huruf kapital acak)
            let s = bersihkanTeks(item.status);

            // Hitung persentase indikator total acara
            if(s === 'belum mulai') jmlTotal.belum++;
            else if(s === 'sedang dikerjakan') jmlTotal.proses++;
            else if(s === 'terkendala') jmlTotal.kendala++;
            else if(s === 'selesai') jmlTotal.selesai++;

            // Hitung Progress Tahapan per Bagian
            let t = bersihkanTeks(item.tahapan);
            if(statsTahapan[t] !== undefined) {
                statsTahapan[t].total++;
                if(s === 'selesai') statsTahapan[t].selesai++;
            }
        });
        
        // Render Progress Bar Keseluruhan
        let totalPekerjaan = jmlTotal.belum + jmlTotal.proses + jmlTotal.kendala + jmlTotal.selesai;
        let persentase = totalPekerjaan === 0 ? 0 : Math.round((jmlTotal.selesai / totalPekerjaan) * 100);
        
        document.getElementById('teksPersentase').innerText = persentase + '%';
        document.getElementById('barPersentase').style.width = persentase + '%';

        updateProgressBar('barPerencanaan', 'txtPerencanaan', statsTahapan['perencanaan']);
        updateProgressBar('barPersiapan', 'txtPersiapan', statsTahapan['persiapan']);
        updateProgressBar('barPelaksanaan', 'txtPelaksanaan', statsTahapan['pelaksanaan']);
        updateProgressBar('barPasca', 'txtPasca', statsTahapan['pasca-acara']);

        // FILTER DATA BERDASARKAN DIVISI
        let dataTampil = semuaData;
        if (filterMode === 'saya') {
            dataTampil = semuaData.filter(item => bersihkanTeks(item.divisi) === jabatanSayaBersih);
        }
        
        let jmlTampil = { belum: 0, proses: 0, kendala: 0, selesai: 0 };
        let htmlBelum = '', htmlProses = '', htmlKendala = '', htmlSelesai = '';
        let tugasMendesak = [];

        dataTampil.forEach(item => {
            let s = bersihkanTeks(item.status);
            let warnaWaktu = "text-muted";
            
            if(s !== 'selesai' && item.batas_waktu) {
                let sisaJam = (new Date(item.batas_waktu) - new Date()) / (1000 * 60 * 60);
                if(sisaJam < 0) {
                    warnaWaktu = "text-danger fw-bold";
                    tugasMendesak.push(`<span class="badge bg-danger text-white me-2">Lewat Waktu</span> <b>${item.nama_pekerjaan}</b> (Divisi: ${item.divisi})`);
                } else if(sisaJam <= 72) {
                    warnaWaktu = "text-warning fw-bold";
                    tugasMendesak.push(`<span class="badge bg-warning text-dark me-2">Hampir Deadline</span> <b>${item.nama_pekerjaan}</b> (Divisi: ${item.divisi})`);
                }
            }

            let isDivisiSaya = (bersihkanTeks(item.divisi) === jabatanSayaBersih);
            let bisaUbahStatus = isAdmin || isDivisiSaya;
            
            let aksiHTML = bisaUbahStatus ? `
                <div class="kartu-aksi d-flex justify-content-between align-items-center mt-2 pt-2 border-top">
                    <div class="dropdown">
                        <button class="btn btn-sm btn-light border dropdown-toggle" type="button" data-bs-toggle="dropdown">Ubah Status</button>
                        <ul class="dropdown-menu shadow-sm">
                            <li><a class="dropdown-item" href="#" onclick="ubahStatus('${item.id_tugas}', 'Belum Mulai')"><i class="bi bi-list-task me-2 text-secondary"></i>Belum Mulai</a></li>
                            <li><a class="dropdown-item" href="#" onclick="ubahStatus('${item.id_tugas}', 'Sedang Dikerjakan')"><i class="bi bi-gear-fill me-2 text-warning"></i>Kerjakan</a></li>
                            <li><a class="dropdown-item" href="#" onclick="ubahStatus('${item.id_tugas}', 'Terkendala')"><i class="bi bi-exclamation-triangle-fill me-2 text-danger"></i>Ada Kendala</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" onclick="ubahStatus('${item.id_tugas}', 'Selesai')"><i class="bi bi-check-circle-fill me-2 text-success"></i>Tandai Selesai</a></li>
                        </ul>
                    </div>
                    ${isAdmin ? `<button class="btn btn-sm text-danger" onclick="hapusPekerjaan('${item.id_tugas}', '${item.nama_pekerjaan}')" title="Hapus Tugas"><i class="bi bi-trash3-fill"></i></button>` : ''}
                </div>
            ` : `<div class="mt-2 pt-2 border-top text-end"><span class="badge bg-light text-muted border"><i class="bi bi-eye-fill"></i> Hanya Lihat</span></div>`;

            let badgeTahapan = (item.tahapan && item.tahapan !== '-') ? `<span class="badge bg-dark text-white border border-secondary mb-1" style="font-size: 0.65rem;">${item.tahapan}</span>` : '';
            let teksPic = item.pic ? item.pic : 'Tim Divisi';

            let kartu = `
                <div class="kartu-tugas ${ s === 'belum mulai' ? 'kartu-belum' : s === 'sedang dikerjakan' ? 'kartu-proses' : s === 'terkendala' ? 'kartu-kendala' : 'kartu-selesai' }">
                    ${badgeTahapan}
                    <div class="kartu-judul">${item.nama_pekerjaan}</div>
                    <div class="kartu-info"><i class="bi bi-diagram-3-fill me-1"></i><b>Divisi:</b> ${item.divisi}</div>
                    <div class="kartu-info"><i class="bi bi-person-fill me-1"></i><b>PIC:</b> ${teksPic}</div>
                    <div class="kartu-info ${warnaWaktu}"><i class="bi bi-calendar-event me-1"></i><b>Batas:</b> ${formatTgl(item.batas_waktu)}</div>
                    ${aksiHTML}
                </div>
            `;

            if(s === 'belum mulai') { htmlBelum += kartu; jmlTampil.belum++; }
            else if(s === 'sedang dikerjakan') { htmlProses += kartu; jmlTampil.proses++; }
            else if(s === 'terkendala') { htmlKendala += kartu; jmlTampil.kendala++; }
            else if(s === 'selesai') { htmlSelesai += kartu; jmlTampil.selesai++; }
        });

        let alertArea = document.getElementById('alertMendesak');
        if(tugasMendesak.length > 0) {
            let listHtml = tugasMendesak.map(t => `<li class="mb-1">${t}</li>`).join('');
            alertArea.innerHTML = `
            <div class="alert alert-danger alert-dismissible fade show shadow-sm border-danger" role="alert" style="background-color: #fef2f2;">
                <h6 class="fw-bold text-danger mb-2"><i class="bi bi-exclamation-triangle-fill me-2"></i> PERHATIAN! TUGAS MENDESAK/TELAT:</h6>
                <ul class="mb-0" style="font-size: 0.85rem; list-style-type: none; padding-left: 0;">${listHtml}</ul>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>`;
        } else { alertArea.innerHTML = ''; }

        document.getElementById('wadahBelum').innerHTML = htmlBelum || '<div class="text-center text-muted small py-3">Kosong</div>';
        document.getElementById('wadahProses').innerHTML = htmlProses || '<div class="text-center text-muted small py-3">Kosong</div>';
        document.getElementById('wadahKendala').innerHTML = htmlKendala || '<div class="text-center text-muted small py-3">Aman</div>';
        document.getElementById('wadahSelesai').innerHTML = htmlSelesai || '<div class="text-center text-muted small py-3">Kosong</div>';

        document.getElementById('jmlBelum').innerText = jmlTampil.belum;
        document.getElementById('jmlProses').innerText = jmlTampil.proses;
        document.getElementById('jmlKendala').innerText = jmlTampil.kendala;
        document.getElementById('jmlSelesai').innerText = jmlTampil.selesai;
    }

        // FILTER DATA BERDASARKAN DIVISI (Pembersih Teks Aktif)
        let dataTampil = semuaData;
        if (filterMode === 'saya') {
            dataTampil = semuaData.filter(item => bersihkanTeks(item.divisi) === jabatanSayaBersih);
        }
        
        let jmlTampil = { belum: 0, proses: 0, kendala: 0, selesai: 0 };
        let htmlBelum = '', htmlProses = '', htmlKendala = '', htmlSelesai = '';
        let tugasMendesak = [];

        dataTampil.forEach(item => {
            let warnaWaktu = "text-muted";
            if(item.status !== 'Selesai' && item.batas_waktu) {
                let sisaJam = (new Date(item.batas_waktu) - new Date()) / (1000 * 60 * 60);
                if(sisaJam < 0) {
                    warnaWaktu = "text-danger fw-bold";
                    tugasMendesak.push(`<span class="badge bg-danger text-white me-2">Lewat Waktu</span> <b>${item.nama_pekerjaan}</b> (Divisi: ${item.divisi})`);
                } else if(sisaJam <= 72) {
                    warnaWaktu = "text-warning fw-bold";
                    tugasMendesak.push(`<span class="badge bg-warning text-dark me-2">Hampir Deadline</span> <b>${item.nama_pekerjaan}</b> (Divisi: ${item.divisi})`);
                }
            }

            // HAK AKSES KARTU (Pembersih Teks Aktif)
            let isDivisiSaya = (bersihkanTeks(item.divisi) === jabatanSayaBersih);
            let bisaUbahStatus = isAdmin || isDivisiSaya;
            
            let aksiHTML = bisaUbahStatus ? `
                <div class="kartu-aksi d-flex justify-content-between align-items-center mt-2 pt-2 border-top">
                    <div class="dropdown">
                        <button class="btn btn-sm btn-light border dropdown-toggle" type="button" data-bs-toggle="dropdown">Ubah Status</button>
                        <ul class="dropdown-menu shadow-sm">
                            <li><a class="dropdown-item" href="#" onclick="ubahStatus('${item.id_tugas}', 'Belum Mulai')"><i class="bi bi-list-task me-2 text-secondary"></i>Belum Mulai</a></li>
                            <li><a class="dropdown-item" href="#" onclick="ubahStatus('${item.id_tugas}', 'Sedang Dikerjakan')"><i class="bi bi-gear-fill me-2 text-warning"></i>Kerjakan</a></li>
                            <li><a class="dropdown-item" href="#" onclick="ubahStatus('${item.id_tugas}', 'Terkendala')"><i class="bi bi-exclamation-triangle-fill me-2 text-danger"></i>Ada Kendala</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" onclick="ubahStatus('${item.id_tugas}', 'Selesai')"><i class="bi bi-check-circle-fill me-2 text-success"></i>Tandai Selesai</a></li>
                        </ul>
                    </div>
                    ${isAdmin ? `<button class="btn btn-sm text-danger" onclick="hapusPekerjaan('${item.id_tugas}', '${item.nama_pekerjaan}')" title="Hapus Tugas"><i class="bi bi-trash3-fill"></i></button>` : ''}
                </div>
            ` : `<div class="mt-2 pt-2 border-top text-end"><span class="badge bg-light text-muted border"><i class="bi bi-eye-fill"></i> Hanya Lihat</span></div>`;

            let badgeTahapan = item.tahapan ? `<span class="badge bg-dark text-white border border-secondary mb-1" style="font-size: 0.65rem;">${item.tahapan}</span>` : '';
            let teksPic = item.pic ? item.pic : 'Tim Divisi';

            let kartu = `
                <div class="kartu-tugas ${ item.status === 'Belum Mulai' ? 'kartu-belum' : item.status === 'Sedang Dikerjakan' ? 'kartu-proses' : item.status === 'Terkendala' ? 'kartu-kendala' : 'kartu-selesai' }">
                    ${badgeTahapan}
                    <div class="kartu-judul">${item.nama_pekerjaan}</div>
                    <div class="kartu-info"><i class="bi bi-diagram-3-fill me-1"></i><b>Divisi:</b> ${item.divisi}</div>
                    <div class="kartu-info"><i class="bi bi-person-fill me-1"></i><b>PIC:</b> ${teksPic}</div>
                    <div class="kartu-info ${warnaWaktu}"><i class="bi bi-calendar-event me-1"></i><b>Batas:</b> ${formatTgl(item.batas_waktu)}</div>
                    ${aksiHTML}
                </div>
            `;

            if(item.status === 'Belum Mulai') { htmlBelum += kartu; jmlTampil.belum++; }
            else if(item.status === 'Sedang Dikerjakan') { htmlProses += kartu; jmlTampil.proses++; }
            else if(item.status === 'Terkendala') { htmlKendala += kartu; jmlTampil.kendala++; }
            else if(item.status === 'Selesai') { htmlSelesai += kartu; jmlTampil.selesai++; }
        });

        let alertArea = document.getElementById('alertMendesak');
        if(tugasMendesak.length > 0) {
            let listHtml = tugasMendesak.map(t => `<li class="mb-1">${t}</li>`).join('');
            alertArea.innerHTML = `
            <div class="alert alert-danger alert-dismissible fade show shadow-sm border-danger" role="alert" style="background-color: #fef2f2;">
                <h6 class="fw-bold text-danger mb-2"><i class="bi bi-exclamation-triangle-fill me-2"></i> PERHATIAN! TUGAS MENDESAK/TELAT:</h6>
                <ul class="mb-0" style="font-size: 0.85rem; list-style-type: none; padding-left: 0;">${listHtml}</ul>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>`;
        } else { alertArea.innerHTML = ''; }

        document.getElementById('wadahBelum').innerHTML = htmlBelum || '<div class="text-center text-muted small py-3">Kosong</div>';
        document.getElementById('wadahProses').innerHTML = htmlProses || '<div class="text-center text-muted small py-3">Kosong</div>';
        document.getElementById('wadahKendala').innerHTML = htmlKendala || '<div class="text-center text-muted small py-3">Aman</div>';
        document.getElementById('wadahSelesai').innerHTML = htmlSelesai || '<div class="text-center text-muted small py-3">Kosong</div>';

        document.getElementById('jmlBelum').innerText = jmlTampil.belum;
        document.getElementById('jmlProses').innerText = jmlTampil.proses;
        document.getElementById('jmlKendala').innerText = jmlTampil.kendala;
        document.getElementById('jmlSelesai').innerText = jmlTampil.selesai;
    }

    async function simpanTugas(e) {
        e.preventDefault();
        const tombol = document.getElementById('btnSimpan');
        tombol.innerText = 'Menyimpan...'; tombol.disabled = true;

        const dataKirim = {
            action: 'tambah_tugas',
            nama_pekerjaan: document.getElementById('inputPekerjaan').value,
            divisi: document.getElementById('inputDivisi').value,
            tahapan: document.getElementById('inputTahapan').value,
            pic: document.getElementById('inputPic').value,
            batas_waktu: document.getElementById('inputWaktu').value
        };

        try {
            const respon = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(dataKirim) });
            const hasil = await respon.json();
            if(hasil.status === 'success') {
                Swal.fire({icon: 'success', title: 'Berhasil', text: hasil.message, timer: 1500, showConfirmButton: false});
                document.getElementById('formTugas').reset();
                bootstrap.Modal.getInstance(document.getElementById('modalTambahTugas')).hide();
                muatDataPapan(); 
            } else { Swal.fire('Gagal!', hasil.message, 'error'); }
        } catch (err) { Swal.fire('Error', 'Gagal mengirim data.', 'error'); } 
        finally { tombol.innerText = 'Simpan Penugasan'; tombol.disabled = false; }
    }

    async function ubahStatus(id, statusBaru) {
        Swal.fire({ title: 'Memindahkan Tugas...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
        try {
            const respon = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'update_status_tugas', id_tugas: id, status_baru: statusBaru }) });
            const hasil = await respon.json();
            if(hasil.status === 'success') { Swal.close(); muatDataPapan(); } 
            else { Swal.fire('Gagal!', hasil.message, 'error'); }
        } catch (err) { Swal.fire('Error', 'Gagal memindahkan tugas.', 'error'); }
    }

    function hapusPekerjaan(id, nama) {
        Swal.fire({
            title: 'Hapus Pekerjaan?', text: `Yakin ingin menghapus "${nama}"?`, icon: 'warning',
            showCancelButton: true, confirmButtonColor: '#ef4444', cancelButtonColor: '#64748b', confirmButtonText: 'Ya, Hapus!'
        }).then(async (result) => {
            if (result.isConfirmed) {
                Swal.fire({ title: 'Menghapus...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
                try {
                    const respon = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'hapus_tugas', id_tugas: id }) });
                    const hasil = await respon.json();
                    if(hasil.status === 'success') { Swal.close(); muatDataPapan(); } 
                    else { Swal.fire('Gagal!', hasil.message, 'error'); }
                } catch (err) { Swal.fire('Error', 'Gagal terhubung.', 'error'); }
            }
        });
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin - EMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        body { background-color: #0f172a; color: #ffffff; font-family: 'Segoe UI', sans-serif; padding-bottom: 50px; }
        .neon-nav { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0, 242, 254, 0.3); }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 15px; box-shadow: 0 8px 32px 0 rgba(0,0,0,0.3); }
        .text-neon { background: linear-gradient(to right, #00f2fe, #4facfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: bold; }
        .stat-box { border-left: 4px solid #00f2fe; background: linear-gradient(90deg, rgba(0,242,254,0.1) 0%, transparent 100%); }
        .baris-anggota { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; border: 1px dashed rgba(255,255,255,0.2); }
    </style>
</head>
<body>

<nav class="navbar navbar-dark neon-nav sticky-top mb-4">
    <div class="container">
        <span class="navbar-brand text-neon"><i class="bi bi-shield-lock-fill"></i> Ruang Kendali Pusat</span>
        <button class="btn btn-sm btn-outline-danger" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</button>
    </div>
</nav>

<div class="container">
    <h5 class="fw-bold mb-3">Statistik Real-Time</h5>
    <div class="row g-3 mb-4">
        <div class="col-6"><div class="glass-card stat-box p-3"><p class="small text-white-50 mb-1">Sekolah Lunas</p><h3 class="fw-bold mb-0 text-info" id="s_lunas">0</h3></div></div>
        <div class="col-6"><div class="glass-card stat-box p-3" style="border-left-color: #ffc107;"><p class="small text-white-50 mb-1">Sekolah Pending</p><h3 class="fw-bold mb-0 text-warning" id="s_pending">0</h3></div></div>
        <div class="col-6"><div class="glass-card stat-box p-3" style="border-left-color: #f093fb;"><p class="small text-white-50 mb-1">Total Peserta</p><h3 class="fw-bold mb-0" style="color: #f093fb;" id="s_peserta">0</h3></div></div>
        <div class="col-6"><div class="glass-card stat-box p-3" style="border-left-color: #20c997;"><p class="small text-white-50 mb-1">Peserta Hadir</p><h3 class="fw-bold mb-0 text-success" id="s_hadir">0</h3></div></div>
    </div>

    <!-- FORM INPUT KEPANITIAAN KOLEKTIF -->
    <h5 class="fw-bold mb-3 mt-4 text-info">Input SK & Data Kepanitiaan (Kolektif)</h5>
    <div class="glass-card p-4 mb-4" style="border-left: 4px solid #f093fb;">
        <form id="formPanitia" onsubmit="uploadPanitiaKolektif(event)">
            
            <!-- Bagian File SK Utama -->
            <div class="mb-4 pb-3 border-bottom border-secondary">
                <label class="form-label fw-bold text-warning">1. Upload File SK Kepanitiaan (Upload Sekali untuk Semua)</label>
                <input type="file" id="panitia_file" class="form-control bg-dark text-white border-secondary" required accept=".pdf, .doc, .docx, .jpg, .png">
                <div class="form-text text-white-50 small mt-1">*Maksimal 3 MB. File ini akan otomatis ditautkan ke seluruh nama anggota di bawah.</div>
            </div>

            <label class="form-label fw-bold text-warning mb-3">2. Masukkan Daftar Anggota Kepanitiaan</label>
            
            <!-- Wadah Dinamis Anggota -->
            <div id="wadah-anggota">
                <div class="row g-2 mb-3 baris-anggota">
                    <div class="col-md-3">
                        <label class="small text-white-50">Nama Anggota</label>
                        <input type="text" class="form-control bg-dark text-white border-secondary i-nama" required placeholder="Contoh: Drs. Johanes">
                    </div>
                    <div class="col-md-3">
                        <label class="small text-white-50">Jabatan</label>
                        <select class="form-select bg-dark text-white border-secondary i-jabatan" required>
                            <option value="">-- Pilih --</option>
                            <option value="Pelindung / Penasehat">Pelindung / Penasehat</option>
                            <option value="Pengarah">Pengarah</option>
                            <option value="Penanggung Jawab">Penanggung Jawab</option>
                            <option value="Ketua">Ketua</option>
                            <option value="Sekretaris 1">Sekretaris 1</option>
                            <option value="Sekretaris 2">Sekretaris 2</option>
                            <option value="Bendahara Panitia">Bendahara Panitia</option>
                            <option value="Seksi Acara">Seksi Acara</option>
                            <option value="Seksi Perlengkapan">Seksi Perlengkapan</option>
                            <option value="Seksi Konsumsi">Seksi Konsumsi</option>
                            <option value="Seksi Humas / Dokumentasi">Seksi Humas / Dokumentasi</option>
                            <option value="Tim Teknis">Tim Teknis</option>
                        </select>
                    </div>
                    <div class="col-md-5">
                        <label class="small text-white-50">Job Deskripsi</label>
                        <input type="text" class="form-control bg-dark text-white border-secondary i-jobdesk" required placeholder="Tugas pokok / fungsi singkat">
                    </div>
                    <div class="col-md-1 d-flex align-items-end">
                        <button type="button" class="btn btn-outline-danger w-100 disabled" style="opacity: 0.5;"><i class="bi bi-trash"></i></button>
                    </div>
                </div>
            </div>

            <!-- Tombol Aksi -->
            <div class="d-flex justify-content-between mt-3">
                <button type="button" class="btn btn-outline-info" onclick="tambahBaris()"><i class="bi bi-plus-lg me-2"></i>Tambah Anggota Lain</button>
                <button type="submit" id="btnUploadPanitia" class="btn btn-primary fw-bold px-4">
                    <i class="bi bi-cloud-arrow-up-fill me-2"></i> Simpan Seluruh Data
                </button>
            </div>
        </form>
    </div>

    <!-- Menu Bawah -->
    <h5 class="fw-bold mb-3 mt-4">Menu Kesekretariatan 2.0</h5>
    <div class="row g-3">
        <div class="col-12"><button onclick="window.location.href='admin_manajemen.html'" class="btn btn-outline-info w-100 py-3 text-start"><i class="bi bi-person-lines-fill me-2"></i> Manajemen Akun & Reset Data</button></div>
        <div class="col-12"><button onclick="window.location.href='cetak_idcard.html'" class="btn btn-neon text-dark w-100 py-3 text-start"><i class="bi bi-printer-fill me-2"></i> Cetak ID Card & Name Tag Massal</button></div>
        <div class="col-12"><button onclick="window.location.href='panitia_checkin.html'" class="btn btn-outline-warning w-100 py-3 text-start"><i class="bi bi-qr-code-scan me-2"></i> Buka Scanner Absensi Multi-Sesi</button></div>
        <div class="col-12"><button onclick="window.location.href='admin_broadcast.html'" class="btn btn-outline-light w-100 py-3 text-start"><i class="bi bi-cloud-arrow-up-fill me-2"></i> Broadcast Materi & Undangan</button></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // MASUKKAN URL API KAPTEN DI SINI
    const API_URL = "https://script.google.com/macros/s/AKfycbwLdvXuLpbUvBE666hblNZm4y1HuoogGUl8vdHorb-aT9s6T5X6xHwXAcPaeEvrZ5RS/exec";
    const userData = JSON.parse(localStorage.getItem('userLogin'));
    
    if(!userData || userData.role !== 'Admin_Pusat') window.location.href = "index.html";

    async function muatStatistik() {
        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'get_stats_admin' })
            });
            const result = await response.json();
            if(result.status === 'success') {
                document.getElementById('s_lunas').innerText = result.data.lunas;
                document.getElementById('s_pending').innerText = result.data.pending;
                document.getElementById('s_peserta').innerText = result.data.peserta;
                document.getElementById('s_hadir').innerText = result.data.hadir;
            }
        } catch (error) {}
    }

    function logout() { localStorage.removeItem('userLogin'); window.location.href = "index.html"; }
    muatStatistik();

    // MESIN PENAMBAH BARIS DINAMIS
    function tambahBaris() {
        const wadah = document.getElementById('wadah-anggota');
        const barisBaru = document.createElement('div');
        barisBaru.className = 'row g-2 mb-3 baris-anggota';
        barisBaru.innerHTML = `
            <div class="col-md-3">
                <input type="text" class="form-control bg-dark text-white border-secondary i-nama" required placeholder="Nama Anggota">
            </div>
            <div class="col-md-3">
                <select class="form-select bg-dark text-white border-secondary i-jabatan" required>
                    <option value="">-- Pilih --</option>
                    <option value="Pelindung / Penasehat">Pelindung / Penasehat</option>
                    <option value="Pengarah">Pengarah</option>
                    <option value="Penanggung Jawab">Penanggung Jawab</option>
                    <option value="Ketua">Ketua</option>
                    <option value="Sekretaris 1">Sekretaris 1</option>
                    <option value="Sekretaris 2">Sekretaris 2</option>
                    <option value="Bendahara Panitia">Bendahara Panitia</option>
                    <option value="Seksi Acara">Seksi Acara</option>
                    <option value="Seksi Perlengkapan">Seksi Perlengkapan</option>
                    <option value="Seksi Konsumsi">Seksi Konsumsi</option>
                    <option value="Seksi Humas / Dokumentasi">Seksi Humas / Dokumentasi</option>
                    <option value="Tim Teknis">Tim Teknis</option>
                </select>
            </div>
            <div class="col-md-5">
                <input type="text" class="form-control bg-dark text-white border-secondary i-jobdesk" required placeholder="Tugas pokok / fungsi singkat">
            </div>
            <div class="col-md-1 d-flex align-items-end">
                <button type="button" class="btn btn-danger w-100" onclick="this.parentElement.parentElement.remove()"><i class="bi bi-trash"></i></button>
            </div>
        `;
        wadah.appendChild(barisBaru);
    }

    // MESIN PENGIRIM DATA KOLEKTIF
    async function uploadPanitiaKolektif(event) {
        event.preventDefault();
        
        const fileInput = document.getElementById('panitia_file').files[0];
        if (fileInput.size > 3 * 1024 * 1024) {
            Swal.fire('Terlalu Besar!', 'Ukuran file SK maksimal 3 MB.', 'warning');
            return;
        }

        // Sedot seluruh data baris anggota ke dalam Array
        let elemenBaris = document.querySelectorAll('.baris-anggota');
        let arrayAnggota = [];
        elemenBaris.forEach(baris => {
            arrayAnggota.push({
                nama: baris.querySelector('.i-nama').value,
                jabatan: baris.querySelector('.i-jabatan').value,
                jobdesk: baris.querySelector('.i-jobdesk').value
            });
        });

        const btn = document.getElementById('btnUploadPanitia');
        const teksAsli = btn.innerHTML;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Menyimpan & Mengunggah...';
        btn.disabled = true;

        const reader = new FileReader();
        reader.onload = async function(e) {
            const dataUrl = e.target.result;
            const base64Data = dataUrl.split(',')[1]; 

            const payload = {
                action: 'upload_sk_panitia_kolektif',
                anggota: arrayAnggota,
                fileName: fileInput.name,
                mimeType: fileInput.type,
                fileData: base64Data
            };

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                const result = await res.json();

                if(result.status === 'success') {
                    Swal.fire('Berhasil!', result.message, 'success');
                    
                    // Reset Form: Kosongkan file, hapus sisa baris, sisakan 1 baris kosong
                    document.getElementById('formPanitia').reset(); 
                    document.getElementById('wadah-anggota').innerHTML = ''; 
                    tambahBaris(); 
                    
                    // Sembunyikan tombol hapus di baris pertama yang baru dibuat
                    document.querySelector('.baris-anggota .btn-danger').className = 'btn btn-outline-danger w-100 disabled';
                    document.querySelector('.baris-anggota .btn-outline-danger').style.opacity = '0.5';
                    document.querySelector('.baris-anggota .btn-outline-danger').onclick = null;
                } else {
                    Swal.fire('Gagal!', result.message, 'error');
                }
            } catch(error) {
                Swal.fire('Error Koneksi', 'Gagal menghubungi server.', 'error');
            } finally {
                btn.innerHTML = teksAsli;
                btn.disabled = false;
            }
        };
        reader.readAsDataURL(fileInput);
    }
</script>
</body>
</html>

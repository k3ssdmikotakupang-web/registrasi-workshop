<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posko Operasional Panitia - EMS K3S Kupang</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        body { background-color: #0f172a; color: #ffffff; font-family: 'Segoe UI', sans-serif; padding-bottom: 50px; }
        .neon-nav { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0, 242, 254, 0.3); }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 15px; box-shadow: 0 8px 32px 0 rgba(0,0,0,0.3); transition: transform 0.3s ease, background 0.3s ease; }
        .glass-card:hover { transform: translateY(-5px); background: rgba(255, 255, 255, 0.08); }
        .text-neon { background: linear-gradient(to right, #00f2fe, #4facfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: bold; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark neon-nav sticky-top mb-4">
    <div class="container">
        <span class="navbar-brand text-neon"><i class="bi bi-person-badge-fill"></i> Posko Operasional Panitia</span>
        <button class="btn btn-sm btn-outline-danger" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Keluar</button>
    </div>
</nav>

<div class="container">
    
    <!-- Kartu Sambutan Identitas Panitia -->
    <div class="glass-card p-4 mb-4 text-center" style="border-top: 4px solid #00f2fe;">
        <h4 class="fw-bold mb-1 text-white">Selamat Bertugas, <span id="namaPanitia" class="text-info">Panitia</span>!</h4>
        <p class="text-white-50 small mb-0" id="jabatanPanitia">Mari sukseskan acara kita bersama.</p>
    </div>

    <h5 class="fw-bold mb-3 mt-4"><i class="bi bi-grid-fill me-2 text-warning"></i> Menu Operasional Panitia</h5>
    
    <!-- Grid Menu Posko Panitia -->
    <div class="row g-3 mb-4">
        
        <!-- Menu 1: Scanner Absensi -->
        <div class="col-6 col-md-3">
            <div class="card h-100 shadow-sm border-0 glass-card text-center py-4" style="cursor: pointer; border-bottom: 4px solid #ffc107 !important;" onclick="window.location.href='panitia_checkin.html'">
                <i class="bi bi-qr-code-scan mb-2" style="font-size: 2.5rem; color: #ffc107; text-shadow: 0 0 15px rgba(255, 193, 7, 0.5);"></i>
                <h6 class="fw-bold text-white mb-0 mt-2">Scanner<br>Absensi</h6>
            </div>
        </div>

        <!-- Menu 2: Papan Kanban (Manajemen Tugas) -->
        <div class="col-6 col-md-3">
            <div class="card h-100 shadow-sm border-0 glass-card text-center py-4" style="cursor: pointer; border-bottom: 4px solid #0dcaf0 !important;" onclick="window.location.href='manajemen_tugas.html'">
                <i class="bi bi-kanban-fill mb-2" style="font-size: 2.5rem; color: #0dcaf0; text-shadow: 0 0 15px rgba(13, 202, 240, 0.5);"></i>
                <h6 class="fw-bold text-white mb-0 mt-2">Papan<br>Tugas</h6>
            </div>
        </div>

        <!-- Menu 3: Progress Kegiatan -->
        <div class="col-6 col-md-3">
            <div class="card h-100 shadow-sm border-0 glass-card text-center py-4" style="cursor: pointer; border-bottom: 4px solid #198754 !important;" onclick="window.location.href='manajemen_tugas.html'">
                <i class="bi bi-bar-chart-line-fill mb-2" style="font-size: 2.5rem; color: #198754; text-shadow: 0 0 15px rgba(25, 135, 84, 0.5);"></i>
                <h6 class="fw-bold text-white mb-0 mt-2">Progress<br>Kegiatan</h6>
            </div>
        </div>

        <!-- Menu 4: Jadwal Acara -->
        <div class="col-6 col-md-3">
            <div class="card h-100 shadow-sm border-0 glass-card text-center py-4" style="cursor: pointer; border-bottom: 4px solid #f093fb !important;" onclick="window.location.href='admin_jadwal.html'">
                <i class="bi bi-calendar-event-fill mb-2" style="font-size: 2.5rem; color: #f093fb; text-shadow: 0 0 15px rgba(240, 147, 251, 0.5);"></i>
                <h6 class="fw-bold text-white mb-0 mt-2">Jadwal<br>Acara</h6>
            </div>
        </div>
        
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // --- PENJAGA PINTU POSKO PANITIA ---
    const userData = JSON.parse(localStorage.getItem('userLogin'));
    
    if (!userData) {
        window.location.href = "index.html";
    } else {
        let roleUser = (userData.role || '').toLowerCase();
        let jabatanUser = (userData.jabatan || '').toLowerCase();
        let idUser = userData.id_panitia || userData.id || '';

        // 1. Jika Admin Pusat ATAU Ketua Panitia -> Arahkan ke Ruang Kendali Pusat (VVIP)!
        if (roleUser === 'admin_pusat' || roleUser === 'admin' || jabatanUser.includes('ketua')) {
            window.location.href = "dashboard_admin.html";
        } 
        // 2. Jika Bendahara -> Arahkan ke Ruang Kas (Dasbor Bendahara)
        else if (jabatanUser.includes('bendahara') || roleUser === 'bendahara_panitia') {
            window.location.href = "dashboard_bendahara_panitia.html";
        }
        // 3. Jika BUKAN Panitia sama sekali -> Tendang ke Halaman Login
        else if (!idUser.startsWith('PAN-') && !roleUser.includes('panitia')) {
            window.location.href = "index.html";
        } 
        // 4. Jika Panitia Biasa (Sekretaris, Anggota) -> Persilakan Masuk
        else {
            document.getElementById('namaPanitia').innerText = userData.nama || userData.nama_pic || 'Panitia';
            
            let teksJabatan = '';
            if (userData.jabatan) { teksJabatan = userData.jabatan; }
            if (userData.divisi) { teksJabatan += ` - ${userData.divisi}`; }
            
            document.getElementById('jabatanPanitia').innerText = teksJabatan !== '' ? teksJabatan : 'Posko Operasional Panitia Pelaksana.';
        }
    }

    function logout() {
        localStorage.removeItem('userLogin');
        window.location.href = "index.html";
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Pengeluaran - EMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        body { background-color: #f8f9fa; color: #333; font-family: 'Segoe UI', sans-serif; padding-bottom: 50px; }
        .header-panel { background: #0f172a; color: #00f2fe; padding: 20px; border-bottom: 5px solid #dc3545; }
        .form-card { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); padding: 25px; border-top: 4px solid #dc3545; margin-bottom: 20px; }
        .kalkulator-box { background: #f1f5f9; border-radius: 8px; padding: 15px; border: 1px dashed #cbd5e1; }
        .text-netto { color: #198754; font-size: 1.5rem; font-weight: bold; }
        .nav-pills .nav-link { color: #495057; font-weight: 600; border-radius: 8px; margin-right: 5px; }
        .nav-pills .nav-link.active { background-color: #dc3545; color: white; }
    </style>
</head>
<body>

<div class="header-panel mb-4">
    <div class="container d-flex justify-content-between align-items-center">
        <div>
            <h4 class="fw-bold mb-0 text-white">MANAJEMEN PENGELUARAN</h4>
            <p class="mb-0 text-white-50">Sistem Keuangan Bendahara Pusat</p>
        </div>
        <button class="btn btn-outline-light" onclick="window.location.href='dashboard_bendahara_panitia.html'"><i class="bi bi-arrow-left"></i> Kembali ke Dasbor</button>
    </div>
</div>

<div class="container">
    <div class="form-card mx-auto" style="max-width: 800px;">
        
        <!-- Navigasi Tabs -->
        <ul class="nav nav-pills mb-4 border-bottom pb-3" id="pengeluaranTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="input-tab" data-bs-toggle="pill" data-bs-target="#input-pane" type="button" role="tab"><i class="bi bi-pencil-square me-2"></i>Catat Pengeluaran</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="upload-tab" data-bs-toggle="pill" data-bs-target="#upload-pane" type="button" role="tab"><i class="bi bi-upload me-2"></i>Upload Bukti</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="transport-tab" data-bs-toggle="pill" data-bs-target="#transport-pane" type="button" role="tab"><i class="bi bi-car-front me-2"></i>Cetak Transport</button>
            </li>
        </ul>

        <!-- Isi Tabs -->
        <div class="tab-content" id="pengeluaranTabContent">
            
            <!-- TAB 1: CATAT PENGELUARAN (Tampilan Keren Kapt) -->
            <div class="tab-pane fade show active" id="input-pane" role="tabpanel">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label small fw-bold text-muted">Kategori Belanja</label>
                        <select class="form-select" id="f_kategori">
                            <option value="Jasa Pemateri / Narasumber">Jasa Pemateri / Narasumber</option>
                            <option value="Konsumsi & Snack">Konsumsi & Snack</option>
                            <option value="Belanja ATK & Penggandaan">Belanja ATK & Penggandaan</option>
                            <option value="Sewa Gedung / Alat">Sewa Gedung / Alat</option>
                            <option value="Transportasi / Operasional">Transportasi / Operasional</option>
                            <option value="Lembur Panitia">Lembur Panitia</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold text-muted">Nama Penerima Dana</label>
                        <input type="text" id="f_penerima" class="form-control" placeholder="Contoh: Bpk. Gabriel (Pemateri)">
                    </div>
                    
                    <div class="col-12 mt-4">
                        <h6 class="fw-bold border-bottom pb-2"><i class="bi bi-calculator"></i> Rincian & Kalkulator Pajak</h6>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label small fw-bold text-muted">Nominal Bruto (Kotor) Rp</label>
                        <input type="text" id="f_bruto" class="form-control" placeholder="Contoh: 1.000.000" oninput="formatRibuan(this); hitungPajak()">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold text-muted">Potongan Pajak</label>
                        <select class="form-select border-warning" id="f_pajak" onchange="hitungPajak()">
                            <option value="0|Tanpa Potongan Pajak">Tanpa Potongan (0%)</option>
                            <option value="0.05|PPh 21 - ASN Gol III (5%)">PPh 21 - ASN Gol III (5%)</option>
                            <option value="0.15|PPh 21 - ASN Gol IV (15%)">PPh 21 - ASN Gol IV (15%)</option>
                            <option value="0.025|PPh 21 - Non ASN Ber-NPWP (2,5%)">PPh 21 - Non ASN Ber-NPWP (2,5%)</option>
                            <option value="0.03|PPh 21 - Non ASN Tanpa NPWP (3%)">PPh 21 - Non ASN Tanpa NPWP (3%)</option>
                            <option value="0.02|PPh 23 - Jasa Konsumsi/Catering (2%)">PPh 23 - Jasa Konsumsi/Catering (2%)</option>
                        </select>
                    </div>

                    <div class="col-12">
                        <div class="kalkulator-box mt-2">
                            <div class="d-flex justify-content-between mb-2">
                                <span class="text-muted">Potongan Pajak:</span>
                                <span class="text-danger fw-bold" id="tampilPotongan">- Rp 0</span>
                            </div>
                            <div class="d-flex justify-content-between align-items-center border-top pt-2">
                                <span class="fw-bold">Nominal Netto (Bersih):</span>
                                <span class="text-netto" id="tampilNetto">Rp 0</span>
                            </div>
                            <p class="small text-muted mt-2 mb-0 fst-italic">*Nominal Netto ini yang akan dicairkan ke penerima dan tercatat memotong Saldo Kas.</p>
                        </div>
                    </div>

                    <div class="col-12">
                        <label class="form-label small fw-bold text-muted">Keterangan / Uraian Belanja</label>
                        <textarea id="f_keterangan" class="form-control" rows="2" placeholder="Contoh: Honor materi Implementasi Kurikulum Merdeka 2 Sesi"></textarea>
                    </div>

                    <div class="col-12 mt-4">
                        <button class="btn btn-danger w-100 py-3 fw-bold" id="btnSimpan" onclick="prosesSimpan()">
                            <i class="bi bi-save-fill me-2"></i> Simpan & Buat Kwitansi Pencairan
                        </button>
                    </div>
                </div>
            </div>

            <!-- TAB 2: UPLOAD BUKTI -->
            <div class="tab-pane fade" id="upload-pane" role="tabpanel">
                <form id="formUploadPengeluaran">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label small fw-bold text-muted">ID Transaksi / Pengeluaran</label>
                            <input type="text" id="id_trx_pengeluaran" class="form-control" placeholder="Contoh: OUT-123456" required>
                            <small class="text-danger">*Lihat ID Transaksi di menu Laporan BKU</small>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label small fw-bold text-muted">File Bukti Nota/Struk</label>
                            <input type="file" id="file_bukti_pengeluaran" class="form-control" accept="image/*,application/pdf" required>
                        </div>
                    </div>
                    <button type="button" class="btn btn-primary w-100 py-2 mt-3 fw-bold" onclick="prosesUploadPengeluaran()">
                        <i class="bi bi-upload me-2"></i> Unggah Bukti Pengeluaran
                    </button>
                </form>
            </div>

            <!-- TAB 3: CETAK TRANSPORT MASSAL -->
            <div class="tab-pane fade" id="transport-pane" role="tabpanel">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="small fw-bold text-muted">Sub Rayon</label>
                        <select id="trans-subrayon" class="form-select">
                            <option value="Oebobo">Oebobo</option>
                            <option value="Kelapa Lima">Kelapa Lima</option>
                            <option value="Maulafa">Maulafa</option>
                            <option value="Alak">Alak</option>
                            <option value="Kota Raja">Kota Raja</option>
                            <option value="Kota Lama">Kota Lama</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="small fw-bold text-muted">Kategori Peserta</label>
                        <select id="trans-jabatan" class="form-select">
                            <option value="Guru">Guru</option>
                            <option value="Kepala Sekolah">Kepala Sekolah</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="small fw-bold text-muted">Nominal (Rp)</label>
                        <input type="text" id="trans-nominal" class="form-control fw-bold" placeholder="Contoh: 150.000" oninput="this.value = this.value.replace(/[^0-9]/g, '').replace(/\B(?=(\d{3})+(?!\d))/g, '.')">
                    </div>
                    <div class="col-md-3 d-flex align-items-end">
                        <button class="btn btn-success w-100 fw-bold" onclick="downloadExcelTransport()">
                            <i class="bi bi-file-earmark-excel me-2"></i> Unduh Excel
                        </button>
                    </div>
                </div>
            </div>

        </div> <!-- End Tab Content -->
    </div>
</div>

<!-- Library Eksternal -->
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Mesin Logika Javascript Terpadu -->
<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwLdvXuLpbUvBE666hblNZm4y1HuoogGUl8vdHorb-aT9s6T5X6xHwXAcPaeEvrZ5RS/exec"; 

    const userData = JSON.parse(localStorage.getItem('userLogin'));
    if(!userData || userData.role !== 'Bendahara_Panitia') window.location.href = "index.html";

    const formatRp = (angka) => new Intl.NumberFormat('id-ID').format(angka);
    
    // TAB 1: Logika Input Pengeluaran & Kalkulator
    let hasilNetto = 0;
    let hasilPajak = 0;
    let namaPajakTerpilih = "";

    function formatRibuan(input) {
        let value = input.value.replace(/[^,\d]/g, '');
        let sisa = value.length % 3;
        let rupiah = value.substr(0, sisa);
        let ribuan = value.substr(sisa).match(/\d{3}/g);
        if (ribuan) { let separator = sisa ? '.' : ''; rupiah += separator + ribuan.join('.'); }
        input.value = rupiah;
    }

    function hitungPajak() {
        let bruto = parseFloat(document.getElementById('f_bruto').value.replace(/\./g, '')) || 0;
        let pajakPilihan = document.getElementById('f_pajak').value.split("|"); 
        let persenPajak = parseFloat(pajakPilihan[0]);
        namaPajakTerpilih = pajakPilihan[1];

        hasilPajak = bruto * persenPajak;
        hasilNetto = bruto - hasilPajak;

        document.getElementById('tampilPotongan').innerText = '- Rp ' + formatRp(hasilPajak);
        document.getElementById('tampilNetto').innerText = 'Rp ' + formatRp(hasilNetto);
    }

    async function prosesSimpan() {
        let kategori = document.getElementById('f_kategori').value;
        let penerima = document.getElementById('f_penerima').value;
        let bruto = document.getElementById('f_bruto').value.replace(/\./g, '');
        let keterangan = document.getElementById('f_keterangan').value;

        if(!bruto || !penerima || bruto <= 0) {
            Swal.fire('Data Belum Lengkap', 'Nominal Bruto dan Nama Penerima wajib diisi!', 'warning');
            return;
        }

        document.getElementById('btnSimpan').innerHTML = '<span class="spinner-border spinner-border-sm"></span> Menyimpan...';
        
        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    action: 'simpan_pengeluaran',
                    kategori: kategori,
                    penerima: penerima,
                    bruto: bruto,
                    nama_pajak: namaPajakTerpilih,
                    netto: hasilNetto,
                    keterangan: keterangan
                })
            });
            
            const result = await response.json();
            
            if(result.status === 'success') {
                Swal.fire({
                    icon: 'success', title: 'Berhasil Dicatat!',
                    text: 'Pengeluaran berhasil memotong BKU.', confirmButtonText: 'Cetak Kwitansi'
                }).then(() => {
                    window.location.href = 'kwitansi_keluar.html?kw=' + result.id_trx;
                });
            } else {
                Swal.fire('Gagal', result.message, 'error');
                document.getElementById('btnSimpan').innerHTML = '<i class="bi bi-save-fill me-2"></i> Simpan & Buat Kwitansi Pencairan';
            }
        } catch(e) {
            Swal.fire('Error', 'Gagal terhubung ke server', 'error');
            document.getElementById('btnSimpan').innerHTML = '<i class="bi bi-save-fill me-2"></i> Simpan & Buat Kwitansi Pencairan';
        }
    }

    // TAB 2: Logika Upload Bukti Pengeluaran
    function prosesUploadPengeluaran() {
        const idTrx = document.getElementById('id_trx_pengeluaran').value.trim();
        const fileInput = document.getElementById('file_bukti_pengeluaran');

        if (!idTrx || fileInput.files.length === 0) {
            Swal.fire({ icon: 'warning', title: 'Data Tidak Lengkap', text: 'Mohon isi ID Transaksi dan pilih file bukti nota.' }); return;
        }

        const file = fileInput.files[0];
        const reader = new FileReader();

        reader.onload = function(e) {
            const base64Data = e.target.result.split(',')[1];
            Swal.fire({ title: 'Mengunggah...', text: 'Mohon tunggu, bukti sedang disimpan ke database.', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });

            fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'upload_bukti_pengeluaran', id_trx: idTrx, fileBase64: base64Data, mimeType: file.type, filename: file.name })
            }).then(res => res.json()).then(result => {
                if (result.status === 'success') {
                    Swal.fire({ icon: 'success', title: 'Berhasil', text: result.message });
                    document.getElementById('formUploadPengeluaran').reset(); 
                } else { Swal.fire({ icon: 'error', title: 'Gagal', text: result.message }); }
            }).catch(err => { Swal.fire({ icon: 'error', title: 'Terjadi Kesalahan', text: err.toString() }); });
        };
        reader.readAsDataURL(file);
    }

    // TAB 3: Logika Cetak Excel Transport
    async function downloadExcelTransport() {
        const subrayon = document.getElementById('trans-subrayon').value;
        const jabatan = document.getElementById('trans-jabatan').value;
        const nominal = document.getElementById('trans-nominal').value.replace(/\./g, ''); 

        if(!nominal) { Swal.fire({ icon: 'warning', title: 'Tunggu Dulu!', text: 'Mohon isi besaran nominal.' }); return; }

        let btn = document.querySelector('button[onclick="downloadExcelTransport()"]');
        let teksAsli = btn.innerHTML;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Menyusun Data...';
        btn.disabled = true;

        try {
            const res = await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'get_data_transport', subrayon: subrayon, jabatan: jabatan, nominal: parseInt(nominal) })
            });
            const result = await res.json();

            if (result.status === 'success') {
                if (result.data && result.data.length > 0) {
                    const kopSurat = [
                        ["PEMERINTAH KOTA KUPANG"], ["DINAS PENDIDIKAN DAN KEBUDAYAAN"], ["KELOMPOK KERJA KEPALA SEKOLAH SD/MI KOTA KUPANG"],
                        ["PANITIA PELAKSANA WORKSHOP MANAJEMEN KEPALA SD/MI KOTA KUPANG 2026"], ["SEKRETARIAT: SD NCIPS, JL. Kenanga, No. 01 Naikolan, Kupang"],
                        ["Email: k3s.sdmikotakupang@gmail.com"], [], 
                        [`TANDA TERIMA TRANSPORT PESERTA ${jabatan.toUpperCase()}`], [`SUBRAYON ${subrayon.toUpperCase()}`], [] 
                    ];

                    const ws = XLSX.utils.aoa_to_sheet(kopSurat);
                    XLSX.utils.sheet_add_json(ws, result.data, { origin: "A11" });

                    const barisTerakhirTabel = 11 + result.data.length; 
                    const tglHariIni = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
                    
                    const ttdData = [
                        ["Mengetahui,", "", "", "", `Kupang, ${tglHariIni}`],
                        ["Ketua Panitia,", "", "", "", "Bendahara Panitia,"],
                        [], [], [],
                        ["( .................................... )", "", "", "", "( .................................... )"],
                        ["NIP.", "", "", "", "NIP."]
                    ];
                    XLSX.utils.sheet_add_aoa(ws, ttdData, { origin: `A${barisTerakhirTabel + 2}` });

                    const wscols = [ {wch: 5}, {wch: 35}, {wch: 35}, {wch: 15}, {wch: 20}, {wch: 20} ]; ws['!cols'] = wscols;
                    ws['!merges'] = [
                        { s: {r:0, c:0}, e: {r:0, c:5} }, { s: {r:1, c:0}, e: {r:1, c:5} }, { s: {r:2, c:0}, e: {r:2, c:5} },
                        { s: {r:3, c:0}, e: {r:3, c:5} }, { s: {r:4, c:0}, e: {r:4, c:5} }, { s: {r:5, c:0}, e: {r:5, c:5} }, 
                        { s: {r:7, c:0}, e: {r:7, c:5} }, { s: {r:8, c:0}, e: {r:8, c:5} }
                    ];

                    const range = XLSX.utils.decode_range(ws['!ref']);
                    for (let R = range.s.r; R <= range.e.r; R++) {
                        for (let C = range.s.c; C <= range.e.c; C++) {
                            const cellRef = XLSX.utils.encode_cell({r: R, c: C});
                            if (!ws[cellRef]) continue;
                            ws[cellRef].s = ws[cellRef].s || {};

                            if (R <= 8) ws[cellRef].s = { font: { bold: true }, alignment: { horizontal: "center", vertical: "center" } };
                            if (R === 10) ws[cellRef].s = { fill: { fgColor: { rgb: "dc3545" } }, font: { bold: true, color: { rgb: "FFFFFF" } }, alignment: { horizontal: "center", vertical: "center" }, border: { top: { style: "thin", color: { rgb: "000000" } }, bottom: { style: "thin", color: { rgb: "000000" } }, left: { style: "thin", color: { rgb: "000000" } }, right: { style: "thin", color: { rgb: "000000" } } } };
                            if (R > 10 && R < barisTerakhirTabel) { ws[cellRef].s.border = { top: { style: "thin", color: { rgb: "000000" } }, bottom: { style: "thin", color: { rgb: "000000" } }, left: { style: "thin", color: { rgb: "000000" } }, right: { style: "thin", color: { rgb: "000000" } } }; ws[cellRef].s.alignment = { vertical: "center" }; }
                            if (R >= (barisTerakhirTabel + 1)) ws[cellRef].s = { alignment: { horizontal: "center" } };
                        }
                    }

                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, "Tanda_Terima_Transport");
                    XLSX.writeFile(wb, `Transport_${jabatan}_${subrayon}.xlsx`);
                    Swal.fire({ icon: 'success', title: 'Berhasil!', text: `File Excel Transport siap dicetak.`, confirmButtonColor: '#198754' });
               } else { Swal.fire({ icon: 'info', title: 'Data Kosong', text: `Data ${jabatan} di ${subrayon} tidak ditemukan.` }); }
            } else { Swal.fire({ icon: 'error', title: 'Sistem Error', text: result.message || 'Terjadi masalah pada logika server.' }); }
        } catch (error) { Swal.fire({ icon: 'error', title: 'Koneksi Gagal', text: 'Terjadi masalah saat menghubungi server.' }); } 
        finally { btn.innerHTML = teksAsli; btn.disabled = false; }
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bendahara Subrayon - EMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #0f172a; color: #ffffff; font-family: 'Segoe UI', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 15px; }
    </style>
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="fw-bold mb-0 text-info" id="namaPic">Memuat...</h4>
            <p class="text-white-50 small mb-0">Bendahara Wilayah: <strong class="text-white" id="namaRayon"></strong></p>
        </div>
        <button class="btn btn-sm btn-outline-danger" onclick="logout()">Logout</button>
    </div>

    <div class="glass-card p-4 mb-4 border-start border-4 border-info">
        <h5 class="fw-bold mb-3">Tugas Utama Subrayon</h5>
        <button onclick="window.location.href='validasi_pembayaran.html'" class="btn btn-info w-100 py-3 fw-bold text-dark mb-3">
            <i class="bi bi-wallet2 me-2"></i> Validasi Pembayaran & Terima Tunai
        </button>
        <button onclick="window.location.href='rekap_sekolah.html'" class="btn btn-outline-light w-100 py-3 text-start">
            <i class="bi bi-building me-2"></i> Pantau Rekap Pendaftaran Wilayah
        </button>
    </div>
</div>
<script>
    const userData = JSON.parse(localStorage.getItem('userLogin'));
    if(!userData || userData.role !== 'Bendahara_Subrayon') window.location.href = "index.html";
    document.getElementById('namaPic').innerText = userData.nama_pic;
    document.getElementById('namaRayon').innerText = userData.subrayon;
    function logout() { localStorage.removeItem('userLogin'); window.location.href = "index.html"; }
</script>
</body>
</html>

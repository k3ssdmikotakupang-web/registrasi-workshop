<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Absensi Pusat - EMS 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        body { background-color: #0f172a; color: #ffffff; font-family: 'Segoe UI', sans-serif; padding-bottom: 50px; }
        .neon-nav { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0, 242, 254, 0.3); }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 15px; box-shadow: 0 8px 32px 0 rgba(0,0,0,0.3); }
        .text-neon { background: linear-gradient(to right, #00f2fe, #4facfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: bold; }
        .btn-neon { background: linear-gradient(45deg, #00f2fe, #4facfe); border: none; color: white; border-radius: 8px; font-weight: 600; }
        #qr-reader { border-radius: 10px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.2); }
        .swal2-popup.swal-dark { background: #1e293b !important; color: #ffffff !important; border: 1px solid rgba(255,255,255,0.1); border-radius: 15px !important; }
        /* Gaya khusus untuk dropdown yang terkunci */
        select:disabled { background-color: #1e293b !important; color: #94a3b8 !important; cursor: not-allowed; border-color: #475569 !important; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark neon-nav sticky-top mb-4">
    <div class="container">
        <span class="navbar-brand text-neon" style="cursor: pointer;" onclick="kembaliKeDasbor()">
            <i class="bi bi-qr-code-scan me-2"></i> Scanner Pusat
        </span>
        <button class="btn btn-sm btn-outline-light shadow-sm" onclick="kembaliKeDasbor()">
            <i class="bi bi-arrow-left"></i> Kembali
        </button>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="glass-card p-4 text-center">
                <h4 class="text-neon mb-1">POSKO ABSENSI</h4>
                <p class="text-white-50 small mb-3">Arahkan kamera ke QR Code peserta untuk memvalidasi absensi.</p>

                <!-- Pilihan Sesi Absensi (Dengan Radar Pengunci) -->
                <div class="mb-3 text-start bg-dark p-3 rounded border border-secondary shadow-sm">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label class="small text-info fw-bold"><i class="bi bi-geo-alt-fill me-1"></i> Mode Sesi Saat Ini:</label>
                        <span id="badgeGembok" class="badge bg-secondary"><i class="bi bi-arrow-repeat spin"></i> Memuat...</span>
                    </div>
                    
                    <select id="pilihSesi" class="form-select bg-dark text-white border-info shadow-sm" disabled>
                        <option value="Kehadiran_Utama">Check-In Utama (Ambil ATK)</option>
                        <option value="Sesi_1">Absensi Hari 1 / Sesi 1</option>
                        <option value="Sesi_2">Absensi Hari 2 / Sesi 2</option>
                        <option value="Sesi_3">Absensi Penutupan / Sesi 3</option>
                    </select>
                    
                    <small id="teksBantuanSesi" class="text-white-50 mt-2 d-block" style="font-size: 0.75rem;">
                        <i class="bi bi-info-circle"></i> Sesi absensi dikunci oleh Admin Pusat untuk menghindari kesalahan rekapitulasi.
                    </small>
                </div>

                <div id="qr-reader" class="mb-3"></div>
                
                <button class="btn btn-neon w-100 py-3 mb-2 shadow" id="btnMulaiScan" onclick="mulaiScanner()">
                    <i class="bi bi-camera-fill me-2"></i> Nyalakan Kamera Scanner
                </button>
                <button class="btn btn-danger w-100 py-3 shadow" id="btnStopScan" style="display: none;" onclick="matikanScanner()">
                    <i class="bi bi-stop-circle me-2"></i> Matikan Kamera
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyXhfdbHD1LhvGR_AKTfHVpVtLOm3DOT4hx7zp9YwdQGeBHdni0JXuMbqBYs5j5X5fx/exec";
    let html5QrCode = null;
    const Toast = Swal.mixin({ customClass: { popup: 'swal-dark' }, confirmButtonColor: '#00f2fe' });

    // --- PENGAMAN LOGIN & ROUTING KECIL ---
    const userData = JSON.parse(localStorage.getItem('userLogin'));
    if (!userData) window.location.href = "index.html";
    
    const roleUser = (userData.role || '').toLowerCase();
    const jabatanUser = (userData.jabatan || '').toLowerCase();
    const isSuperAdmin = (roleUser === 'admin_pusat' || roleUser === 'admin' || jabatanUser.includes('ketua') || jabatanUser.includes('jawab'));

    function kembaliKeDasbor() {
        if (isSuperAdmin) { window.location.href = "dashboard_admin.html"; } 
        else if (jabatanUser.includes('bendahara') || roleUser.includes('bendahara')) { window.location.href = "dashboard_bendahara_panitia.html"; } 
        else { window.location.href = "dashboard_panitia.html"; }
    }

    // --- INISIALISASI SESI GLOBAL ---
    window.onload = async function() {
        // Jika yang login adalah Super Admin, beri kuasa untuk mengubah sesi
        if (isSuperAdmin) {
            let selectSesi = document.getElementById('pilihSesi');
            selectSesi.removeAttribute('disabled'); // Buka Gembok
            
            // Beri perintah penguncian global saat Admin mengubah pilihan
            selectSesi.addEventListener('change', function(e) {
                Swal.fire({
                    title: 'Kunci Sesi Global?',
                    text: `Anda akan memaksa semua scanner panitia berpindah ke ${e.target.options[e.target.selectedIndex].text}. Lanjutkan?`,
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#00f2fe',
                    cancelButtonColor: '#ef4444',
                    confirmButtonText: 'Ya, Kunci Sekarang!',
                    customClass: { popup: 'swal-dark' }
                }).then(async (result) => {
                    if (result.isConfirmed) {
                        Toast.fire({ title: 'Menyinkronkan...', didOpen: () => { Swal.showLoading() } });
                        try {
                            const res = await fetch(API_URL, { 
                                method: 'POST', 
                                body: JSON.stringify({ action: 'set_sesi_aktif', sesi: e.target.value }) 
                            });
                            const output = await res.json();
                            if (output.status === 'success') {
                                Toast.fire({ icon: 'success', title: 'Berhasil', text: output.message });
                            }
                        } catch(err) { Toast.fire({ icon: 'error', title: 'Gagal', text: 'Koneksi bermasalah' }); }
                    } else {
                        // Jika batal, kembalikan ke sesi awal
                        tarikStatusSesi();
                    }
                });
            });

            document.getElementById('badgeGembok').className = "badge bg-warning text-dark";
            document.getElementById('badgeGembok').innerHTML = '<i class="bi bi-unlock-fill"></i> Mode Admin';
            document.getElementById('teksBantuanSesi').innerHTML = '<i class="bi bi-exclamation-triangle-fill text-warning"></i> Pilihan Anda akan mengunci <b>semua scanner panitia</b> secara otomatis.';
        }
        
        // Tarik status sesi dari backend saat pertama buka
        tarikStatusSesi();
    };

    // Fungsi menarik sesi terkunci dari server
    async function tarikStatusSesi() {
        try {
            const res = await fetch(API_URL, { 
                method: 'POST', 
                body: JSON.stringify({ action: 'get_pengaturan' }) 
            });
            const output = await res.json();
            if (output.status === 'success' && output.data.sesi_aktif) {
                document.getElementById('pilihSesi').value = output.data.sesi_aktif;
                if (!isSuperAdmin) {
                    document.getElementById('badgeGembok').className = "badge bg-success";
                    document.getElementById('badgeGembok').innerHTML = '<i class="bi bi-lock-fill"></i> Terkunci (Global)';
                }
            }
        } catch(err) {
            console.log("Gagal menarik status sesi", err);
        }
    }

    // Fungsi Auto-Retry
    async function fetchDenganAntrean(url, options, maksimalPercobaan = 3) {
        for (let i = 0; i < maksimalPercobaan; i++) {
            try {
                const response = await fetch(url, options);
                if (!response.ok) throw new Error('Jaringan bermasalah');
                return await response.json(); 
            } catch (err) {
                if (i === maksimalPercobaan - 1) throw err; 
                await new Promise(resolve => setTimeout(resolve, 1000 * (i + 1))); 
            }
        }
    }

    // --- MESIN SCANNER ---
    function mulaiScanner() {
        document.getElementById('btnMulaiScan').style.display = 'none';
        document.getElementById('btnStopScan').style.display = 'block';

        html5QrCode = new Html5Qrcode("qr-reader");
        html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 250, height: 250 } },
            async (decodedText) => {
                matikanScanner();
                Toast.fire({ title: 'Memvalidasi...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });

                try {
                    const result = await fetchDenganAntrean(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ 
                            action: 'proses_checkin', 
                            id_qr: decodedText,
                            sesi: document.getElementById('pilihSesi').value 
                        })
                    });

                    if (result.status === 'success') {
                        Swal.fire({ icon: 'success', title: 'BERHASIL!', text: result.message, customClass: { popup: 'swal-dark' }, background: '#1e293b', color: '#fff', confirmButtonColor: '#00f2fe'
                        }).then(() => { mulaiScanner(); });
                    } else if (result.status === 'warning') {
                        Swal.fire({ icon: 'warning', title: 'Sudah Check-In', text: result.message, customClass: { popup: 'swal-dark' }, background: '#1e293b', color: '#fff', confirmButtonColor: '#ffc107'
                        }).then(() => { mulaiScanner(); });
                    } else {
                        Swal.fire({ icon: 'error', title: 'Gagal', text: result.message, customClass: { popup: 'swal-dark' }, background: '#1e293b', color: '#fff'
                        }).then(() => { mulaiScanner(); });
                    }
                } catch(e) {
                    Toast.fire({ icon: 'error', title: 'Jaringan Padat', text: 'Server sedang antre panjang, silakan scan ulang.' });
                    mulaiScanner();
                }
            },
            (errorMessage) => {}
        ).catch(err => {
            Toast.fire({ icon: 'error', title: 'Gagal Akses Kamera', text: 'Pastikan izin kamera aktif.' });
            document.getElementById('btnMulaiScan').style.display = 'block';
            document.getElementById('btnStopScan').style.display = 'none';
        });
    }

    function matikanScanner() {
        if (html5QrCode) {
            html5QrCode.stop().then(() => {
                document.getElementById('btnMulaiScan').style.display = 'block';
                document.getElementById('btnStopScan').style.display = 'none';
                html5QrCode = null;
            }).catch(err => {});
        }
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panitia Check-In - EMS 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <!-- Library QR Scanner & SweetAlert2 -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        body { background-color: #0f172a; color: #ffffff; font-family: 'Segoe UI', sans-serif; padding-bottom: 50px; }
        .neon-nav { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0, 242, 254, 0.3); }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 15px; box-shadow: 0 8px 32px 0 rgba(0,0,0,0.3); }
        .text-neon { background: linear-gradient(to right, #00f2fe, #4facfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: bold; }
        .btn-neon { background: linear-gradient(45deg, #00f2fe, #4facfe); border: none; color: white; border-radius: 8px; font-weight: 600; }
        #qr-reader { border-radius: 10px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.2); }
        .swal2-popup.swal-dark { background: #1e293b !important; color: #ffffff !important; border: 1px solid rgba(255,255,255,0.1); border-radius: 15px !important; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark neon-nav sticky-top mb-4">
    <div class="container">
        <span class="navbar-brand text-neon">Panitia Check-In</span>
        <button class="btn btn-sm btn-outline-danger" onclick="window.location.href='index.html'"><i class="bi bi-box-arrow-right"></i> Keluar</button>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="glass-card p-4 text-center">
                <h4 class="text-neon mb-1">SCAN QR PESERTA</h4>
                <p class="text-white-50 small mb-4">Arahkan kamera ke QR Code peserta untuk memvalidasi kehadiran & penyerahan ATK.</p>

                <!-- Area Kamera Scanner -->
                <div id="qr-reader" class="mb-3"></div>
                
                <button class="btn btn-neon w-100 py-2 mb-2" id="btnMulaiScan" onclick="mulaiScanner()">
                    <i class="bi bi-camera-fill me-2"></i> Nyalakan Kamera Scanner
                </button>
                <button class="btn btn-danger w-100 py-2" id="btnStopScan" style="display: none;" onclick="matikanScanner()">
                    Matikan Kamera
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwLdvXuLpbUvBE666hblNZm4y1HuoogGUl8vdHorb-aT9s6T5X6xHwXAcPaeEvrZ5RS/exec";
    let html5QrCode = null;

    const Toast = Swal.mixin({
        customClass: { popup: 'swal-dark' },
        confirmButtonColor: '#00f2fe'
    });

    function mulaiScanner() {
        document.getElementById('btnMulaiScan').style.display = 'none';
        document.getElementById('btnStopScan').style.display = 'block';

        html5QrCode = new Html5Qrcode("qr-reader");
        html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 250, height: 250 } },
            async (decodedText) => {
                // Hentikan sementara scanner agar tidak scan beruntun
                matikanScanner();
                
                // Kirim ID QR ke server untuk diproses
                Toast.fire({ title: 'Memvalidasi...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });

                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: 'proses_checkin', id_qr: decodedText })
                    });
                    const result = await response.json();

                    if (result.status === 'success') {
                        Swal.fire({
                            icon: 'success', title: 'CHECK-IN BERHASIL!', text: result.message,
                            customClass: { popup: 'swal-dark' }, background: '#1e293b', color: '#fff', confirmButtonColor: '#00f2fe'
                        }).then(() => { mulaiScanner(); }); // Nyalakan lagi kameranya untuk peserta berikutnya
                    } else if (result.status === 'warning') {
                        Swal.fire({
                            icon: 'warning', title: 'Sudah Check-In', text: result.message,
                            customClass: { popup: 'swal-dark' }, background: '#1e293b', color: '#fff', confirmButtonColor: '#ffc107'
                        }).then(() => { mulaiScanner(); });
                    } else {
                        Swal.fire({
                            icon: 'error', title: 'Gagal', text: result.message,
                            customClass: { popup: 'swal-dark' }, background: '#1e293b', color: '#fff'
                        }).then(() => { mulaiScanner(); });
                    }
                } catch(e) {
                    Toast.fire({ icon: 'error', title: 'Error Koneksi' });
                    mulaiScanner();
                }
            },
            (errorMessage) => {}
        ).catch(err => {
            Toast.fire({ icon: 'error', title: 'Gagal Akses Kamera' });
            document.getElementById('btnMulaiScan').style.display = 'block';
            document.getElementById('btnStopScan').style.display = 'none';
        });
    }

    function matikanScanner() {
        if (html5QrCode) {
            html5QrCode.stop().then(() => {
                document.getElementById('btnMulaiScan').style.display = 'block';
                document.getElementById('btnStopScan').style.display = 'none';
                html5QrCode = null;
            }).catch(err => {});
        }
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Kepanitiaan - EMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        body { background-color: #0f172a; color: #ffffff; font-family: 'Segoe UI', sans-serif; padding-bottom: 50px; }
        .neon-nav { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0, 242, 254, 0.3); }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 15px; box-shadow: 0 8px 32px 0 rgba(0,0,0,0.3); }
        .baris-anggota { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; border: 1px dashed rgba(255,255,255,0.2); }
        .form-control, .form-select { font-size: 0.85rem; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark neon-nav sticky-top mb-4">
    <div class="container-fluid px-4">
        <span class="navbar-brand fw-bold text-info"><i class="bi bi-people-fill"></i> Manajemen Kepanitiaan</span>
        <button class="btn btn-sm btn-outline-light" onclick="window.location.href='dashboard_admin.html'"><i class="bi bi-arrow-left"></i> Kembali</button>
    </div>
</nav>

<div class="container-fluid px-4">
    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card glass-card p-3 text-white h-100" onclick="bukaModalPengumuman()" style="cursor: pointer; border-left: 4px solid #f59e0b;">
                <div class="d-flex align-items-center">
                    <div class="rounded-circle bg-warning text-dark p-3 me-3 d-flex align-items-center justify-content-center" style="width: 50px; height: 50px;">
                        <i class="bi bi-megaphone-fill fs-4"></i>
                    </div>
                    <div>
                        <h6 class="fw-bold text-warning mb-1">Rilis Pengumuman</h6>
                        <small class="text-white-50">Kirim informasi realtime ke dashboard peserta</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Area Form Input -->
    <div class="glass-card p-4 mb-4" style="border-left: 4px solid #f093fb;">
        <h5 class="fw-bold mb-4 text-warning">Form Input SK & Anggota Kepanitiaan</h5>
        <form id="formPanitia" onsubmit="uploadPanitiaKolektif(event)">
            
            <div class="mb-4 pb-3 border-bottom border-secondary">
                <label class="form-label fw-bold">1. Upload File SK Kepanitiaan</label>
                <input type="file" id="panitia_file" class="form-control bg-dark text-white border-secondary w-50" required accept=".pdf, .doc, .docx, .jpg, .png">
                <div class="form-text text-white-50 small mt-1">*Maksimal 3 MB.</div>
            </div>

            <label class="form-label fw-bold mb-3">2. Masukkan Daftar Anggota (Kolektif)</label>
            
            <div id="wadah-anggota">
                <div class="row g-2 mb-3 baris-anggota">
                    <div class="col-md-2">
                        <label class="small text-white-50">Nama Lengkap & Gelar</label>
                        <input type="text" class="form-control bg-dark text-white border-secondary i-nama" required placeholder="Cth: Drs. Johanes">
                    </div>
                    <div class="col-md-2">
                        <label class="small text-white-50">NIP (Tulis '-' jika Non-PNS)</label>
                        <input type="text" class="form-control bg-dark text-white border-secondary i-nip" required placeholder="Cth: 198001012005011001">
                    </div>
                    <div class="col-md-2">
                        <label class="small text-white-50">Pangkat/Golongan</label>
                        <select class="form-select bg-dark text-white border-secondary i-pangkat" required>
                            <option value="-">Non-PNS / P3K</option>
                            <option value="II/a">II/a - Pengatur Muda</option>
                            <option value="II/b">II/b - Pengatur Muda Tk.I</option>
                            <option value="II/c">II/c - Pengatur</option>
                            <option value="II/d">II/d - Pengatur Tk.I</option>
                            <option value="III/a">III/a - Penata Muda</option>
                            <option value="III/b">III/b - Penata Muda Tk.I</option>
                            <option value="III/c">III/c - Penata</option>
                            <option value="III/d">III/d - Penata Tk.I</option>
                            <option value="IV/a">IV/a - Pembina</option>
                            <option value="IV/b">IV/b - Pembina Tk.I</option>
                            <option value="IV/c">IV/c - Pembina Utama Muda</option>
                            <option value="IV/d">IV/d - Pembina Utama Madya</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="small text-white-50">Jabatan Panitia</label>
                        <select class="form-select bg-dark text-white border-secondary i-jabatan" required>
                            <option value="">-- Pilih --</option>
                            <option value="Pelindung / Penasehat">Pelindung / Penasehat</option>
                            <option value="Pengarah">Pengarah</option>
                            <option value="Penanggung Jawab">Penanggung Jawab</option>
                            <option value="Ketua">Ketua</option>
                            <option value="Sekretaris 1">Sekretaris 1</option>
                            <option value="Sekretaris 2">Sekretaris 2</option>
                            <option value="Bendahara Panitia">Bendahara Panitia</option>
                            <option value="Seksi Acara">Seksi Acara</option>
                            <option value="Seksi Perlengkapan">Seksi Perlengkapan</option>
                            <option value="Seksi Konsumsi">Seksi Konsumsi</option>
                            <option value="Seksi Humas / Dokumentasi">Seksi Humas / Dokumentasi</option>
                            <option value="Tim Teknis">Tim Teknis</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="small text-white-50">Job Deskripsi</label>
                        <input type="text" class="form-control bg-dark text-white border-secondary i-jobdesk" required placeholder="Tugas singkat">
                    </div>
                    <div class="col-md-1 d-flex align-items-end">
                        <button type="button" class="btn btn-outline-danger w-100 disabled" style="opacity: 0.5;"><i class="bi bi-trash"></i></button>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-between mt-3">
                <button type="button" class="btn btn-outline-info" onclick="tambahBaris()"><i class="bi bi-plus-lg me-2"></i>Tambah Anggota Lain</button>
                <button type="submit" id="btnUploadPanitia" class="btn btn-primary fw-bold px-4">
                    <i class="bi bi-cloud-arrow-up-fill me-2"></i> Simpan Seluruh Data
                </button>
            </div>
        </form>
    </div>

    <!-- AREA BARU: TABEL DAFTAR PANITIA -->
    <div class="glass-card p-4 mb-4" style="border-left: 4px solid #00f2fe;">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold text-info mb-0"><i class="bi bi-list-columns-reverse me-2"></i> Daftar Anggota Kepanitiaan Tersimpan</h5>
            <button class="btn btn-sm btn-outline-light" onclick="muatTabelPanitia()">
                <i class="bi bi-arrow-clockwise"></i> Segarkan Tabel
            </button>
        </div>
        
        <div class="table-responsive rounded border border-secondary">
            <table class="table table-dark table-hover table-bordered align-middle mb-0">
                <thead class="table-active text-center text-white-50">
                    <tr>
                        <th style="width: 50px;">No</th>
                        <th>ID Panitia</th>
                        <th>Nama & Gelar</th>
                        <th>Jabatan</th>
                    </tr>
                </thead>
                <tbody id="tbodyPanitia">
                    <tr>
                        <td colspan="4" class="text-center text-muted py-4">Memuat data dari database... <div class="spinner-border spinner-border-sm text-info ms-2"></div></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <button onclick="window.location.href='cetak_idcard_panitia.html'" class="btn btn-outline-light w-100 py-3 text-start fw-bold mb-3">
        <i class="bi bi-person-badge-fill me-2"></i> Cetak ID Card & QR Panitia
    </button>
</div>

<!-- Modal Pengumuman -->
<div class="modal fade" id="modalFormPengumuman" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark text-white" style="border: 1px solid rgba(255,255,255,0.2); border-radius: 15px;">
            <div class="modal-header border-secondary">
                <h6 class="modal-title text-warning fw-bold"><i class="bi bi-megaphone-fill me-2"></i> Rilis Pengumuman Baru</h6>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="formPengumuman" onsubmit="simpanPengumuman(event)">
                    <div class="mb-3">
                        <label class="form-label small text-white-50">Judul Pengumuman</label>
                        <input type="text" id="pJudul" class="form-control bg-dark text-white border-secondary" required placeholder="Cth: Perubahan Jadwal Sesi 1">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small text-white-50">Isi Pengumuman</label>
                        <textarea id="pIsi" class="form-control bg-dark text-white border-secondary" rows="3" required placeholder="Tuliskan isi detail pengumuman..."></textarea>
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label small text-white-50">Target Penerima</label>
                            <select id="pTarget" class="form-select bg-dark text-white border-secondary">
                                <option value="Semua">Semua Pengguna</option>
                                <option value="Peserta">Hanya Peserta</option>
                                <option value="Panitia">Hanya Panitia</option>
                            </select>
                        </div>
                        <div class="col-6">
                            <label class="form-label small text-white-50">Status Publikasi</label>
                            <select id="pStatus" class="form-select bg-dark text-white border-secondary">
                                <option value="Aktif">Tayangkan (Aktif)</option>
                                <option value="Arsip">Sembunyikan (Arsip)</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" id="btnKirimPengumuman" class="btn btn-warning w-100 fw-bold"><i class="bi bi-send-fill me-2"></i> Kirim Pengumuman</button>
                </form>
            </div>
        </div>
    </div>
</div>
    
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwLdvXuLpbUvBE666hblNZm4y1HuoogGUl8vdHorb-aT9s6T5X6xHwXAcPaeEvrZ5RS/exec";
    
    function tambahBaris() {
        const wadah = document.getElementById('wadah-anggota');
        const barisBaru = document.createElement('div');
        barisBaru.className = 'row g-2 mb-3 baris-anggota';
        barisBaru.innerHTML = `
            <div class="col-md-2"><input type="text" class="form-control bg-dark text-white border-secondary i-nama" required placeholder="Nama Anggota"></div>
            <div class="col-md-2"><input type="text" class="form-control bg-dark text-white border-secondary i-nip" required placeholder="NIP / Strip"></div>
            <div class="col-md-2">
                <select class="form-select bg-dark text-white border-secondary i-pangkat" required>
                    <option value="-">Non-PNS / P3K</option>
                    <option value="II/a">II/a - Pengatur Muda</option><option value="II/b">II/b - Pengatur Muda Tk.I</option>
                    <option value="II/c">II/c - Pengatur</option><option value="II/d">II/d - Pengatur Tk.I</option>
                    <option value="III/a">III/a - Penata Muda</option><option value="III/b">III/b - Penata Muda Tk.I</option>
                    <option value="III/c">III/c - Penata</option><option value="III/d">III/d - Penata Tk.I</option>
                    <option value="IV/a">IV/a - Pembina</option><option value="IV/b">IV/b - Pembina Tk.I</option>
                    <option value="IV/c">IV/c - Pembina Utama Muda</option><option value="IV/d">IV/d - Pembina Utama Madya</option>
                </select>
            </div>
            <div class="col-md-2">
                <select class="form-select bg-dark text-white border-secondary i-jabatan" required>
                    <option value="">-- Pilih --</option>
                    <option value="Pelindung / Penasehat">Pelindung / Penasehat</option><option value="Pengarah">Pengarah</option>
                    <option value="Penanggung Jawab">Penanggung Jawab</option><option value="Ketua">Ketua</option>
                    <option value="Sekretaris 1">Sekretaris 1</option><option value="Sekretaris 2">Sekretaris 2</option>
                    <option value="Bendahara Panitia">Bendahara Panitia</option><option value="Seksi Acara">Seksi Acara</option>
                    <option value="Seksi Perlengkapan">Seksi Perlengkapan</option><option value="Seksi Konsumsi">Seksi Konsumsi</option>
                    <option value="Seksi Humas / Dokumentasi">Seksi Humas / Dokumentasi</option><option value="Tim Teknis">Tim Teknis</option>
                </select>
            </div>
            <div class="col-md-3"><input type="text" class="form-control bg-dark text-white border-secondary i-jobdesk" required placeholder="Tugas singkat"></div>
            <div class="col-md-1 d-flex align-items-end"><button type="button" class="btn btn-danger w-100" onclick="this.parentElement.parentElement.remove()"><i class="bi bi-trash"></i></button></div>
        `;
        wadah.appendChild(barisBaru);
    }

    async function uploadPanitiaKolektif(event) {
        event.preventDefault();
        
        const fileInput = document.getElementById('panitia_file').files[0];
        if (fileInput.size > 3 * 1024 * 1024) { Swal.fire('Terlalu Besar!', 'Ukuran file SK maksimal 3 MB.', 'warning'); return; }

        let elemenBaris = document.querySelectorAll('.baris-anggota');
        let arrayAnggota = [];
        elemenBaris.forEach(baris => {
            arrayAnggota.push({
                nama: baris.querySelector('.i-nama').value,
                nip: baris.querySelector('.i-nip').value,
                pangkat: baris.querySelector('.i-pangkat').value,
                jabatan: baris.querySelector('.i-jabatan').value,
                jobdesk: baris.querySelector('.i-jobdesk').value
            });
        });

        const btn = document.getElementById('btnUploadPanitia');
        const teksAsli = btn.innerHTML;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Menyimpan...';
        btn.disabled = true;

        const reader = new FileReader();
        reader.onload = async function(e) {
            const base64Data = e.target.result.split(',')[1]; 
            const payload = { action: 'upload_sk_panitia_kolektif', anggota: arrayAnggota, fileName: fileInput.name, mimeType: fileInput.type, fileData: base64Data };

            try {
                const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
                const result = await res.json();
                if(result.status === 'success') {
                    Swal.fire('Berhasil!', result.message, 'success');
                    document.getElementById('formPanitia').reset(); document.getElementById('wadah-anggota').innerHTML = ''; tambahBaris(); 
                    document.querySelector('.baris-anggota .btn-danger').className = 'btn btn-outline-danger w-100 disabled';
                    document.querySelector('.baris-anggota .btn-outline-danger').style.opacity = '0.5';
                    document.querySelector('.baris-anggota .btn-outline-danger').onclick = null;
                    
                    muatTabelPanitia(); 
                } else { Swal.fire('Gagal!', result.message, 'error'); }
            } catch(error) { Swal.fire('Error', 'Gagal server.', 'error'); } 
            finally { btn.innerHTML = teksAsli; btn.disabled = false; }
        };
        reader.readAsDataURL(fileInput);
    }

    let modalPengumumanObj = null;

    function bukaModalPengumuman() {
        if(!modalPengumumanObj) {
            modalPengumumanObj = new bootstrap.Modal(document.getElementById('modalFormPengumuman'));
        }
        document.getElementById('formPengumuman').reset();
        modalPengumumanObj.show();
    }

    async function simpanPengumuman(e) {
        e.preventDefault();
        
        const submitBtn = document.getElementById('btnKirimPengumuman');
        const teksAsli = submitBtn.innerText;
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Menerbitkan...';

        const payload = {
            action: 'add_pengumuman',
            role: 'panitia', 
            jabatan: 'admin',
            judul: document.getElementById('pJudul').value,
            isi: document.getElementById('pIsi').value,
            target: document.getElementById('pTarget').value,
            status: document.getElementById('pStatus').value
        };

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });
            const result = await response.json();

            if (result.status === 'success') {
                Swal.fire({ icon: 'success', title: 'Berhasil!', text: result.message, background: '#1e293b', color: '#fff' });
                modalPengumumanObj.hide();
            } else {
                Swal.fire({ icon: 'error', title: 'Gagal', text: result.message, background: '#1e293b', color: '#fff' });
            }
        } catch (err) {
            Swal.fire({ icon: 'error', title: 'Error', text: 'Gagal terhubung ke server database.', background: '#1e293b', color: '#fff' });
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = teksAsli;
        }
    }

    // FUNGSI UNTUK MENARIK DATA PANITIA KE TABEL
    async function muatTabelPanitia() {
        const tbody = document.getElementById('tbodyPanitia');
        tbody.innerHTML = `<tr><td colspan="4" class="text-center text-muted py-4">Memperbarui data... <div class="spinner-border spinner-border-sm text-info ms-2"></div></td></tr>`;
        
        try {
            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'get_all_panitia' }) });
            const result = await res.json();
            
            if(result.status === 'success' && result.data.length > 0) {
                let html = '';
                result.data.forEach((p, index) => {
                    html += `
                        <tr>
                            <td class="text-center text-white-50">${index + 1}</td>
                            <td class="text-center"><span class="badge bg-secondary">${p.id_panitia}</span></td>
                            <td class="fw-bold text-light">${p.nama}</td>
                            <td class="text-info">${p.jabatan}</td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html;
            } else {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center text-white-50 py-4">Belum ada data panitia yang terdaftar di database.</td></tr>';
            }
        } catch(e) {
            tbody.innerHTML = '<tr><td colspan="4" class="text-center text-danger py-4"><i class="bi bi-exclamation-triangle-fill me-2"></i> Gagal menarik data dari server. Periksa koneksi API Anda.</td></tr>';
        }
    }

    // JALANKAN PEMUATAN TABEL SAAT HALAMAN DIBUKA
    document.addEventListener('DOMContentLoaded', muatTabelPanitia);
</script>    
</body>
</html>

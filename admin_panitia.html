<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Kepanitiaan - EMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        body { background-color: #0f172a; color: #ffffff; font-family: 'Segoe UI', sans-serif; padding-bottom: 50px; }
        .neon-nav { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0, 242, 254, 0.3); }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 15px; box-shadow: 0 8px 32px 0 rgba(0,0,0,0.3); }
        .baris-anggota { background: rgba(0,0,0,0.2); padding: 20px; border-radius: 12px; border: 1px dashed rgba(255,255,255,0.2); position: relative; transition: all 0.3s ease; }
        .baris-anggota:hover { border-color: #00f2fe; background: rgba(0,0,0,0.4); }
        .form-control, .form-select { font-size: 0.85rem; }
        .master-list { max-height: 120px; overflow-y: auto; scrollbar-width: thin; }
        .btn-hapus-kartu { position: absolute; top: 10px; right: 10px; z-index: 10; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark neon-nav sticky-top mb-4">
    <div class="container-fluid px-4">
        <span class="navbar-brand fw-bold text-info"><i class="bi bi-people-fill"></i> Manajemen Kepanitiaan</span>
        <button class="btn btn-sm btn-outline-light" onclick="window.location.href='dashboard_admin.html'"><i class="bi bi-arrow-left"></i> Kembali</button>
    </div>
</nav>

<div class="container-fluid px-4">

    <!-- PANEL MASTER DATA: DIVISI & JABATAN -->
    <div class="glass-card p-4 mb-4" style="border-left: 4px solid #f59e0b;">
        <h5 class="fw-bold mb-3 text-warning"><i class="bi bi-database-fill-add me-2"></i> Pengaturan Master: Divisi & Jabatan Kepanitiaan</h5>
        <div class="row g-4">
            <!-- Master Divisi -->
            <div class="col-md-6">
                <label class="form-label small text-white-50">Tambah Divisi / Seksi Baru</label>
                <div class="input-group">
                    <input type="text" id="inputMasterDivisi" class="form-control bg-dark text-white border-secondary" placeholder="Cth: Kesekretariatan">
                    <button class="btn btn-warning fw-bold" onclick="tambahMaster('Divisi')">Tambah</button>
                </div>
                <div class="mt-2 border border-secondary rounded master-list bg-dark p-2" id="listDivisi">
                    <div class="text-white-50 small">Memuat data...</div>
                </div>
            </div>
            <!-- Master Jabatan -->
            <div class="col-md-6">
                <label class="form-label small text-white-50">Tambah Jabatan Kepanitiaan</label>
                <div class="input-group">
                    <input type="text" id="inputMasterJabatan" class="form-control bg-dark text-white border-secondary" placeholder="Cth: Ketua Panitia">
                    <button class="btn btn-warning fw-bold" onclick="tambahMaster('Jabatan')">Tambah</button>
                </div>
                <div class="mt-2 border border-secondary rounded master-list bg-dark p-2" id="listJabatan">
                    <div class="text-white-50 small">Memuat data...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- AREA FORM INPUT SK & ANGGOTA -->
    <div class="glass-card p-4 mb-4" style="border-left: 4px solid #f093fb;">
        <h5 class="fw-bold mb-4 text-warning">Form Input SK & Anggota Kepanitiaan</h5>
        <form id="formPanitia" onsubmit="uploadPanitiaKolektif(event)">
            
            <div class="mb-4 pb-3 border-bottom border-secondary">
                <label class="form-label fw-bold">1. Upload File SK Kepanitiaan</label>
                <input type="file" id="panitia_file" class="form-control bg-dark text-white border-secondary w-50" required accept=".pdf, .doc, .docx, .jpg, .png">
                <div class="form-text text-white-50 small mt-1">*Maksimal 3 MB.</div>
            </div>

            <label class="form-label fw-bold mb-3">2. Masukkan Daftar Anggota (Kolektif)</label>
            
            <div id="wadah-anggota">
                <!-- Baris Anggota (Desain Kartu Lebar & Lega) -->
                <div class="baris-anggota mb-3">
                    <button type="button" class="btn btn-sm btn-outline-danger btn-hapus-kartu disabled" style="opacity: 0.5;" title="Baris pertama tidak bisa dihapus"><i class="bi bi-x-lg"></i></button>
                    
                    <div class="row g-3">
                        <!-- Baris Atas -->
                        <div class="col-md-4">
                            <label class="small text-white-50 mb-1">Nama Lengkap & Gelar</label>
                            <input type="text" class="form-control bg-dark text-white border-secondary i-nama" required placeholder="Cth: Drs. Johanes">
                        </div>
                        <div class="col-md-4">
                            <label class="small text-white-50 mb-1">NIP (Tulis '-' jika Non-PNS)</label>
                            <input type="text" class="form-control bg-dark text-white border-secondary i-nip" required placeholder="Cth: 198001012005011001">
                        </div>
                        <div class="col-md-4">
                            <label class="small text-white-50 mb-1">Pangkat/Golongan</label>
                            <select class="form-select bg-dark text-white border-secondary i-pangkat" required>
                                <option value="-">Non-PNS / P3K</option>
                                <option value="II/a">II/a - Pengatur Muda</option>
                                <option value="II/b">II/b - Pengatur Muda Tk.I</option>
                                <option value="II/c">II/c - Pengatur</option>
                                <option value="II/d">II/d - Pengatur Tk.I</option>
                                <option value="III/a">III/a - Penata Muda</option>
                                <option value="III/b">III/b - Penata Muda Tk.I</option>
                                <option value="III/c">III/c - Penata</option>
                                <option value="III/d">III/d - Penata Tk.I</option>
                                <option value="IV/a">IV/a - Pembina</option>
                                <option value="IV/b">IV/b - Pembina Tk.I</option>
                                <option value="IV/c">IV/c - Pembina Utama Muda</option>
                                <option value="IV/d">IV/d - Pembina Utama Madya</option>
                                <option value="IV/e">IV/e - Pembina Utama</option>
                            </select>
                        </div>
                        
                        <!-- Baris Bawah -->
                        <div class="col-md-4">
                            <label class="small text-white-50 mb-1">Divisi / Seksi</label>
                            <select class="form-select bg-dark text-white border-secondary i-divisi" required>
                                <option value="">-- Memuat Divisi --</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="small text-white-50 mb-1">Jabatan Kepanitiaan</label>
                            <select class="form-select bg-dark text-white border-secondary i-jabatan" required>
                                <option value="">-- Memuat Jabatan --</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="small text-white-50 mb-1">Job Deskripsi (Opsional)</label>
                            <input type="text" class="form-control bg-dark text-white border-secondary i-jobdesk" placeholder="Tugas singkat...">
                        </div>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-between mt-4 pt-3 border-top border-secondary">
                <button type="button" class="btn btn-outline-info" onclick="tambahBaris()"><i class="bi bi-plus-lg me-2"></i>Tambah Anggota Lain</button>
                <button type="submit" id="btnUploadPanitia" class="btn btn-primary fw-bold px-4">
                    <i class="bi bi-cloud-arrow-up-fill me-2"></i> Simpan Seluruh Data
                </button>
            </div>
        </form>
    </div>

    <!-- TABEL DAFTAR PANITIA -->
    <div class="glass-card p-4 mb-4" style="border-left: 4px solid #00f2fe;">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold text-info mb-0"><i class="bi bi-list-columns-reverse me-2"></i> Daftar Anggota Kepanitiaan Tersimpan</h5>
            <button class="btn btn-sm btn-outline-light" onclick="muatTabelPanitia()">
                <i class="bi bi-arrow-clockwise"></i> Segarkan Tabel
            </button>
        </div>
        
        <div class="table-responsive rounded border border-secondary">
            <table class="table table-dark table-hover table-bordered align-middle mb-0">
                <thead class="table-active text-center text-white-50">
                    <tr>
                        <th style="width: 50px;">No</th>
                        <th>ID Panitia</th>
                        <th>Nama & Gelar</th>
                        <th>Divisi</th>
                        <th>Jabatan</th>
                    </tr>
                </thead>
                <tbody id="tbodyPanitia">
                    <tr><td colspan="5" class="text-center text-muted py-4">Memuat data dari database...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    // ⚠️ WAJIB PASTE API URL KAPTEN DI SINI!
    const API_URL = "https://script.google.com/macros/s/AKfycbyXhfdbHD1LhvGR_AKTfHVpVtLOm3DOT4hx7zp9YwdQGeBHdni0JXuMbqBYs5j5X5fx/exec";
    
    let cacheDivisi = [];
    let cacheJabatan = [];

    document.addEventListener('DOMContentLoaded', () => {
        muatDataMaster();
        muatTabelPanitia();
    });

    async function muatDataMaster() {
        try {
            const res = await fetch(API_URL, { 
                method: 'POST', 
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'get_master_kepanitiaan' }) 
            });
            const result = await res.json();
            
            if(result.status === 'success') {
                cacheDivisi = result.data.divisi;
                cacheJabatan = result.data.jabatan;
                
                renderListMaster('listDivisi', cacheDivisi, "Belum ada divisi.");
                renderListMaster('listJabatan', cacheJabatan, "Belum ada jabatan.");
                updateSemuaDropdown();
            } else {
                document.getElementById('listDivisi').innerHTML = `<div class="text-danger small fw-bold"><i class="bi bi-exclamation-triangle"></i> Gagal: ${result.message}</div>`;
                document.getElementById('listJabatan').innerHTML = `<div class="text-danger small fw-bold"><i class="bi bi-exclamation-triangle"></i> Gagal: ${result.message}</div>`;
            }
        } catch(e) { 
            document.getElementById('listDivisi').innerHTML = `<div class="text-danger small fw-bold"><i class="bi bi-wifi-off"></i> Error Koneksi ke API</div>`;
            document.getElementById('listJabatan').innerHTML = `<div class="text-danger small fw-bold"><i class="bi bi-wifi-off"></i> Error Koneksi ke API</div>`;
        }
    }

    function renderListMaster(elementId, dataArray, emptyMsg) {
        let html = '';
        if(dataArray.length === 0) {
            html = `<div class="text-white-50 small">${emptyMsg}</div>`;
        } else {
            dataArray.forEach(item => { html += `<div class="badge bg-secondary me-1 mb-1 p-2">${item}</div>`; });
        }
        document.getElementById(elementId).innerHTML = html;
    }

    async function tambahMaster(tipe) {
        const inputId = tipe === 'Divisi' ? 'inputMasterDivisi' : 'inputMasterJabatan';
        const nilai = document.getElementById(inputId).value.trim();
        
        if(!nilai) return;
        Swal.fire({ title: 'Menyimpan...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

        try {
            const res = await fetch(API_URL, { 
                method: 'POST', 
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'tambah_master_kepanitiaan', tipe: tipe, nama_master: nilai }) 
            });
            const result = await res.json();
            
            if(result.status === 'success') {
                Swal.close();
                document.getElementById(inputId).value = '';
                muatDataMaster(); // Refresh otomatis
            } else { Swal.fire('Gagal', result.message, 'error'); }
        } catch(e) { Swal.fire('Error', 'Gagal terhubung ke server', 'error'); }
    }

    function updateSemuaDropdown() {
        let optDivisi = '<option value="">-- Pilih Divisi --</option>';
        cacheDivisi.forEach(d => optDivisi += `<option value="${d}">${d}</option>`);
        
        let optJabatan = '<option value="">-- Pilih Jabatan --</option>';
        cacheJabatan.forEach(j => optJabatan += `<option value="${j}">${j}</option>`);

        document.querySelectorAll('.i-divisi').forEach(el => el.innerHTML = optDivisi);
        document.querySelectorAll('.i-jabatan').forEach(el => el.innerHTML = optJabatan);
    }

    function tambahBaris() {
        let optDivisi = '<option value="">-- Pilih Divisi --</option>';
        cacheDivisi.forEach(d => optDivisi += `<option value="${d}">${d}</option>`);
        
        let optJabatan = '<option value="">-- Pilih Jabatan --</option>';
        cacheJabatan.forEach(j => optJabatan += `<option value="${j}">${j}</option>`);
        
        // Pilihan Pangkat Lengkap
        const optPangkat = `
            <option value="-">Non-PNS / P3K</option>
            <option value="II/a">II/a - Pengatur Muda</option><option value="II/b">II/b - Pengatur Muda Tk.I</option>
            <option value="II/c">II/c - Pengatur</option><option value="II/d">II/d - Pengatur Tk.I</option>
            <option value="III/a">III/a - Penata Muda</option><option value="III/b">III/b - Penata Muda Tk.I</option>
            <option value="III/c">III/c - Penata</option><option value="III/d">III/d - Penata Tk.I</option>
            <option value="IV/a">IV/a - Pembina</option><option value="IV/b">IV/b - Pembina Tk.I</option>
            <option value="IV/c">IV/c - Pembina Utama Muda</option><option value="IV/d">IV/d - Pembina Utama Madya</option>
            <option value="IV/e">IV/e - Pembina Utama</option>
        `;

        const wadah = document.getElementById('wadah-anggota');
        const barisBaru = document.createElement('div');
        barisBaru.className = 'baris-anggota mb-3';
        barisBaru.innerHTML = `
            <button type="button" class="btn btn-sm btn-danger btn-hapus-kartu" onclick="this.parentElement.remove()" title="Hapus Anggota Ini"><i class="bi bi-x-lg"></i></button>
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="small text-white-50 mb-1">Nama Lengkap & Gelar</label>
                    <input type="text" class="form-control bg-dark text-white border-secondary i-nama" required placeholder="Nama Anggota">
                </div>
                <div class="col-md-4">
                    <label class="small text-white-50 mb-1">NIP (Tulis '-' jika Non-PNS)</label>
                    <input type="text" class="form-control bg-dark text-white border-secondary i-nip" required placeholder="NIP Anggota">
                </div>
                <div class="col-md-4">
                    <label class="small text-white-50 mb-1">Pangkat/Golongan</label>
                    <select class="form-select bg-dark text-white border-secondary i-pangkat" required>${optPangkat}</select>
                </div>
                <div class="col-md-4">
                    <label class="small text-white-50 mb-1">Divisi / Seksi</label>
                    <select class="form-select bg-dark text-white border-secondary i-divisi" required>${optDivisi}</select>
                </div>
                <div class="col-md-4">
                    <label class="small text-white-50 mb-1">Jabatan Kepanitiaan</label>
                    <select class="form-select bg-dark text-white border-secondary i-jabatan" required>${optJabatan}</select>
                </div>
                <div class="col-md-4">
                    <label class="small text-white-50 mb-1">Job Deskripsi (Opsional)</label>
                    <input type="text" class="form-control bg-dark text-white border-secondary i-jobdesk" placeholder="Tugas singkat...">
                </div>
            </div>
        `;
        wadah.appendChild(barisBaru);
    }

    async function uploadPanitiaKolektif(event) {
        event.preventDefault();
        
        const fileInput = document.getElementById('panitia_file').files[0];
        if (fileInput.size > 3 * 1024 * 1024) { Swal.fire('Terlalu Besar!', 'Maksimal 3 MB.', 'warning'); return; }

        let arrayAnggota = [];
        document.querySelectorAll('.baris-anggota').forEach(baris => {
            arrayAnggota.push({
                nama: baris.querySelector('.i-nama').value,
                nip: baris.querySelector('.i-nip').value,
                pangkat: baris.querySelector('.i-pangkat').value,
                divisi: baris.querySelector('.i-divisi').value,
                jabatan: baris.querySelector('.i-jabatan').value,
                jobdesk: baris.querySelector('.i-jobdesk').value || '-'
            });
        });

        const btn = document.getElementById('btnUploadPanitia');
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Menyimpan...';
        btn.disabled = true;

        const reader = new FileReader();
        reader.onload = async function(e) {
            const base64Data = e.target.result.split(',')[1]; 
            const payload = { action: 'upload_sk_panitia_kolektif', anggota: arrayAnggota, fileName: fileInput.name, mimeType: fileInput.type, fileData: base64Data };

            try {
                const res = await fetch(API_URL, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload) 
                });
                const result = await res.json();
                if(result.status === 'success') {
                    Swal.fire('Berhasil!', result.message, 'success');
                    document.getElementById('formPanitia').reset(); document.getElementById('wadah-anggota').innerHTML = ''; tambahBaris(); 
                    muatTabelPanitia(); 
                } else { Swal.fire('Gagal!', result.message, 'error'); }
            } catch(error) { Swal.fire('Error', 'Gagal server.', 'error'); } 
            finally { btn.innerHTML = '<i class="bi bi-cloud-arrow-up-fill me-2"></i> Simpan Seluruh Data'; btn.disabled = false; }
        };
        reader.readAsDataURL(fileInput);
    }

    async function muatTabelPanitia() {
        const tbody = document.getElementById('tbodyPanitia');
        tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-4">Memperbarui data... <div class="spinner-border spinner-border-sm text-info ms-2"></div></td></tr>`;
        
        try {
            const res = await fetch(API_URL, { 
                method: 'POST', 
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'get_all_panitia' }) 
            });
            const result = await res.json();
            
            if(result.status === 'success' && result.data.length > 0) {
                let html = '';
                result.data.forEach((p, index) => {
                    let teksDivisi = p.divisi || p.jabatan || '-'; 
                    html += `
                        <tr>
                            <td class="text-center text-white-50">${index + 1}</td>
                            <td class="text-center"><span class="badge bg-secondary">${p.id_panitia || 'ID'}</span></td>
                            <td class="fw-bold text-light">${p.nama}</td>
                            <td class="text-warning">${teksDivisi}</td>
                            <td class="text-info">${p.jabatan}</td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html;
            } else { tbody.innerHTML = '<tr><td colspan="5" class="text-center text-white-50 py-4">Belum ada data panitia.</td></tr>'; }
        } catch(e) { tbody.innerHTML = '<tr><td colspan="5" class="text-center text-danger py-4">Gagal menarik data dari server.</td></tr>'; }
    }
</script>
</body>
</html>

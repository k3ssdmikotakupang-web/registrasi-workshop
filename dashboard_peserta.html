<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dasbor Peserta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <!-- INI DIA ALAT POP-UP YANG KEMARIN KELUPAAN KAPT! -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        body { background-color: #0f172a; color: #ffffff; font-family: 'Segoe UI', sans-serif; padding-bottom: 70px; }
        .neon-nav { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0, 242, 254, 0.3); }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 15px; box-shadow: 0 8px 32px 0 rgba(0,0,0,0.3); }
        .text-neon { background: linear-gradient(to right, #00f2fe, #4facfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: bold; }
        .menu-box { text-align: center; padding: 15px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; transition: 0.3s; color: white; text-decoration: none; display: block; cursor: pointer; }
        .menu-box:hover { background: rgba(0, 242, 254, 0.1); border-color: #00f2fe; color: white; transform: translateY(-3px); }
        .menu-icon { font-size: 2rem; margin-bottom: 8px; background: linear-gradient(45deg, #00f2fe, #4facfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .swal2-popup.swal-dark { background: #1e293b !important; color: #ffffff !important; border: 1px solid rgba(255,255,255,0.1); border-radius: 15px !important; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark neon-nav sticky-top mb-4">
    <div class="container">
        <span class="navbar-brand text-neon">EMS Peserta</span>
        <button class="btn btn-sm btn-outline-danger" onclick="logout()"><i class="bi bi-box-arrow-right"></i></button>
    </div>
</nav>

<div class="container">
    <div class="glass-card p-4 mb-4 text-center" style="border-top: 4px solid #00f2fe;">
        <img id="avatarImg" src="https://ui-avatars.com/api/?name=Peserta&background=00f2fe&color=0f172a&rounded=true" width="75" class="mb-3 shadow rounded-circle" style="cursor: pointer; border: 2px solid #00f2fe; transition: 0.3s;" title="Klik untuk melihat QR Code" onclick="tampilkanQR()">
        <div class="small text-info mb-2" style="font-size: 0.75rem;"><i class="bi bi-hand-index-thumb"></i> Klik foto untuk buka QR Code</div>
        <h5 class="fw-bold mb-0" id="p_nama">Memuat...</h5>
        <p class="text-white-50 small mb-2" id="p_jabatan">...</p>
        <span class="badge bg-secondary mb-3" id="p_idqr">...</span>
        
        <div class="alert alert-info py-2 small mb-0 text-start" id="p_status">
            <i class="bi bi-info-circle"></i> Status: <strong>Memuat...</strong>
        </div>
    </div>

    <!-- Widget Live Session & Pengumuman Board -->
<div class="row g-3 mb-4">
  <!-- Kotak Sesi Berlangsung -->
  <div class="col-md-6">
    <div class="card glass-card border-info h-100 text-white p-3" style="background: rgba(15, 23, 42, 0.8);">
      <div class="d-flex align-items-center justify-content-between mb-2">
        <h6 class="m-0 text-info fw-bold"><i class="bi bi-broadcast"></i> Sesi Berlangsung</h6>
        <span id="badgeLive" class="badge bg-danger text-uppercase px-2 py-1" style="display:none;">
          <i class="bi bi-circle-fill text-white"></i> LIVE
        </span>
      </div>
      <div id="boxSesiLive">
        <p class="text-white-50 small mb-0">Mengecek agenda saat ini...</p>
      </div>
    </div>
  </div>

  <!-- Kotak Pengumuman Panitia -->
  <div class="col-md-6">
    <div class="card glass-card border-warning h-100 text-white p-3" style="background: rgba(15, 23, 42, 0.8);">
      <div class="d-flex align-items-center mb-2">
        <h6 class="m-0 text-warning fw-bold"><i class="bi bi-megaphone-fill"></i> Pengumuman Panitia</h6>
      </div>
      <div id="boxPengumuman" style="max-height: 120px; overflow-y: auto;">
        <p class="text-white-50 small mb-0">Memuat pengumuman...</p>
      </div>
    </div>
  </div>
</div>

    <h6 class="text-white-50 mb-3">Menu Kegiatan</h6>
    <div class="row g-3">
        <div class="col-6">
            <div class="menu-box" onclick="tampilkanJadwal()">
                <i class="bi bi-calendar-event menu-icon"></i>
                <div class="small fw-bold">Jadwal</div>
            </div>
        </div>
        <div class="col-6">
            <div class="menu-box" onclick="bukaLink('materi')">
                <i class="bi bi-journal-text menu-icon"></i>
                <div class="small fw-bold">Materi</div>
            </div>
        </div>
        <div class="col-6">
            <div class="menu-box" onclick="bukaLink('dokumentasi')">
                <i class="bi bi-images menu-icon"></i>
                <div class="small fw-bold">Dokumentasi</div>
            </div>
        </div>
        <div class="col-6">
            <div class="menu-box" onclick="unduhSertifikat()">
                <i class="bi bi-award menu-icon"></i>
                <div class="small fw-bold">Sertifikat</div>
            </div>
        </div>
    </div>
    
    <!-- Kanvas Gaib -->
    <canvas id="canvasSertifikat" style="display: none;"></canvas>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwLdvXuLpbUvBE666hblNZm4y1HuoogGUl8vdHorb-aT9s6T5X6xHwXAcPaeEvrZ5RS/exec"; 

    // Deklarasi Toast SweetAlert
    const Toast = Swal.mixin({
        customClass: { popup: 'swal-dark' },
        confirmButtonColor: '#00f2fe'
    });

    const userData = JSON.parse(localStorage.getItem('userLogin'));
    if(!userData || userData.role !== 'Peserta') window.location.href = "index.html";

    document.getElementById('p_nama').innerText = userData.nama;
    document.getElementById('p_jabatan').innerText = userData.jabatan;
    document.getElementById('p_idqr').innerText = userData.id_qr;

    const boxStatus = document.getElementById('p_status');
    if(userData.status_hadir === 'Hadir') {
        boxStatus.className = "alert alert-success py-2 small mb-0 text-start";
        boxStatus.innerHTML = `<i class="bi bi-check-circle"></i> Status: <strong>HADIR (ATK Diterima)</strong>`;
    } else {
        boxStatus.className = "alert alert-warning py-2 small mb-0 text-start text-dark";
        boxStatus.innerHTML = `<i class="bi bi-geo-alt"></i> Status: <strong>Belum Check-In</strong><br><small>Tunjukkan QR Anda ke Panitia di lokasi.</small>`;
    }

    // Variabel penyimpan link dari server
    let linkData = { jadwal: '', materi: '', dokumentasi: '' };

    // 1. Fungsi menyedot link pengaturan secara diam-diam saat halaman dibuka
    async function muatLinkBroadcast() {
        try {
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'get_pengaturan' })
            });
            const result = await res.json();
            if(result.status === 'success') {
                linkData = result.data;
            }
        } catch(e) { console.log("Gagal menarik link broadcast"); }
    }
    
    // 3. Fungsi Menyedot Data Pengumuman dan Sesi Live secara Realtime
    async function muatLiveDashboard() {
        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'get_live_dashboard' })
            });
            const result = await response.json();

            if (result.status === 'success') {
                // --- PROSES PENGUMUMAN ---
                const boxPengumuman = document.getElementById('boxPengumuman');
                // Filter pengumuman yang aktif dan sesuai target (Semua atau jabatan peserta)
                const pengumumanAktif = result.pengumuman.filter(p => 
                    p.status.toLowerCase() === 'aktif' && 
                    (p.target.toLowerCase() === 'semua' || p.target.toLowerCase() === userData.jabatan.toLowerCase())
                );

                if (pengumumanAktif.length > 0) {
                    boxPengumuman.innerHTML = '';
                    pengumumanAktif.forEach(p => {
                        boxPengumuman.innerHTML += `
                            <div class="mb-2 pb-2 border-bottom border-secondary">
                                <small class="text-info fw-bold">${p.judul}</small>
                                <p class="small mb-0 text-white-50">${p.isi}</p>
                                <div class="text-end" style="font-size: 0.65rem; color: #94a3b8;">${p.tanggal}</div>
                            </div>
                        `;
                    });
                } else {
                    boxPengumuman.innerHTML = `<p class="text-white-50 small mb-0">Belum ada pengumuman terbaru.</p>`;
                }

                // --- PROSES SESI LIVE ---
                const boxSesi = document.getElementById('boxSesiLive');
                const badgeLive = document.getElementById('badgeLive');
                const sesiLive = result.sesi_live; // Mengambil data sesi yang sedang aktif dari server

                if (sesiLive) {
                    badgeLive.style.display = 'inline-block';
                    boxSesi.innerHTML = `
                        <strong class="text-warning">${sesiLive.kegiatan}</strong><br>
                        <small class="text-white-50"><i class="bi bi-clock"></i> ${sesiLive.waktu_mulai} - ${sesiLive.waktu_selesai}</small><br>
                        <small class="text-info"><i class="bi bi-geo-alt-fill"></i> Lokasi: ${sesiLive.lokasi}</small>
                    `;
                } else {
                    badgeLive.style.display = 'none';
                    boxSesi.innerHTML = `<p class="text-white-50 small mb-0">Tidak ada sesi kegiatan yang sedang berlangsung saat ini.</p>`;
                }
            }
        } catch (e) {
            console.error('ERROR DETAIL:', e);
            document.getElementById('boxPengumuman').innerHTML = `<small class="text-danger">Gagal memuat pengumuman.</small>`;
            document.getElementById('boxSesiLive').innerHTML = `<small class="text-danger">Gagal memuat sesi.</small>`;
        }
    }

    // Jalankan fungsi penyedot saat halaman pertama kali dibuka
    muatLiveDashboard();

    async function unduhSertifikat() {
        // Cek dulu apakah status di HP sudah hadir (supaya tidak buang kuota hit API kalau belum hadir)
        if(userData.status_hadir !== 'Hadir') {
            Swal.fire({ icon: 'warning', title: 'Belum Check-In', text: 'Sertifikat hanya untuk peserta yang sudah hadir di lokasi.', customClass: { popup: 'swal-dark' }, background: '#1e293b', color: '#fff' });
            return;
        }

        Toast.fire({ title: 'Menyiapkan Sertifikat...', text: 'Mohon tunggu...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
        
        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'cek_sertifikat', id_qr: userData.id_qr })
            });
            const result = await response.json();

            if (result.status === 'success') {
                
                const namaPeserta = result.data.nama;
                const jabatanPeserta = result.data.jabatan;

                const canvas = document.getElementById('canvasSertifikat');
                const ctx = canvas.getContext('2d');
                const img = new Image();
                
                // Panggil gambar dari GitHub Kapt
                img.crossOrigin = "anonymous"; 
                img.src = 'template_sertifikat.jpg'; 
                
                img.onload = function() {
                    try {
                        canvas.width = img.width;
                        canvas.height = img.height;
                        
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        
                        ctx.textAlign = 'center';
                        ctx.fillStyle = '#000000'; // Warna teks hitam
                        
                        // Tulis Nama
                        ctx.font = 'bold 80px Arial'; 
                        ctx.fillText(namaPeserta, canvas.width / 2, (canvas.height / 2) + 50); 
                        
                        // Tulis Jabatan
                        ctx.font = 'italic 50px Arial'; 
                        ctx.fillText('sebagai ' + jabatanPeserta, canvas.width / 2, (canvas.height / 2) + 150);
                        
                        const dataUrl = canvas.toDataURL("image/jpeg", 0.9);
                        
                        // Munculkan Pop-up Preview Keren!
                        Swal.fire({
                            title: 'Sertifikat Anda Siap!',
                            imageUrl: dataUrl,
                            imageWidth: '100%',
                            imageAlt: 'Sertifikat Preview',
                            showCancelButton: true,
                            confirmButtonText: '<i class="bi bi-download"></i> Unduh Gambar',
                            cancelButtonText: 'Tutup',
                            customClass: { popup: 'swal-dark' },
                            background: '#1e293b', color: '#fff', confirmButtonColor: '#00f2fe'
                        }).then((res) => {
                            if (res.isConfirmed) {
                                const a = document.createElement('a');
                                a.href = dataUrl;
                                a.download = `Sertifikat_EMS_${namaPeserta.replace(/\s+/g, '_')}.jpg`;
                                document.body.appendChild(a);
                                a.click();
                                document.body.removeChild(a);
                            }
                        });

                    } catch (err) {
                        Swal.fire('Error Kanvas', 'Gagal memproses gambar: ' + err.message, 'error');
                    }
                };
                
                img.onerror = function() {
                    Swal.fire('Gagal Memuat Template', 'File template_sertifikat.jpg tidak ditemukan di server.', 'error');
                };

            } else {
                Swal.fire({ icon: 'error', title: 'Akses Ditolak', text: result.message, customClass: { popup: 'swal-dark' }, background: '#1e293b', color: '#fff' });
            }
        } catch (e) {
            Toast.fire({ icon: 'error', title: 'Error Koneksi', text: 'Gagal terhubung ke server.' });
        }
    }

    function logout() { localStorage.removeItem('userLogin'); window.location.href = "index.html"; }

    async function tampilkanJadwal() {
    // Tampilkan animasi loading
    Toast.fire({ title: 'Memuat Jadwal...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
    
    try {
        const response = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ 
                action: 'get_jadwal_filtered', 
                role: userData.role,        // Mengirim role user
                jabatan: userData.jabatan   // Mengirim jabatan (Guru / Kepala Sekolah)
            })
        });
        const result = await response.json();

        Swal.close(); // Tutup indikator loading

        if (result.status === 'success') {
            const tbody = document.getElementById('bodyTabelJadwal');
            tbody.innerHTML = ''; 

            if(result.data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="text-center text-white-50 py-4">Tidak ada jadwal khusus untuk Anda saat ini.</td></tr>';
            } else {
                result.data.forEach(item => {
                    tbody.innerHTML += `
                        <tr>
                            <td style="min-width: 120px;">
                                <strong class="text-info">${item.tanggal}</strong><br>
                                <small>${item.waktu_mulai} - ${item.waktu_selesai}</small>
                            </td>
                            <td>
                                <strong>${item.kegiatan}</strong> <span class="badge bg-secondary" style="font-size: 0.7rem;">${item.kategori}</span><br>
                                <small class="text-white-50"><i class="bi bi-person-badge"></i> Pemateri: ${item.pemateri || '-'}</small><br>
                                <small class="text-white-50"><i class="bi bi-person-check"></i> Moderator: ${item.moderator || '-'}</small>
                            </td>
                            <td style="min-width: 110px;">
                                <i class="bi bi-geo-alt-fill text-danger"></i> ${item.lokasi}
                            </td>
                        </tr>
                    `;
                });
            }
            
            // Tampilkan pop-up modal jadwal
            new bootstrap.Modal(document.getElementById('modalJadwal')).show();
        } else {
            Swal.fire({ icon: 'error', title: 'Gagal', text: result.message, customClass: { popup: 'swal-dark' }, background: '#1e293b', color: '#fff' });
        }
    } catch (e) {
        Toast.fire({ icon: 'error', title: 'Error', text: 'Gagal menghubungkan ke server spreadsheet.' });
    }
}

    function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }
// Otomatis ubah foto inisial sesuai nama peserta saat halaman dimuat
    document.addEventListener("DOMContentLoaded", () => {
        if (userData && userData.nama) {
            const avatarImg = document.getElementById('avatarImg');
            if (avatarImg) {
                avatarImg.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(userData.nama)}&background=00f2fe&color=0f172a&rounded=true&bold=true&size=150`;
            }
        }
    });

    // Fungsi Pop-Up QR Code Berkualitas Tinggi
    function tampilkanQR() {
        if (!userData || !userData.id_qr) {
            Swal.fire({
                icon: 'warning',
                title: 'Data Tidak Ditemukan',
                text: 'ID QR peserta tidak valid.',
                customClass: { popup: 'swal-dark' }, background: '#1e293b', color: '#fff'
            });
            return;
        }

        // Menggunakan API QR Server dengan ukuran resolusi tinggi (400x400) agar tajam saat di-scan
        const qrText = userData.id_qr;
        const qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=${encodeURIComponent(qrText)}`;

        Swal.fire({
            title: '<span class="text-neon"><i class="bi bi-qr-code-scan"></i> QR Code Peserta</span>',
            html: `
                <div class="text-center">
                    <p class="text-white-50 small mb-3">Tunjukkan QR Code ini kepada panitia untuk proses <em>check-in</em> atau absensi kegiatan.</p>
                    <div class="bg-white p-3 rounded-4 d-inline-block shadow-lg mb-3" style="border: 3px solid #00f2fe;">
                        <img src="${qrImageUrl}" alt="QR Code Absensi" width="230" height="230" class="img-fluid rounded">
                    </div>
                    <div class="fw-bold text-info fs-5 mb-1">${userData.id_qr}</div>
                    <div class="text-white fw-bold">${userData.nama}</div>
                    <small class="text-white-50">${userData.jabatan || '-'}</small>
                </div>
            `,
            showConfirmButton: true,
            confirmButtonText: 'Tutup',
            customClass: { popup: 'swal-dark' },
            background: '#1e293b', 
            color: '#fff', 
            confirmButtonColor: '#00f2fe'
        });
    }
    
    
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Modal Tampilan Jadwal Peserta -->
<div class="modal fade" id="modalJadwal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
    <div class="modal-content glass-card text-white" style="background: #0f172a; border: 1px solid #38bdf8;">
      <div class="modal-header border-bottom border-info">
        <h5 class="modal-title text-neon"><i class="bi bi-calendar-event"></i> Jadwal Kegiatan Anda</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-0">
        <div class="table-responsive">
            <table class="table table-dark table-striped table-hover mb-0 text-white" style="font-size: 0.85rem;">
                <thead class="table-info text-dark">
                    <tr>
                        <th>Waktu</th>
                        <th>Kegiatan & Pemateri</th>
                        <th>Lokasi</th>
                    </tr>
                </thead>
                <tbody id="bodyTabelJadwal">
                    <!-- Data jadwal akan muncul otomatis di sini -->
                </tbody>
            </table>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>

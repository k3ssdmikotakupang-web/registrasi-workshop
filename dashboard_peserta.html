<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dasbor Peserta - EMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body { background-color: #f8fafc; font-family: 'Poppins', sans-serif; padding-bottom: 50px; }
        .header-maroon { background: linear-gradient(135deg, #7f1d1d, #991b1b); color: #fbbf24; padding: 25px 15px 60px 15px; border-bottom-left-radius: 25px; border-bottom-right-radius: 25px; box-shadow: 0 4px 15px rgba(127, 29, 29, 0.3); text-align: center; margin-bottom: -50px; }
        
        .card-main { background: #fff; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 20px 15px; margin: 0 15px 25px 15px; position: relative; z-index: 10; border-top: 4px solid #fbbf24; }
        
        /* Avatar Profil (Klikable) */
        .avatar-container { text-align: center; cursor: pointer; transition: transform 0.2s; margin-top: -50px; }
        .avatar-container:hover { transform: scale(1.05); }
        .foto-box { width: 110px; height: 110px; background: #fff; border-radius: 50%; border: 4px solid #fbbf24; margin: 0 auto 10px auto; display: flex; align-items: center; justify-content: center; font-size: 3.5rem; color: #94a3b8; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.2); position: relative; z-index: 11; }
        .foto-box img { width: 100%; height: 100%; object-fit: cover; }
        .badge-klik { font-size: 0.65rem; background: #7f1d1d; color: #fff; padding: 4px 12px; border-radius: 20px; letter-spacing: 0.5px; box-shadow: 0 2px 5px rgba(127, 29, 29, 0.3); }

        /* Menu Grid */
        .menu-grid { padding: 0 15px; }
        .menu-btn { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px 10px; text-align: center; color: #0f172a; text-decoration: none; display: block; box-shadow: 0 4px 6px rgba(0,0,0,0.02); transition: 0.2s; }
        .menu-btn:hover { background: #f8fafc; border-color: #cbd5e1; }
        .menu-icon { font-size: 2.2rem; color: #7f1d1d; margin-bottom: 8px; }
        .menu-text { font-size: 0.85rem; font-weight: 700; line-height: 1.2; }
    </style>
</head>
<body>

<div class="header-maroon">
    <h5 class="fw-bold mb-0 text-uppercase">K3S SD/MI KOTA KUPANG</h5>
    <p class="small text-white-50 mt-1">Dasbor Peserta Workshop 2026</p>
</div>

<div class="container-fluid">
    <div class="card-main text-center">
        <!-- AVATAR MENJADI TOMBOL MENUJU ID CARD -->
        <div class="avatar-container" onclick="window.location.href='id_card_peserta.html'">
            <div class="foto-box" id="previewArea"><i class="bi bi-person-fill"></i></div>
            <span class="badge-klik mb-2 d-inline-block"><i class="bi bi-upc-scan me-1"></i> LIHAT ID CARD & QR</span>
        </div>
        
        <h5 class="fw-bold text-dark mb-1 mt-2" id="txtNama">Memuat...</h5>
        <span class="badge bg-warning text-dark px-3 py-1 fw-bold" id="txtJabatan">...</span>
    </div>

    <!-- MENU OPERASIONAL PESERTA -->
    <div class="menu-grid">
        <h6 class="fw-bold text-dark mb-3 px-2">Menu Layanan</h6>
        <div class="row g-3">
            <div class="col-6">
                <a href="#" class="menu-btn" onclick="bukaJadwalMateri()">
                    <div class="menu-icon"><i class="bi bi-calendar-event"></i></div>
                    <div class="menu-text">Jadwal &<br>Materi</div>
                </a>
            </div>
            <div class="col-6">
                <a href="#" class="menu-btn" onclick="cekStatusSertifikat()">
                    <div class="menu-icon"><i class="bi bi-patch-check"></i></div>
                    <div class="menu-text">Status &<br>Sertifikat</div>
                </a>
            </div>
            <div class="col-12 mt-4">
                <button class="btn btn-outline-danger w-100 py-3 fw-bold" onclick="logout()"><i class="bi bi-box-arrow-right me-2"></i>Keluar Dasbor</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    // WAJIB PASTE API URL KAPTEN DI SINI!
    const API_URL = "https://script.google.com/macros/s/AKfycbwLdvXuLpbUvBE666hblNZm4y1HuoogGUl8vdHorb-aT9s6T5X6xHwXAcPaeEvrZ5RS/exec";
    const userData = JSON.parse(localStorage.getItem('userLogin'));
    
    if(!userData || userData.role !== 'Peserta') window.location.href = "index.html";

    // Set Data Info
    document.getElementById('txtNama').innerText = userData.nama;
    document.getElementById('txtJabatan').innerText = userData.jabatan;

    // Set Foto dari LocalStorage (jika ada)
    if(userData.foto_url) {
        document.getElementById('previewArea').innerHTML = `<img src="${userData.foto_url}" alt="Foto Profil">`;
    }

    // MODUL LIHAT JADWAL & PENGUMUMAN LIVE
    async function bukaJadwalMateri() {
        Swal.fire({ title: 'Memuat Jadwal...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });
        try {
            const res = await fetch(API_URL, {
                method: 'POST', body: JSON.stringify({ action: 'get_dashboard_live', role: 'Peserta', jabatan: userData.jabatan })
            });
            const result = await res.json();
            if(result.status === 'success') {
                let kontenHtml = '<div class="text-start" style="max-height: 400px; overflow-y: auto; font-size: 0.85rem;">';
                if(result.ongoing) {
                    kontenHtml += `<div class="alert alert-success p-2 mb-3"><strong><i class="bi bi-broadcast"></i> Sedang Berlangsung:</strong><br>${result.ongoing.kegiatan} (${result.ongoing.waktu})<br><small>Lokasi: ${result.ongoing.lokasi} | Pemateri: ${result.ongoing.pemateri}</small></div>`;
                }
                if(result.announcements && result.announcements.length > 0) {
                    kontenHtml += '<h6 class="fw-bold text-dark border-bottom pb-1">Pengumuman Terbaru:</h6>';
                    result.announcements.forEach(a => { kontenHtml += `<div class="p-2 mb-2 bg-light rounded border"><span class="fw-bold text-danger">${a.judul}</span><br><span>${a.isi}</span><br><small class="text-muted">Tanggal: ${a.tanggal}</small></div>`; });
                } else {
                    kontenHtml += '<p class="text-muted text-center italic">Belum ada pengumuman aktif saat ini.</p>';
                }
                kontenHtml += '</div>';
                Swal.fire({ title: 'Pusat Informasi & Jadwal', html: kontenHtml, confirmButtonText: 'Tutup', confirmButtonColor: '#7f1d1d' });
            } else { Swal.fire('Gagal', 'Tidak dapat memuat data jadwal.', 'error'); }
        } catch(e) { Swal.fire('Koneksi Error', 'Gagal terhubung ke server.', 'error'); }
    }

    // MODUL CEK STATUS KEHADIRAN & SERTIFIKAT
    async function cekStatusSertifikat() {
        Swal.fire({ title: 'Memeriksa Status...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });
        try {
            const res = await fetch(API_URL, {
                method: 'POST', body: JSON.stringify({ action: 'cek_sertifikat', id_qr: userData.id_qr })
            });
            const result = await res.json();
            if(result.status === 'success') {
                Swal.fire({ icon: 'success', title: 'Check-In Terkonfirmasi!', html: `Halo <b>${result.data.nama}</b>.<br><br>Kehadiran Anda valid. Sertifikat digital Anda siap diunduh!`, confirmButtonText: 'Unduh Sertifikat', confirmButtonColor: '#198754' });
            } else if(result.status === 'warning') {
                Swal.fire({ icon: 'warning', title: 'Belum Check-In', text: result.message, confirmButtonColor: '#ffc107' });
            } else { Swal.fire('Informasi', result.message, 'error'); }
        } catch(e) { Swal.fire('Error', 'Gagal memvalidasi status kehadiran.', 'error'); }
    }

    function logout() { localStorage.removeItem('userLogin'); window.location.href = "index.html"; }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Pajak - EMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
        .header-panel { background: #0f172a; color: #00f2fe; padding: 20px; border-bottom: 5px solid #ffc107; }
    </style>
</head>
<body>
<div class="header-panel mb-4">
    <div class="container d-flex justify-content-between">
        <div><h4 class="fw-bold mb-0">BUKU PEMBANTU PAJAK</h4><p class="mb-0 text-white-50">Transparansi Potongan Pajak BKU</p></div>
        <button class="btn btn-outline-light" onclick="window.location.href='dashboard_bendahara_panitia.html'">Kembali</button>
    </div>
</div>
<div class="container mb-5">
    <div class="card bg-warning text-dark p-4 shadow-sm mb-4 border-0 rounded-4">
        <p class="mb-1 fw-bold">TOTAL PAJAK DIPUNGUT (Siap Setor):</p>
        <h1 class="fw-bold mb-0" id="totalPajak">Rp 0</h1>
    </div>
    <div class="card shadow-sm border-0"><div class="card-body p-0">
        <table class="table table-hover mb-0">
            <thead class="table-light"><tr><th>ID Transaksi</th><th>Waktu</th><th>Penerima Dana</th><th>Jenis Pajak</th><th class="text-end">Nominal Dipotong</th></tr></thead>
            <tbody id="tabelPajak"><tr><td colspan="5" class="text-center py-4">Memuat data...</td></tr></tbody>
        </table>
    </div></div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwLdvXuLpbUvBE666hblNZm4y1HuoogGUl8vdHorb-aT9s6T5X6xHwXAcPaeEvrZ5RS/exec";
    const formatRp = (angka) => new Intl.NumberFormat('id-ID').format(angka);

    async function muatPajak() {
        try {
            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'get_rekap_pajak' }) });
            const result = await res.json();
            if(result.status === 'success') {
                document.getElementById('totalPajak').innerText = 'Rp ' + formatRp(result.total);
                let html = '';
                if(result.data.length === 0) html = '<tr><td colspan="5" class="text-center">Belum ada pungutan pajak.</td></tr>';
                else {
                    result.data.forEach(d => {
                        html += `<tr><td><strong>${d.id_trx}</strong></td><td>${d.tanggal.split(' ')[0]}</td><td>${d.penerima}</td>
                        <td>${d.jenis.split('|')[1] || d.jenis}</td><td class="text-end fw-bold text-danger">Rp ${formatRp(d.nominal)}</td></tr>`;
                    });
                }
                document.getElementById('tabelPajak').innerHTML = html;
            }
        } catch(e) { document.getElementById('tabelPajak').innerHTML = '<tr><td colspan="5" class="text-danger text-center">Error koneksi.</td></tr>'; }
    }
    muatPajak();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Data Peserta EMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        body { background-color: #0f172a; color: #ffffff; font-family: 'Segoe UI', sans-serif; padding-bottom: 50px; }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 15px; box-shadow: 0 8px 32px 0 rgba(0,0,0,0.3); }
        .text-neon { background: linear-gradient(to right, #00f2fe, #4facfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: bold; }
        .btn-neon { background: linear-gradient(45deg, #00f2fe, #4facfe); border: none; color: white; border-radius: 8px; font-weight: 600; }
        .form-control, .form-select { background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.2); color: white; }
        .form-control:focus, .form-select:focus { background: rgba(0, 0, 0, 0.4); border-color: #00f2fe; color: white; box-shadow: 0 0 10px rgba(0, 242, 254, 0.3); }
        .swal2-popup.swal-dark { background: #1e293b !important; color: #ffffff !important; border: 1px solid rgba(255,255,255,0.1); border-radius: 15px !important; }
    </style>
</head>
<body>

<div class="container mt-4">
    <button class="btn btn-outline-secondary mb-3" onclick="window.location.href='dashboard.html'"><i class="bi bi-arrow-left"></i> Kembali ke Dasbor</button>
    
    <div class="glass-card p-4 mx-auto" style="max-width: 600px;">
        <h4 class="text-neon text-center mb-1">DATA PESERTA WORKSHOP</h4>
        <p class="text-center text-white-50 small mb-4">SD/MI: <span id="namaSekolahLabel" class="fw-bold text-info">Memuat...</span></p>

        <form id="formPeserta">
            <!-- PESERTA 1 -->
            <div class="p-3 mb-4 rounded" style="background: rgba(0,0,0,0.2); border-left: 3px solid #00f2fe;">
                <h6 class="text-info"><i class="bi bi-person-badge"></i> Peserta 1 (Unsur Pimpinan)</h6>
                <div class="mb-2">
                    <label class="form-label small">Nama Lengkap & Gelar</label>
                    <input type="text" id="nama1" class="form-control form-control-sm" required>
                </div>
                <div class="mb-2">
                    <label class="form-label small">Jabatan</label>
                    <select id="jabatan1" class="form-select form-select-sm" onchange="cekJabatan()" required>
                        <option value="Kepala Sekolah">Kepala Sekolah</option>
                        <option value="Guru (Mewakili Kepsek)">Guru (Mewakili Kepsek)</option>
                    </select>
                </div>
                
                <!-- Surat Tugas (Muncul jika wakil) -->
                <div class="mb-2" id="boxSuratTugas" style="display: none;">
                    <label class="form-label small text-warning">Upload Surat Tugas Kepsek (PDF/JPG, Max 2MB)</label>
                    <input type="file" id="fileSurat" class="form-control form-control-sm" accept=".pdf, .jpg, .jpeg, .png">
                </div>
            </div>

            <!-- PESERTA 2 -->
            <div class="p-3 mb-4 rounded" style="background: rgba(0,0,0,0.2); border-left: 3px solid #f093fb;">
                <h6 style="color: #f093fb;"><i class="bi bi-person"></i> Peserta 2 (Unsur Guru)</h6>
                <div class="mb-2">
                    <label class="form-label small">Nama Lengkap & Gelar</label>
                    <input type="text" id="nama2" class="form-control form-control-sm" required>
                </div>
                <div class="mb-2">
                    <label class="form-label small">Jabatan</label>
                    <input type="text" id="jabatan2" class="form-control form-control-sm" value="Guru" readonly>
                </div>
            </div>

            <button type="button" id="btnSimpan" class="btn btn-neon w-100 py-2" onclick="prosesSimpan()">Simpan & Generate QR Code</button>
        </form>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwLdvXuLpbUvBE666hblNZm4y1HuoogGUl8vdHorb-aT9s6T5X6xHwXAcPaeEvrZ5RS/exec";
    const userData = JSON.parse(localStorage.getItem('userLogin'));
    if(!userData) window.location.href = "index.html";
    
    document.getElementById('namaSekolahLabel').innerText = userData.nama_pic;
    const Toast = Swal.mixin({ customClass: { popup: 'swal-dark' }, confirmButtonColor: '#00f2fe' });

    // Fungsi menampilkan form Surat Tugas jika memilih Guru (Mewakili Kepsek)
    function cekJabatan() {
        const jab = document.getElementById('jabatan1').value;
        const box = document.getElementById('boxSuratTugas');
        if(jab === 'Guru (Mewakili Kepsek)') {
            box.style.display = 'block';
        } else {
            box.style.display = 'none';
            document.getElementById('fileSurat').value = '';
        }
    }

    // Fungsi konversi file ke Base64 (Promise)
    function getBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = error => reject(error);
        });
    }

    async function prosesSimpan() {
        const nama1 = document.getElementById('nama1').value;
        const jabatan1 = document.getElementById('jabatan1').value;
        const nama2 = document.getElementById('nama2').value;
        const jabatan2 = document.getElementById('jabatan2').value;
        const fileInput = document.getElementById('fileSurat');

        if(!nama1 || !nama2) {
            Toast.fire({ icon: 'warning', title: 'Data belum lengkap!' });
            return;
        }

        let base64Data1 = null;
        let mimeType1 = null;
        let fileName1 = null;

        // Cek jika Surat Tugas wajib diisi
        if(jabatan1 === 'Guru (Mewakili Kepsek)') {
            if(fileInput.files.length === 0) {
                Toast.fire({ icon: 'warning', title: 'Surat Tugas wajib diupload!' });
                return;
            }
            if(fileInput.files[0].size > 2 * 1024 * 1024) {
                Toast.fire({ icon: 'warning', title: 'Ukuran file maksimal 2MB!' });
                return;
            }
            // Konversi file
            base64Data1 = await getBase64(fileInput.files[0]);
            mimeType1 = fileInput.files[0].type;
            fileName1 = `ST_${userData.username}_${fileInput.files[0].name}`;
        }

        const btnSimpan = document.getElementById('btnSimpan');
        btnSimpan.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Memproses Data & File...';
        btnSimpan.disabled = true;

        // Susun payload
        const payload = {
            action: 'simpan_peserta',
            npsn: userData.username,
            peserta: [
                { nama: nama1, jabatan: jabatan1, base64Data: base64Data1, mimeType: mimeType1, fileName: fileName1 },
                { nama: nama2, jabatan: jabatan2, base64Data: null, mimeType: null, fileName: null }
            ]
        };

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });
            const result = await response.json();

            if(result.status === 'success') {
                Swal.fire({
                    icon: 'success', title: 'Berhasil!', text: 'Data peserta telah tersimpan.',
                    customClass: { popup: 'swal-dark' }, background: '#1e293b', color: '#fff', confirmButtonColor: '#00f2fe'
                }).then(() => {
                    window.location.href = 'dashboard.html';
                });
            } else {
                Toast.fire({ icon: 'error', title: 'Gagal', text: result.message });
            }
        } catch (error) {
            Toast.fire({ icon: 'error', title: 'Error Koneksi', text: 'Server tidak merespons.' });
        } finally {
            btnSimpan.innerHTML = 'Simpan & Generate QR Code';
            btnSimpan.disabled = false;
        }
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

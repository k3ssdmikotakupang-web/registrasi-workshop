<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Bendahara Subrayon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        body { background-color: #0f172a; color: #ffffff; font-family: 'Segoe UI', sans-serif; padding-bottom: 50px; }
        .neon-nav { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0, 242, 254, 0.3); }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 15px; box-shadow: 0 8px 32px 0 rgba(0,0,0,0.3); }
        .text-neon { background: linear-gradient(to right, #00f2fe, #4facfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: bold; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark neon-nav sticky-top mb-4">
    <div class="container">
        <span class="navbar-brand text-neon">EMS Bendahara</span>
        <button class="btn btn-sm btn-outline-danger" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</button>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="fw-bold mb-0 text-info" id="namaPic">Memuat...</h4>
            <p class="text-white-50 small mb-0">Bendahara Wilayah: <strong class="text-white" id="namaRayon"></strong></p>
        </div>
    </div>

    <div class="glass-card p-4 mb-4 border-start border-4 border-info">
        <h5 class="fw-bold mb-3">Tugas Utama Subrayon</h5>
        
        <!-- Tombol Menuju Halaman Validasi Hibrida -->
        <button onclick="window.location.href='validasi_pembayaran.html'" class="btn btn-info w-100 py-3 fw-bold text-dark mb-3">
            <i class="bi bi-wallet2 me-2"></i> Validasi Pembayaran & Terima Tunai
        </button>
        
        <!-- Tombol Menuju Halaman Rekap Pendaftaran -->
        <button onclick="window.location.href='rekap_sekolah.html'" class="btn btn-outline-light w-100 py-3 text-start">
            <i class="bi bi-building me-2"></i> Pantau Rekap Pendaftaran Wilayah
        </button>
    </div>
</div>

<script>
    const userData = JSON.parse(localStorage.getItem('userLogin'));
    
    // Pastikan hanya Bendahara Subrayon yang bisa masuk
    if(!userData || userData.role !== 'Bendahara_Subrayon') window.location.href = "index.html";
    
    document.getElementById('namaPic').innerText = userData.nama_pic || 'Bendahara';
    document.getElementById('namaRayon').innerText = userData.subrayon || '-';
    
    function logout() { 
        localStorage.removeItem('userLogin'); 
        window.location.href = "index.html"; 
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validasi Pembayaran</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
        .header-panel { background: #0f172a; color: #00f2fe; padding: 20px; border-bottom: 5px solid #ffc107; }
        .table-custom th { background-color: #e9ecef; font-size: 14px; }
        .table-custom td { font-size: 14px; vertical-align: middle; }
    </style>
</head>
<body>

<div class="header-panel mb-4">
    <div class="container d-flex justify-content-between align-items-center">
        <div>
            <h4 class="fw-bold mb-0">VALIDASI & PENERIMAAN</h4>
            <p class="mb-0 text-white-50">Transfer Bukti & Pembayaran Tunai</p>
        </div>
        <button class="btn btn-outline-light" onclick="kembali()"><i class="bi bi-arrow-left"></i> Kembali</button>
    </div>
</div>

<div class="container mb-5">
    <div class="card shadow-sm border-0">
        <div class="card-body p-0 overflow-auto">
            <table class="table table-hover table-custom mb-0">
                <thead>
                    <tr>
                        <th width="15%">ID Transaksi</th>
                        <th width="25%">Nama Sekolah</th>
                        <th width="15%">Subrayon</th>
                        <th width="15%">Nominal & Metode</th>
                        <th width="15%" class="text-center">Status</th>
                        <th width="15%" class="text-center">Aksi Operasional</th>
                    </tr>
                </thead>
                <tbody id="tabelValidasi">
                    <tr><td colspan="6" class="text-center py-4">Memuat antrian pembayaran...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // BENSIN SUDAH DIISI PENUH KAPT!
    const API_URL = "https://script.google.com/macros/s/AKfycbwLdvXuLpbUvBE666hblNZm4y1HuoogGUl8vdHorb-aT9s6T5X6xHwXAcPaeEvrZ5RS/exec";
    
    const userData = JSON.parse(localStorage.getItem('userLogin'));
    const formatRp = (angka) => new Intl.NumberFormat('id-ID').format(angka);

    function kembali() {
        if(userData.role === 'Bendahara_Panitia') window.location.href = 'dashboard_bendahara_panitia.html';
        else window.location.href = 'dashboard_subrayon.html';
    }

    async function muatAntrian() {
        try {
            const res = await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'get_antrian_validasi', role: userData.role, subrayon: userData.subrayon })
            });
            const result = await res.json();
            
            if(result.status === 'success') {
                let html = '';
                if(result.data.length === 0) html = '<tr><td colspan="6" class="text-center text-muted py-4">Belum ada transaksi pendaftaran.</td></tr>';
                else {
                    result.data.forEach(d => {
                        let btnAksi = '';
                        let badgeStatus = '';

                        if(d.status === 'Pending' || d.status === 'Belum Mendaftar') {
                            badgeStatus = '<span class="badge bg-warning text-dark">Menunggu Validasi</span>';
                            if(d.link_bukti && d.link_bukti !== '-') {
                                btnAksi = `
                                    <a href="${d.link_bukti}" target="_blank" class="btn btn-sm btn-outline-info w-100 mb-1"><i class="bi bi-eye"></i> Cek Bukti Transfer</a>
                                    <button class="btn btn-sm btn-success fw-bold w-100" onclick="prosesValidasi('${d.id_trx}', 'Transfer')"><i class="bi bi-check2-all"></i> Validasi Sah</button>
                                `;
                            } else {
                                btnAksi = `
                                    <button class="btn btn-sm btn-primary fw-bold w-100" onclick="prosesValidasi('${d.id_trx}', 'Tunai')"><i class="bi bi-cash"></i> Terima Tunai (Sah)</button>
                                `;
                            }
                        } else if (d.status === 'Lunas') {
                            badgeStatus = '<span class="badge bg-success">Lunas</span>';
                            // JALUR KWITANSI SUDAH DILURUSKAN KE PARAMETER ?kw=
                            btnAksi = `<button class="btn btn-sm btn-dark w-100" onclick="window.open('verify.html?kw=${d.id_trx}', '_blank')"><i class="bi bi-printer"></i> Cetak Kwitansi</button>`;
                        }

                        html += `
                            <tr>
                                <td><strong>${d.id_trx}</strong><br><small class="text-muted">${d.tanggal.split(' ')[0]}</small></td>
                                <td class="fw-bold">${d.nama}<br><small class="text-muted">NPSN: ${d.npsn}</small></td>
                                <td>${d.subrayon}</td>
                                <td><span class="text-success fw-bold">Rp ${formatRp(d.nominal)}</span><br><small>${d.metode || 'Belum Bayar'}</small></td>
                                <td class="text-center">${badgeStatus}</td>
                                <td class="text-center">${btnAksi}</td>
                            </tr>
                        `;
                    });
                }
                document.getElementById('tabelValidasi').innerHTML = html;
            }
        } catch(e) { document.getElementById('tabelValidasi').innerHTML = '<tr><td colspan="6" class="text-center text-danger">Gagal terhubung ke server.</td></tr>'; }
    }

    function prosesValidasi(idTrx, metode) {
        Swal.fire({
            title: `Konfirmasi ${metode}?`,
            text: `Anda yakin ingin mengesahkan pembayaran ini sebagai LUNAS via ${metode}?`,
            icon: 'warning', showCancelButton: true, confirmButtonText: 'Ya, Sahkan!', confirmButtonColor: '#198754'
        }).then(async (resConf) => {
            if(resConf.isConfirmed) {
                Swal.fire({title: 'Memproses...', allowOutsideClick: false, didOpen: () => {Swal.showLoading()}});
                try {
                    const res = await fetch(API_URL, {
                        method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: 'eksekusi_validasi', id_trx: idTrx, metode: metode, nama_validator: userData.nama_pic })
                    });
                    const result = await res.json();
                    if(result.status === 'success') {
                        Swal.fire('Berhasil!', result.message, 'success').then(() => muatAntrian());
                    } else { Swal.fire('Gagal', result.message, 'error'); }
                } catch(e) { Swal.fire('Error', 'Koneksi gagal', 'error'); }
            }
        });
    }

    muatAntrian();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Sekolah - EMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; color: #333; font-family: 'Segoe UI', sans-serif; }
        .header-panel { background: #0f172a; color: #00f2fe; padding: 20px; border-bottom: 5px solid #4facfe; }
        .table-custom th { background-color: #e9ecef; font-size: 14px; }
        .table-custom td { font-size: 14px; vertical-align: middle; }
        .filter-box { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<div class="header-panel mb-4">
    <div class="container d-flex justify-content-between align-items-center">
        <div>
            <h4 class="fw-bold mb-0">REKAPITULASI PENDAFTARAN SEKOLAH</h4>
            <p class="mb-0 text-white-50">Monitoring Status Pembayaran per Subrayon</p>
        </div>
        <button class="btn btn-outline-light" onclick="window.location.href='dashboard_bendahara_panitia.html'"><i class="bi bi-arrow-left"></i> Kembali</button>
    </div>
</div>

<div class="container mb-5">
    <!-- Kotak Ringkasan -->
    <div class="row g-3 mb-4 text-center">
        <div class="col-md-4">
            <div class="p-3 bg-white rounded shadow-sm border-start border-4 border-primary">
                <p class="text-muted small mb-1">Total Target Sekolah</p>
                <h3 class="fw-bold text-primary mb-0" id="sumTotal">0</h3>
            </div>
        </div>
        <div class="col-md-4">
            <div class="p-3 bg-white rounded shadow-sm border-start border-4 border-success">
                <p class="text-muted small mb-1">Sudah Lunas</p>
                <h3 class="fw-bold text-success mb-0" id="sumLunas">0</h3>
            </div>
        </div>
        <div class="col-md-4">
            <div class="p-3 bg-white rounded shadow-sm border-start border-4 border-danger">
                <p class="text-muted small mb-1">Belum Mendaftar / Nunggak</p>
                <h3 class="fw-bold text-danger mb-0" id="sumBelum">0</h3>
            </div>
        </div>
    </div>

    <!-- Panel Filter Mesin Pencari -->
    <div class="filter-box mb-4">
        <div class="row g-2">
            <div class="col-md-3">
                <label class="small text-muted">Filter Subrayon</label>
                <select class="form-select form-select-sm" id="filRayon" onchange="terapkanFilter()">
                    <option value="Semua">Semua Subrayon</option>
                    <option value="Oebobo 1">Oebobo 1</option>
                    <option value="Oebobo 2">Oebobo 2</option>
                    <option value="Kelapa Lima 1">Kelapa Lima 1</option>
                    <!-- Tambahkan opsi lain sesuai wilayah Kupang -->
                </select>
            </div>
            <div class="col-md-3">
                <label class="small text-muted">Filter Jenjang</label>
                <select class="form-select form-select-sm" id="filJenjang" onchange="terapkanFilter()">
                    <option value="Semua">Semua Jenjang</option>
                    <option value="SD">SD</option>
                    <option value="MI">MI</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="small text-muted">Filter Status Sekolah</label>
                <select class="form-select form-select-sm" id="filStatusSek" onchange="terapkanFilter()">
                    <option value="Semua">Semua Status</option>
                    <option value="Negeri">Negeri</option>
                    <option value="Swasta">Swasta</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="small text-muted">Status Pembayaran</label>
                <select class="form-select form-select-sm" id="filBayar" onchange="terapkanFilter()">
                    <option value="Semua">Semua Status</option>
                    <option value="Lunas">Lunas</option>
                    <option value="Pending">Pending (Proses)</option>
                    <option value="Belum Mendaftar">Belum Mendaftar</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Tabel Data -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-0 overflow-auto">
            <table class="table table-hover table-custom mb-0">
                <thead>
                    <tr>
                        <th width="5%" class="text-center">No</th>
                        <th width="10%">NPSN</th>
                        <th width="30%">Nama Sekolah</th>
                        <th width="15%">Subrayon</th>
                        <th width="8%">Jenjang</th>
                        <th width="10%">Status</th>
                        <th width="15%" class="text-center">Status Bayar</th>
                        <th width="10%" class="text-end">Nominal (Rp)</th>
                    </tr>
                </thead>
                <tbody id="tabelRekap">
                    <tr><td colspan="7" class="text-center py-4">Memuat data sekolah...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwLdvXuLpbUvBE666hblNZm4y1HuoogGUl8vdHorb-aT9s6T5X6xHwXAcPaeEvrZ5RS/exec";
    let dataAsli = []; // Penyimpan data mentah dari server

    const formatRp = (angka) => new Intl.NumberFormat('id-ID').format(angka);

    async function muatRekap() {
        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'get_rekap_sekolah' })
            });
            const result = await response.json();

            if(result.status === 'success') {
                dataAsli = result.data;
                document.getElementById('sumTotal').innerText = result.summary.total;
                document.getElementById('sumLunas').innerText = result.summary.lunas;
                document.getElementById('sumBelum').innerText = result.summary.belum;
                
                terapkanFilter(); // Tampilkan data ke tabel
            }
        } catch (e) {
            document.getElementById('tabelRekap').innerHTML = '<tr><td colspan="7" class="text-danger text-center py-4">Gagal memuat data dari server.</td></tr>';
        }
    }

    function terapkanFilter() {
        const fRayon = document.getElementById('filRayon').value;
        const fJenjang = document.getElementById('filJenjang').value;
        const fStatusSek = document.getElementById('filStatusSek').value;
        const fBayar = document.getElementById('filBayar').value;

        // Proses Penyaringan (Filtering)
        let dataTersaring = dataAsli.filter(sek => {
            let matchRayon = (fRayon === 'Semua') ? true : (sek.subrayon === fRayon);
            let matchJenjang = (fJenjang === 'Semua') ? true : (sek.jenjang === fJenjang);
            let matchStatusSek = (fStatusSek === 'Semua') ? true : (sek.status_sekolah === fStatusSek);
            let matchBayar = (fBayar === 'Semua') ? true : (sek.status_bayar === fBayar);
            return matchRayon && matchJenjang && matchStatusSek && matchBayar;
        });

        // Render ke Tabel HTML
        let htmlTable = '';
        if(dataTersaring.length === 0) {
            htmlTable = '<tr><td colspan="7" class="text-center py-4 text-muted">Tidak ada sekolah yang cocok dengan filter.</td></tr>';
        } else {
            dataTersaring.forEach((sek, index) => {
                let badgeClass = 'bg-secondary';
                if(sek.status_bayar === 'Lunas') badgeClass = 'bg-success';
                else if(sek.status_bayar === 'Pending') badgeClass = 'bg-warning text-dark';
                else if(sek.status_bayar === 'Belum Mendaftar') badgeClass = 'bg-danger';

                htmlTable += `
                    <tr>
                        <td class="text-center">${index + 1}</td>
                        <td class="text-muted">${sek.npsn}</td>
                        <td class="fw-bold">${sek.nama}</td>
                        <td>${sek.subrayon}</td>
                        <td>${sek.jenjang}</td>
                        <td>${sek.status_sekolah}</td>
                        <td class="text-center"><span class="badge ${badgeClass}">${sek.status_bayar}</span></td>
                        <td class="text-end fw-bold ${sek.nominal > 0 ? 'text-success' : 'text-muted'}">${formatRp(sek.nominal)}</td>
                    </tr>
                `;
            });
        }
        document.getElementById('tabelRekap').innerHTML = htmlTable;
    }

    muatRekap();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

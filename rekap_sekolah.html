<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Sekolah - EMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
        .header-panel { background: #0f172a; color: #00f2fe; padding: 20px; border-bottom: 5px solid #4facfe; }
        .table-custom th { background-color: #e9ecef; font-size: 14px; }
        .table-custom td { font-size: 14px; vertical-align: middle; }
    </style>
</head>
<body>
<div class="header-panel mb-4">
    <div class="container d-flex justify-content-between">
        <h4 class="fw-bold mb-0">REKAPITULASI PENDAFTARAN SEKOLAH</h4>
        <button class="btn btn-outline-light" onclick="window.location.href='dashboard_bendahara_panitia.html'">Kembali</button>
    </div>
</div>
<div class="container mb-5">
    <div class="row g-3 mb-4 text-center">
        <div class="col-4"><div class="p-3 bg-white shadow-sm border-start border-4 border-primary"><h3 id="sumTotal">0</h3><small>Target Sekolah</small></div></div>
        <div class="col-4"><div class="p-3 bg-white shadow-sm border-start border-4 border-success"><h3 id="sumLunas">0</h3><small>Lunas</small></div></div>
        <div class="col-4"><div class="p-3 bg-white shadow-sm border-start border-4 border-danger"><h3 id="sumBelum">0</h3><small>Belum Mendaftar</small></div></div>
    </div>

    <!-- Filter Dinamis -->
    <div class="bg-white p-3 rounded shadow-sm mb-4 row g-2">
        <div class="col-md-3"><select class="form-select form-select-sm" id="filRayon" onchange="terapkanFilter()"><option value="Semua">Semua Subrayon</option></select></div>
        <div class="col-md-3"><select class="form-select form-select-sm" id="filJenjang" onchange="terapkanFilter()"><option value="Semua">Semua Jenjang</option></select></div>
        <div class="col-md-3"><select class="form-select form-select-sm" id="filStatusSek" onchange="terapkanFilter()"><option value="Semua">Semua Status Sekolah</option></select></div>
        <div class="col-md-3"><select class="form-select form-select-sm" id="filBayar" onchange="terapkanFilter()">
            <option value="Semua">Semua Pembayaran</option><option value="Lunas">Lunas</option><option value="Pending">Pending</option><option value="Belum Mendaftar">Belum Mendaftar</option>
        </select></div>
    </div>

    <table class="table table-hover table-custom bg-white shadow-sm">
        <thead><tr><th>No</th><th>NPSN</th><th>Nama Sekolah</th><th>Subrayon</th><th>Jenjang</th><th>Status</th><th>Status Bayar</th><th>Nominal</th></tr></thead>
        <tbody id="tabelRekap"><tr><td colspan="8" class="text-center py-4">Memuat data...</td></tr></tbody>
    </table>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwLdvXuLpbUvBE666hblNZm4y1HuoogGUl8vdHorb-aT9s6T5X6xHwXAcPaeEvrZ5RS/exec";
    let dataAsli = [];
    const formatRp = (angka) => new Intl.NumberFormat('id-ID').format(angka);

    async function muatRekap() {
        try {
            const userData = JSON.parse(localStorage.getItem('userLogin')) || {};
const res = await fetch(API_URL, { 
    method: 'POST', 
    body: JSON.stringify({ 
        action: 'get_rekap_sekolah', 
        role: userData.role, 
        subrayon: userData.subrayon 
    }) 
});
            const result = await res.json();
            if(result.status === 'success') {
                dataAsli = result.data;
                document.getElementById('sumTotal').innerText = result.summary.total;
                document.getElementById('sumLunas').innerText = result.summary.lunas;
                document.getElementById('sumBelum').innerText = result.summary.belum;
                
                // Mesin Pencetak Filter Otomatis
                let sRayon = new Set(), sJenjang = new Set(), sStatus = new Set();
                dataAsli.forEach(d => {
                    if(d.subrayon && d.subrayon !== '-') sRayon.add(d.subrayon.trim());
                    if(d.jenjang && d.jenjang !== '-') sJenjang.add(d.jenjang.trim());
                    if(d.status_sekolah && d.status_sekolah !== '-') sStatus.add(d.status_sekolah.trim());
                });
                
                const isiDropdown = (id, set) => { set.forEach(v => document.getElementById(id).innerHTML += `<option value="${v}">${v}</option>`); };
                isiDropdown('filRayon', sRayon); isiDropdown('filJenjang', sJenjang); isiDropdown('filStatusSek', sStatus);
                
                terapkanFilter();
            }
        } catch(e) {}
    }

    function terapkanFilter() {
        const fr = document.getElementById('filRayon').value, fj = document.getElementById('filJenjang').value;
        const fs = document.getElementById('filStatusSek').value, fb = document.getElementById('filBayar').value;

        let filtered = dataAsli.filter(sek => {
            return (fr === 'Semua' || sek.subrayon.trim() === fr) &&
                   (fj === 'Semua' || sek.jenjang.trim() === fj) &&
                   (fs === 'Semua' || sek.status_sekolah.trim() === fs) &&
                   (fb === 'Semua' || sek.status_bayar === fb);
        });

        let html = '';
        filtered.forEach((sek, i) => {
            let bdg = sek.status_bayar === 'Lunas' ? 'bg-success' : sek.status_bayar === 'Pending' ? 'bg-warning text-dark' : 'bg-danger';
            html += `<tr><td>${i+1}</td><td>${sek.npsn}</td><td class="fw-bold">${sek.nama}</td><td>${sek.subrayon}</td><td>${sek.jenjang}</td><td>${sek.status_sekolah}</td><td><span class="badge ${bdg}">${sek.status_bayar}</span></td><td>${formatRp(sek.nominal)}</td></tr>`;
        });
        document.getElementById('tabelRekap').innerHTML = html || '<tr><td colspan="8" class="text-center">Data tidak ditemukan.</td></tr>';
    }
    muatRekap();
</script>
</body>
</html>

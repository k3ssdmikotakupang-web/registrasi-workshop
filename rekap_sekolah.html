<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Pendaftaran Subrayon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #0f172a; color: #fff; font-family: 'Segoe UI', sans-serif; }
        .stat-card { border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .table-dark { background-color: rgba(255, 255, 255, 0.05) !important; backdrop-filter: blur(10px); }
    </style>
</head>
<body>

<div class="container mt-4 mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom border-secondary pb-3">
        <h4 class="fw-bold text-info"><i class="bi bi-bar-chart-fill me-2"></i>Rekapitulasi Wilayah</h4>
        <button class="btn btn-outline-light btn-sm" onclick="kembali()"><i class="bi bi-arrow-left"></i> Kembali</button>
    </div>

    <!-- Filter Section -->
    <div class="row mb-3">
        <div class="col-md-4">
            <label class="form-label text-white-50 small">Filter Subrayon</label>
            <select id="filterSubrayon" class="form-select bg-dark text-white border-secondary" onchange="renderTabel()">
                <option value="Semua">Semua Subrayon</option>
            </select>
        </div>
    </div>

    <!-- Kartu Statistik Induk (Total Keseluruhan) -->
    <div class="row mb-3">
        <div class="col-12">
            <div class="stat-card text-center" style="background: linear-gradient(135deg, #2b5876 0%, #4e4376 100%);">
                <div class="small fw-bold text-uppercase mb-2 text-info">Total Keseluruhan Sekolah</div>
                <div class="fs-3 fw-bold text-white mb-2"><span id="stat-total-sekolah">0</span> Sekolah</div>
                <div class="d-flex justify-content-center gap-4 small">
                    <span>Sudah Lunas: <strong id="stat-total-lunas" class="text-success fs-5">0</strong></span>
                    <span>Belum Bayar: <strong id="stat-total-belum" class="text-warning fs-5">0</strong></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Kartu Statistik Rincian -->
    <div class="row g-3 mb-4 text-center">
        <div class="col-6 col-md-3">
            <div class="stat-card" style="background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);">
                <div class="small fw-bold text-uppercase mb-2 text-info">Sekolah Negeri</div>
                <div class="d-flex justify-content-between small">
                    <span>Lunas: <strong id="stat-n-lunas" class="text-success fs-5">0</strong></span>
                    <span>Belum: <strong id="stat-n-belum" class="text-warning fs-5">0</strong></span>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="stat-card" style="background: linear-gradient(135deg, #0f2027 0%, #203a43 100%);">
                <div class="small fw-bold text-uppercase mb-2 text-info">Sekolah Swasta</div>
                <div class="d-flex justify-content-between small">
                    <span>Lunas: <strong id="stat-s-lunas" class="text-success fs-5">0</strong></span>
                    <span>Belum: <strong id="stat-s-belum" class="text-warning fs-5">0</strong></span>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="stat-card" style="background: linear-gradient(135deg, #134e5e 0%, #71b280 100%);">
                <div class="small fw-bold text-uppercase mb-2 text-warning">Jenjang SD</div>
                <div class="d-flex justify-content-between small">
                    <span>Lunas: <strong id="stat-sd-lunas" class="text-success fs-5">0</strong></span>
                    <span>Belum: <strong id="stat-sd-belum" class="text-warning fs-5">0</strong></span>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="stat-card" style="background: linear-gradient(135deg, #3a1c71 0%, #d76d77 100%);">
                <div class="small fw-bold text-uppercase mb-2 text-warning">Jenjang MI</div>
                <div class="d-flex justify-content-between small">
                    <span>Lunas: <strong id="stat-mi-lunas" class="text-success fs-5">0</strong></span>
                    <span>Belum: <strong id="stat-mi-belum" class="text-warning fs-5">0</strong></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Tabel Data (Ditambah Nomor Urut) -->
    <div class="table-responsive rounded-3 border border-secondary">
        <table class="table table-dark table-hover mb-0 align-middle">
            <thead class="text-info border-bottom border-info">
                <tr>
                    <th class="text-center" width="5%">No</th>
                    <th>NPSN</th>
                    <th>Nama Sekolah</th>
                    <th>Subrayon</th>
                    <th>Jenjang</th>
                    <th>Status</th>
                    <th class="text-center">Status Bayar</th>
                </tr>
            </thead>
            <tbody id="tabelRekap">
                <tr><td colspan="7" class="text-center py-4">Memuat data rekapitulasi...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // WAJIB: Paste Link URL Web App yang baru Kapten buat di dalam tanda kutip ini!
    const API_URL = "https://script.google.com/macros/s/AKfycbwLdvXuLpbUvBE666hblNZm4y1HuoogGUl8vdHorb-aT9s6T5X6xHwXAcPaeEvrZ5RS/exec";
    
    const userData = JSON.parse(localStorage.getItem('userLogin')) || {};
    let dataGlobal = [];

    function kembali() {
        if(userData.role === 'Bendahara_Panitia') window.location.href = 'dashboard_bendahara_panitia.html';
        else window.location.href = 'dashboard_subrayon.html';
    }

    async function muatRekap() {
        try {
            const res = await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'get_rekap_sekolah', role: userData.role, subrayon: userData.subrayon })
            });
            const result = await res.json();
            
            if(result.status === 'success') {
                dataGlobal = result.data;
                
                const selFilter = document.getElementById('filterSubrayon');
                if(userData.role === 'Bendahara_Subrayon') {
                    selFilter.innerHTML = `<option value="${userData.subrayon}">${userData.subrayon} (Wilayah Wewenang Anda)</option>`;
                    selFilter.disabled = true;
                } else {
                    let unik = [...new Set(dataGlobal.map(d => d.subrayon))].filter(s => s !== '-');
                    unik.forEach(s => { selFilter.innerHTML += `<option value="${s}">${s}</option>`; });
                }
                
                renderTabel();
            }
        } catch(e) { document.getElementById('tabelRekap').innerHTML = '<tr><td colspan="7" class="text-center text-danger">Gagal terhubung ke server.</td></tr>'; }
    }

    function renderTabel() {
        let selectedSub = document.getElementById('filterSubrayon').value;
        let filtered = dataGlobal;
        
        if(userData.role === 'Bendahara_Subrayon') {
            let subAkurat = userData.subrayon.toLowerCase().replace(/\s+/g, '');
            filtered = dataGlobal.filter(d => {
                let subSekDB = (d.subrayon || '').toLowerCase().replace(/\s+/g, '');
                return subSekDB === subAkurat || subSekDB.includes(subAkurat) || subAkurat.includes(subSekDB);
            });
        } else if (selectedSub !== 'Semua') {
            filtered = dataGlobal.filter(d => d.subrayon === selectedSub);
        }
        
        let html = '';
        let sNegeriL=0, sNegeriB=0, sSwastaL=0, sSwastaB=0;
        let sSDL=0, sSDB=0, sMIL=0, sMIB=0;
        let totalLunas = 0, totalBelum = 0;

        if(filtered.length === 0) {
            html = '<tr><td colspan="7" class="text-center text-muted">Belum ada data pendaftaran di wilayah ini. Pastikan kolom Subrayon di DB_Sekolah sudah terisi.</td></tr>';
        } else {
            let no = 1;
            filtered.forEach(d => {
                let badge = d.status_bayar === 'Lunas' ? '<span class="badge bg-success">Lunas</span>' : '<span class="badge bg-danger">Belum Bayar</span>';
                
                let isLunas = d.status_bayar === 'Lunas';
                let st = (d.status_sekolah || '').toLowerCase();
                let jen = (d.jenjang || '').toLowerCase();

                // Hitungan Akurat
                if(isLunas) totalLunas++; else totalBelum++;

                if(st.includes('negeri')) { isLunas ? sNegeriL++ : sNegeriB++; } 
                else if (st.includes('swasta')) { isLunas ? sSwastaL++ : sSwastaB++; }
                
                if(jen.includes('sd')) { isLunas ? sSDL++ : sSDB++; } 
                else if (jen.includes('mi')) { isLunas ? sMIL++ : sMIB++; }

                html += `
                    <tr>
                        <td class="text-center">${no++}</td>
                        <td class="text-white-50">${d.npsn}</td>
                        <td class="fw-bold">${d.nama}</td>
                        <td>${d.subrayon}</td>
                        <td>${d.jenjang}</td>
                        <td>${d.status_sekolah}</td>
                        <td class="text-center">${badge}</td>
                    </tr>
                `;
            });
        }
        
        document.getElementById('tabelRekap').innerHTML = html;
        
        // Update Kartu Total
        document.getElementById('stat-total-sekolah').innerText = filtered.length;
        document.getElementById('stat-total-lunas').innerText = totalLunas;
        document.getElementById('stat-total-belum').innerText = totalBelum;

        // Update Kartu Rincian
        document.getElementById('stat-n-lunas').innerText = sNegeriL;
        document.getElementById('stat-n-belum').innerText = sNegeriB;
        document.getElementById('stat-s-lunas').innerText = sSwastaL;
        document.getElementById('stat-s-belum').innerText = sSwastaB;
        document.getElementById('stat-sd-lunas').innerText = sSDL;
        document.getElementById('stat-sd-belum').innerText = sSDB;
        document.getElementById('stat-mi-lunas').innerText = sMIL;
        document.getElementById('stat-mi-belum').innerText = sMIB;
    }

    muatRekap();
</script>
</body>
</html>

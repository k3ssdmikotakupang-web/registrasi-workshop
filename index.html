<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMS Workshop K3S 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Library QR Code Scanner -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    
    <style>
        body {
            background-color: #0f172a; 
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .text-neon {
            background: linear-gradient(to right, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 0px 15px rgba(0, 242, 254, 0.3);
            font-weight: bold;
        }
        .form-control {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 10px;
        }
        .form-control:focus {
            background: rgba(0, 0, 0, 0.4);
            border-color: #00f2fe;
            color: white;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
        }
        .btn-neon {
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            border: none;
            color: white;
            font-weight: 600;
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        .btn-neon:hover {
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.6);
            transform: translateY(-2px);
            color: white;
        }
        .btn-outline-neon {
            background: transparent;
            border: 2px solid #f093fb;
            color: #f093fb;
            font-weight: 600;
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        .btn-outline-neon:hover {
            background: rgba(240, 147, 251, 0.1);
            box-shadow: 0 0 20px rgba(240, 147, 251, 0.5);
            color: #f093fb;
        }
        /* Custom QR Scanner Canvas */
        #qr-reader {
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        #qr-reader video {
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            
            <div class="card glass-card p-4">
                <div class="text-center mb-4">
                    <h2 class="text-neon mb-1">EMS WORKSHOP</h2>
                    <p class="text-white-50 small">K3S SD/MI Kota Kupang 2026</p>
                </div>

                <!-- SECTION LOGIN -->
                <div id="loginSection">
                    <form id="formLogin">
                        <div class="mb-3">
                            <label class="form-label text-white-50 small">Username / NPSN</label>
                            <input type="text" class="form-control" placeholder="Masukkan NPSN" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-white-50 small">Password / PIN</label>
                            <input type="password" class="form-control" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn btn-neon w-100 py-2 mb-3">Login System</button>
                    </form>

                    <div class="text-center mb-3 text-white-50">ATAU</div>

                    <!-- Wadah Kamera QR Scanner -->
                    <div id="qr-reader" style="display: none; width: 100%;"></div>
                    
                    <button class="btn btn-outline-neon w-100 py-2 mb-2" id="btnScanQR" onclick="startQRScanner()">
                        <i class="bi bi-qr-code-scan me-2"></i> Login via QR Code
                    </button>
                    <button class="btn btn-danger w-100 py-2 mb-4" id="btnStopQR" style="display: none;" onclick="stopQRScanner()">
                        Tutup Kamera
                    </button>

                    <div class="text-center mt-2">
                        <span class="text-white-50 small">Sekolah belum terdaftar?</span>
                        <a href="#" class="text-neon text-decoration-none small" onclick="toggleView('register')">Daftar di sini</a>
                    </div>
                </div>

                <!-- SECTION PENDAFTARAN -->
                <div id="registerSection" style="display: none;">
                    <form id="formRegister">
                        <div class="mb-3">
                            <label class="form-label text-white-50 small">NPSN Sekolah</label>
                            <div class="input-group">
                                <input type="number" id="inputNPSN" class="form-control" placeholder="Ketik NPSN" required>
                                <button type="button" class="btn btn-neon" onclick="cekNpsnKeDatabase()" id="btnCekNPSN">Cek Data</button>
                            </div>
                            <div id="statusCek" class="form-text text-warning mt-2 small"></div>
                        </div>

                        <div id="formLanjutan" style="display: none;">
                            <div class="mb-3">
                                <label class="form-label text-white-50 small">Nama Sekolah</label>
                                <input type="text" id="namaSekolah" class="form-control" readonly>
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-white-50 small">Subrayon</label>
                                <input type="text" id="namaSubrayon" class="form-control" readonly>
                            </div>
                            <div class="mb-4">
                                <label class="form-label text-white-50 small">Buat Password Admin Sekolah</label>
                                <input type="password" id="passAdmin" class="form-control" placeholder="Minimal 6 karakter" required>
                            </div>
                            <button type="button" class="btn btn-neon w-100 py-2 mb-3">Simpan Pendaftaran</button>
                        </div>
                    </form>

                    <div class="text-center mt-3">
                        <a href="#" class="text-white-50 text-decoration-none small" onclick="toggleView('login')">
                            <i class="bi bi-arrow-left"></i> Kembali ke Login
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwLdvXuLpbUvBE666hblNZm4y1HuoogGUl8vdHorb-aT9s6T5X6xHwXAcPaeEvrZ5RS/exec"; 
    let html5QrcodeScanner = null;

    function toggleView(view) {
        if(view === 'register') {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('registerSection').style.display = 'block';
            stopQRScanner(); // Matikan kamera jika pindah ke register
        } else {
            document.getElementById('registerSection').style.display = 'none';
            document.getElementById('loginSection').style.display = 'block';
        }
    }

    // --- FUNGSI MENCARI NPSN ---
    async function cekNpsnKeDatabase() {
        const npsn = document.getElementById('inputNPSN').value;
        const btnCek = document.getElementById('btnCekNPSN');
        const statusText = document.getElementById('statusCek');
        const formLanjutan = document.getElementById('formLanjutan');

        if(!npsn) {
            statusText.innerText = "NPSN tidak boleh kosong!";
            statusText.className = "form-text text-danger mt-2 small";
            return;
        }

        btnCek.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';
        statusText.innerText = "Mencari data ke database...";
        statusText.className = "form-text text-info mt-2 small";
        formLanjutan.style.display = 'none';

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // Penting untuk mencegah blokir CORS Google
                body: JSON.stringify({ action: 'cek_npsn', npsn: npsn })
            });

            const result = await response.json();

            if(result.status === 'success') {
                statusText.innerText = "Data ditemukan!";
                statusText.className = "form-text text-success mt-2 small";
                document.getElementById('namaSekolah').value = result.data.nama_sekolah;
                document.getElementById('namaSubrayon').value = result.data.subrayon;
                formLanjutan.style.display = 'block';
            } else {
                statusText.innerText = result.message; 
                statusText.className = "form-text text-danger mt-2 small";
            }
        } catch (error) {
            statusText.innerText = "Terjadi kesalahan. Pastikan URL API sudah benar.";
            statusText.className = "form-text text-danger mt-2 small";
            console.error(error);
        } finally {
            btnCek.innerHTML = 'Cek Data';
        }
    }

    // --- FUNGSI QR CODE SCANNER ---
    function startQRScanner() {
        document.getElementById('qr-reader').style.display = 'block';
        document.getElementById('btnScanQR').style.display = 'none';
        document.getElementById('btnStopQR').style.display = 'block';

        html5QrcodeScanner = new Html5Qrcode("qr-reader");
        html5QrcodeScanner.start(
            { facingMode: "environment" }, // Prioritas kamera belakang (HP)
            { fps: 10, qrbox: { width: 250, height: 250 } },
            (decodedText, decodedResult) => {
                // Eksekusi jika QR berhasil terbaca
                stopQRScanner();
                alert("QR Berhasil dipindai!\nData: " + decodedText);
                // Nanti kita tambahkan logika login otomatis di sini
            },
            (errorMessage) => {
                // Abaikan error background saat mencari QR
            }
        ).catch(err => {
            alert("Gagal mengakses kamera. Pastikan browser diizinkan menggunakan kamera.");
            stopQRScanner();
        });
    }

    function stopQRScanner() {
        if (html5QrcodeScanner) {
            html5QrcodeScanner.stop().then(() => {
                document.getElementById('qr-reader').style.display = 'none';
                document.getElementById('btnScanQR').style.display = 'block';
                document.getElementById('btnStopQR').style.display = 'none';
                html5QrcodeScanner = null;
            }).catch(err => console.error("Gagal stop kamera", err));
        }
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

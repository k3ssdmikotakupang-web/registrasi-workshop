<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMS Workshop K3S 2026</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        /* Base Dark Theme */
        body {
            background-color: #0f172a; /* Dark Slate */
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        /* Glassmorphism Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* Neon Text & Gradients */
        .text-neon {
            background: linear-gradient(to right, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 0px 15px rgba(0, 242, 254, 0.3);
            font-weight: bold;
        }

        /* Input Styling */
        .form-control {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 10px;
        }
        .form-control:focus {
            background: rgba(0, 0, 0, 0.4);
            border-color: #00f2fe;
            color: white;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
        }

        /* Neon Buttons */
        .btn-neon {
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            border: none;
            color: white;
            font-weight: 600;
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        .btn-neon:hover {
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.6);
            transform: translateY(-2px);
            color: white;
        }
        
        .btn-outline-neon {
            background: transparent;
            border: 2px solid #f093fb;
            color: #f093fb;
            font-weight: 600;
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        .btn-outline-neon:hover {
            background: rgba(240, 147, 251, 0.1);
            box-shadow: 0 0 20px rgba(240, 147, 251, 0.5);
            color: #f093fb;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            
            <!-- CARD UTAMA -->
            <div class="card glass-card p-4">
                <div class="text-center mb-4">
                    <h2 class="text-neon mb-1">EMS WORKSHOP</h2>
                    <p class="text-white-50 small">K3S SD/MI Kota Kupang 2026</p>
                </div>

                <!-- SECTION LOGIN -->
                <div id="loginSection">
                    <form id="formLogin">
                        <div class="mb-3">
                            <label class="form-label text-white-50 small">Username / NPSN</label>
                            <input type="text" class="form-control" placeholder="Masukkan NPSN" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-white-50 small">Password / PIN</label>
                            <input type="password" class="form-control" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn btn-neon w-100 py-2 mb-3">Login System</button>
                    </form>

                    <div class="text-center mb-3 text-white-50">ATAU</div>

                    <!-- Tombol QR Scan -->
                    <button class="btn btn-outline-neon w-100 py-2 mb-4">
                        <i class="bi bi-qr-code-scan me-2"></i> Login via QR Code
                    </button>

                    <div class="text-center">
                        <span class="text-white-50 small">Sekolah belum terdaftar?</span>
                        <a href="#" class="text-neon text-decoration-none small" onclick="toggleView('register')">Daftar di sini</a>
                    </div>
                </div>

                <!-- SECTION PENDAFTARAN (Sembunyi secara default) -->
                <div id="registerSection" style="display: none;">
                    <form id="formRegister">
                        <div class="mb-3">
                            <label class="form-label text-white-50 small">NPSN Sekolah</label>
                            <div class="input-group">
                                <input type="number" id="inputNPSN" class="form-control" placeholder="Ketik NPSN" required>
                                <button type="button" class="btn btn-neon" onclick="cekNpsnKeDatabase()" id="btnCekNPSN">Cek Data</button>
                            </div>
                            <div id="statusCek" class="form-text text-warning mt-2 small"></div>
                        </div>

                        <!-- Form ini muncul setelah NPSN ditemukan -->
                        <div id="formLanjutan" style="display: none;">
                            <div class="mb-3">
                                <label class="form-label text-white-50 small">Nama Sekolah</label>
                                <input type="text" id="namaSekolah" class="form-control" readonly>
                            </div>
                            <div class="mb-4">
                                <label class="form-label text-white-50 small">Buat Password Admin</label>
                                <input type="password" id="passAdmin" class="form-control" placeholder="Minimal 6 karakter">
                            </div>
                            <button type="button" class="btn btn-neon w-100 py-2 mb-3">Daftarkan Sekolah</button>
                        </div>
                    </form>

                    <div class="text-center mt-3">
                        <a href="#" class="text-white-50 text-decoration-none small" onclick="toggleView('login')">
                            <i class="bi bi-arrow-left"></i> Kembali ke Login
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script>
    // --- GANTI URL DI BAWAH INI DENGAN URL WEB APP BRO ---
    const API_URL = "https://script.google.com/macros/s/AKfycbwLdvXuLpbUvBE666hblNZm4y1HuoogGUl8vdHorb-aT9s6T5X6xHwXAcPaeEvrZ5RS/exec";

    // Fungsi untuk ganti tampilan Login <-> Register
    function toggleView(view) {
        if(view === 'register') {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('registerSection').style.display = 'block';
        } else {
            document.getElementById('registerSection').style.display = 'none';
            document.getElementById('loginSection').style.display = 'block';
        }
    }

    // Fungsi fetch ke Google Apps Script
    async function cekNpsnKeDatabase() {
        const npsn = document.getElementById('inputNPSN').value;
        const btnCek = document.getElementById('btnCekNPSN');
        const statusText = document.getElementById('statusCek');
        const formLanjutan = document.getElementById('formLanjutan');

        if(!npsn) {
            statusText.innerText = "NPSN tidak boleh kosong!";
            return;
        }

        // Efek loading di tombol
        btnCek.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';
        statusText.innerText = "Mencari data ke database...";
        statusText.className = "form-text text-info mt-2 small";
        formLanjutan.style.display = 'none';

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({
                    action: 'cek_npsn',
                    npsn: npsn
                })
            });

            const result = await response.json();

            if(result.status === 'success') {
                statusText.innerText = "Data ditemukan!";
                statusText.className = "form-text text-success mt-2 small";
                document.getElementById('namaSekolah').value = result.data.nama_sekolah + " (" + result.data.subrayon + ")";
                formLanjutan.style.display = 'block';
            } else {
                statusText.innerText = result.message; // Menampilkan "NPSN tidak ditemukan"
                statusText.className = "form-text text-danger mt-2 small";
            }
        } catch (error) {
            statusText.innerText = "Terjadi kesalahan koneksi!";
            statusText.className = "form-text text-danger mt-2 small";
        } finally {
            btnCek.innerHTML = 'Cek Data'; // Kembalikan teks tombol
        }
    }
</script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMS Workshop K3S 2026</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <!-- Library Scanner & Popup Elegan (SweetAlert2) -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        body {
            background-color: #0f172a; 
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .text-neon {
            background: linear-gradient(to right, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 0px 15px rgba(0, 242, 254, 0.3);
            font-weight: bold;
        }
        .form-control {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 10px;
        }
        .form-control:focus, .form-control:read-only {
            background: rgba(0, 0, 0, 0.4);
            border-color: #00f2fe;
            color: white;
        }
        .btn-neon {
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            border: none;
            color: white;
            font-weight: 600;
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        .btn-neon:hover {
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.6);
            transform: translateY(-2px);
            color: white;
        }
        .btn-outline-neon {
            background: transparent;
            border: 2px solid #f093fb;
            color: #f093fb;
            font-weight: 600;
            border-radius: 10px;
        }
        /* Penyesuaian Custom SweetAlert Tema Gelap */
        .swal2-popup.swal-dark {
            background: #1e293b !important;
            color: #ffffff !important;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px !important;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            
            <div class="card glass-card p-4">
                <div class="text-center mb-4">
                    <h2 class="text-neon mb-1">EMS WORKSHOP</h2>
                    <p class="text-white-50 small">K3S SD/MI Kota Kupang 2026</p>
                </div>

                <!-- SECTION LOGIN -->
                <div id="loginSection">
                    <form id="formLogin" onsubmit="prosesLogin(event)">
                        <div class="mb-3">
                            <label class="form-label text-white-50 small">Username / NPSN</label>
                            <input type="text" id="loginUser" class="form-control" placeholder="Masukkan NPSN" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-white-50 small">Password / PIN</label>
                            <input type="password" id="loginPass" class="form-control" placeholder="••••••••" required>
                        </div>
                        <button type="submit" id="btnLogin" class="btn btn-neon w-100 py-2 mb-3">Login System</button>
                    </form>

                    <div class="text-center mb-3 text-white-50">ATAU</div>

                    <div id="qr-reader" style="display: none; width: 100%;"></div>
                    
                    <button class="btn btn-outline-neon w-100 py-2 mb-2" id="btnScanQR" onclick="startQRScanner()">
                        <i class="bi bi-qr-code-scan me-2"></i> Login via QR Code
                    </button>
                    <button class="btn btn-danger w-100 py-2 mb-4" id="btnStopQR" style="display: none;" onclick="stopQRScanner()">
                        Tutup Kamera
                    </button>

                    <div class="text-center mt-2">
                        <span class="text-white-50 small">Sekolah belum terdaftar?</span>
                        <a href="#" class="text-neon text-decoration-none small" onclick="toggleView('register')">Daftar di sini</a>
                    </div>
                </div>

                <!-- SECTION PENDAFTARAN -->
                <div id="registerSection" style="display: none;">
                    <form id="formRegister">
                        <div class="mb-3">
                            <label class="form-label text-white-50 small">NPSN Sekolah</label>
                            <div class="input-group">
                                <input type="number" id="inputNPSN" class="form-control" placeholder="Ketik NPSN" required>
                                <button type="button" class="btn btn-neon" onclick="cekNpsnKeDatabase()" id="btnCekNPSN">Cek Data</button>
                            </div>
                        </div>

                        <div id="formLanjutan" style="display: none;">
                            <div class="mb-3">
                                <label class="form-label text-white-50 small">Nama Sekolah</label>
                                <input type="text" id="namaSekolah" class="form-control" readonly>
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-white-50 small">Subrayon</label>
                                <input type="text" id="namaSubrayon" class="form-control" readonly>
                            </div>
                            <div class="mb-4">
                                <label class="form-label text-white-50 small">Buat Password Admin Sekolah</label>
                                <input type="password" id="passAdmin" class="form-control" placeholder="Minimal 6 karakter" required>
                            </div>
                            <button type="button" class="btn btn-neon w-100 py-2 mb-3" id="btnSimpan" onclick="simpanPendaftaran()">Simpan Pendaftaran</button>
                        </div>
                    </form>

                    <div class="text-center mt-3">
                        <a href="#" class="text-white-50 text-decoration-none small" onclick="toggleView('login')">
                            <i class="bi bi-arrow-left"></i> Kembali ke Login
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script>
    // MASUKKAN URL APP SCRIPT TERBARU BRO DI SINI!
    const API_URL = "https://script.google.com/macros/s/AKfycbwLdvXuLpbUvBE666hblNZm4y1HuoogGUl8vdHorb-aT9s6T5X6xHwXAcPaeEvrZ5RS/exec"; 
    let html5QrcodeScanner = null;

    // Konfigurasi Tema SweetAlert agar elegan & gelap
    const Toast = Swal.mixin({
        customClass: { popup: 'swal-dark' },
        confirmButtonColor: '#00f2fe'
    });

    function toggleView(view) {
        if(view === 'register') {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('registerSection').style.display = 'block';
            stopQRScanner();
        } else {
            document.getElementById('registerSection').style.display = 'none';
            document.getElementById('loginSection').style.display = 'block';
        }
    }

    async function cekNpsnKeDatabase() {
        const npsn = document.getElementById('inputNPSN').value;
        const btnCek = document.getElementById('btnCekNPSN');
        const formLanjutan = document.getElementById('formLanjutan');

        if(!npsn) {
            Toast.fire({ icon: 'warning', title: 'Oops...', text: 'NPSN tidak boleh kosong!' });
            return;
        }

        btnCek.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';
        formLanjutan.style.display = 'none';

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'cek_npsn', npsn: npsn })
            });
            const result = await response.json();

            if(result.status === 'success') {
                document.getElementById('namaSekolah').value = result.data.nama_sekolah;
                document.getElementById('namaSubrayon').value = result.data.subrayon;
                formLanjutan.style.display = 'block';
                Toast.fire({ icon: 'success', title: 'Ditemukan!', text: 'Data sekolah valid.', timer: 1500, showConfirmButton: false });
            } else {
                Toast.fire({ icon: 'error', title: 'Tidak Ditemukan', text: result.message });
            }
        } catch (error) {
            Toast.fire({ icon: 'error', title: 'Error Koneksi', text: 'Pastikan API URL benar.' });
        } finally {
            btnCek.innerHTML = 'Cek Data';
        }
    }

    async function simpanPendaftaran() {
        const npsn = document.getElementById('inputNPSN').value;
        const namaSekolah = document.getElementById('namaSekolah').value;
        const subrayon = document.getElementById('namaSubrayon').value;
        const password = document.getElementById('passAdmin').value;
        
        if(!password || password.length < 6) {
            Toast.fire({ icon: 'warning', title: 'Perhatian', text: 'Password minimal 6 karakter!' });
            return;
        }

        const btnSimpan = document.getElementById('btnSimpan');
        btnSimpan.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Menyimpan...';
        btnSimpan.disabled = true;

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ 
                    action: 'register_akun', 
                    npsn: npsn,
                    nama_sekolah: namaSekolah,
                    subrayon: subrayon,
                    password: password
                })
            });

            // Parsing hasil dari Google Apps Script
            const result = await response.json();

            if(result.status === 'success') {
                Toast.fire({ 
                    icon: 'success', 
                    title: 'Pendaftaran Sukses!', 
                    text: 'Akun sekolah berhasil dibuat. Silakan login.',
                }).then(() => {
                    toggleView('login');
                    document.getElementById('formRegister').reset();
                    document.getElementById('formLanjutan').style.display = 'none';
                });
            } else {
                Toast.fire({ icon: 'error', title: 'Gagal', text: result.message });
            }
        } catch (error) {
            console.error(error);
            Toast.fire({ 
                icon: 'error', 
                title: 'Error Sistem', 
                text: 'Gagal terkoneksi ke Database. Pastikan nama sheet adalah "Users" dan deploy sebagai "New Version".' 
            });
        } finally {
            btnSimpan.innerHTML = 'Simpan Pendaftaran';
            btnSimpan.disabled = false;
        }
    }

    async function prosesLogin(event) {
        event.preventDefault(); // Mencegah reload halaman
        
        const user = document.getElementById('loginUser').value;
        const pass = document.getElementById('loginPass').value;
        const btnLogin = document.getElementById('btnLogin');
        
        btnLogin.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Loading...';
        btnLogin.disabled = true;

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'login', username: user, password: pass })
            });

            const result = await response.json();

            if(result.status === 'success') {
                // Simpan data login ke memori browser
                localStorage.setItem('userLogin', JSON.stringify(result.data));
                
                Toast.fire({ 
                    icon: 'success', 
                    title: 'Login Berhasil!', 
                    text: `Selamat datang, ${result.data.nama_pic}` 
                }).then(() => {
                    // Arahkan ke dasbor masing-masing sesuai Role
                    if(result.data.role === 'Admin_Sekolah') {
                        window.location.href = "dashboard.html";
                    } else if (result.data.role === 'Bendahara_Subrayon') {
                        window.location.href = "dashboard_subrayon.html";
                    }
                });
            } else {
                Toast.fire({ icon: 'error', title: 'Login Gagal', text: result.message });
            }
        } catch (error) {
            Toast.fire({ icon: 'error', title: 'Error Koneksi', text: 'Gagal terhubung ke server.' });
        } finally {
            btnLogin.innerHTML = 'Login System';
            btnLogin.disabled = false;
        }
    }

    // Fungsi QR Camera (Sudah Jalan)
    function startQRScanner() {
        document.getElementById('qr-reader').style.display = 'block';
        document.getElementById('btnScanQR').style.display = 'none';
        document.getElementById('btnStopQR').style.display = 'block';
        html5QrcodeScanner = new Html5Qrcode("qr-reader");
        html5QrcodeScanner.start(
            { facingMode: "environment" }, 
            { fps: 10, qrbox: { width: 250, height: 250 } },
            async (decodedText) => {
                stopQRScanner();
                Toast.fire({ title: 'Memproses Data...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
                
                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: 'login_qr', id_qr: decodedText })
                    });
                    const result = await response.json();

                    if (result.status === 'success') {
                        localStorage.setItem('userLogin', JSON.stringify(result.data));
                        Toast.fire({ icon: 'success', title: 'Login Berhasil!', text: `Selamat datang, ${result.data.nama}` })
                        .then(() => { 
                            window.location.href = "dashboard_peserta.html"; 
                        });
                    } else {
                        Toast.fire({ icon: 'error', title: 'Akses Ditolak', text: result.message });
                    }
                } catch(e) {
                    Toast.fire({ icon: 'error', title: 'Error Koneksi', text: 'Gagal menghubungi server.' });
                }
            },
            (err) => {}
        ).catch(err => {
            Toast.fire({ icon: 'error', title: 'Kamera Gagal', text: 'Pastikan izin kamera aktif.' });
            stopQRScanner();
        });
    }

    function stopQRScanner() {
        if (html5QrcodeScanner) {
            html5QrcodeScanner.stop().then(() => {
                document.getElementById('qr-reader').style.display = 'none';
                document.getElementById('btnScanQR').style.display = 'block';
                document.getElementById('btnStopQR').style.display = 'none';
                html5QrcodeScanner = null;
            });
        }
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

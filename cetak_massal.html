<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cetak Massal E-Kwitansi Resmi - EMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');

        body { 
            background-color: #cbd5e1; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            color: #1e293b;
            padding: 30px 0;
        }

        /* Desain persis seperti receipt-container di kwitansi.html */
        .receipt-container {
            max-width: 800px;
            margin: 0 auto 50px auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.12);
            overflow: hidden;
            position: relative;
            page-break-after: always; /* Pastikan tiap kuitansi pas 1 halaman saat diprint */
            page-break-inside: avoid;
        }

        /* Hiasan Atas persis kwitansi.html */
        .receipt-header {
            background: #0f172a;
            color: #ffffff;
            padding: 30px 40px;
            border-bottom: 5px solid #00f2fe;
            position: relative;
        }

        .receipt-header::after {
            position: absolute;
            bottom: -20px;
            right: 40px;
            font-family: "bootstrap-icons";
            content: "\F28A"; 
            font-size: 6rem;
            color: rgba(255, 255, 255, 0.05);
            line-height: 1;
        }

        .receipt-body {
            padding: 40px;
        }

        .table-custom td {
            padding: 12px 0;
            border: none;
            vertical-align: top;
        }

        .table-custom td:first-child {
            width: 180px;
            color: #64748b;
            font-weight: 600;
        }

        .table-custom td:nth-child(2) {
            width: 20px;
            text-align: center;
        }

        .nominal-box {
            background: linear-gradient(45deg, #f8fafc, #f1f5f9);
            border: 1px solid #e2e8f0;
            border-left: 5px solid #00f2fe;
            padding: 15px 20px;
            border-radius: 8px;
            display: inline-block;
            margin-top: 10px;
        }

        .validator-area {
            text-align: right;
        }

        /* Nama validator anti terpotong dengan Courier Prime */
        .validator-name {
            font-family: 'Courier Prime', monospace;
            font-weight: bold;
            font-size: 1.1rem;
            text-decoration: underline;
            color: #0f172a;
            display: inline-block;
            max-width: 100%;
            word-wrap: break-word; 
        }

        .qr-box-container {
            padding: 6px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: #ffffff;
            display: inline-block;
        }

        .disclaimer-box {
            background-color: #fffbeb;
            border: 1px solid #fde68a;
            border-left: 4px solid #f59e0b;
            padding: 15px 20px;
            border-radius: 8px;
            margin-top: 30px;
            font-size: 0.85rem;
            color: #92400e;
        }

        /* Mode Cetak (Print) */
        @media print {
            body { background: white; padding: 0; }
            .receipt-container { box-shadow: none; max-width: 100%; margin: 0; }
            .no-print { display: none !important; }
            .receipt-header, .nominal-box, .disclaimer-box { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Kontrol Tombol Atas (Hilang saat diprint) -->
    <div class="d-flex justify-content-between align-items-center mb-4 no-print bg-white p-4 rounded shadow-sm">
        <div>
            <h4 class="fw-bold mb-1 text-dark"><i class="bi bi-printer-fill text-primary me-2"></i>Cetak Massal E-Kwitansi Resmi</h4>
            <p class="text-muted small mb-0">Menampilkan seluruh e-kwitansi sekolah lunas dengan format persis standar sistem.</p>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-secondary fw-bold px-3 rounded-pill" onclick="window.close()">Tutup</button>
            <button class="btn btn-primary fw-bold px-4 rounded-pill shadow" onclick="window.print()">
                <i class="bi bi-printer-fill me-2"></i> Cetak Semua Kuitansi
            </button>
        </div>
    </div>

    <!-- Area Loading -->
    <div id="loadingArea" class="text-center py-5">
        <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
        <h5 class="mt-3 text-secondary">Menyiapkan data kuitansi massal...</h5>
    </div>

    <!-- Wadah Kuitansi Berderet -->
    <div id="containerKwitansi"></div>
</div>

<script>
    // ⚠️ PASTE API URL KAPTEN DI SINI! ⚠️
    const API_URL = "https://script.google.com/macros/s/AKfycbwLdvXuLpbUvBE666hblNZm4y1HuoogGUl8vdHorb-aT9s6T5X6xHwXAcPaeEvrZ5RS/exec";

    function formatRp(angka) {
        return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
    }

    function formatTanggal(isoString) {
        if(!isoString) return '-';
        const date = new Date(isoString);
        return date.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    window.onload = async function() {
        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'get_kwitansi_massal' })
            });
            const result = await response.json();
            
            document.getElementById('loadingArea').style.display = 'none';
            if (result.status === 'success') {
                renderKwitansiMassal(result.data);
            } else {
                document.getElementById('containerKwitansi').innerHTML = `<div class="alert alert-danger text-center shadow-sm">Gagal memuat data: ${result.message}</div>`;
            }
        } catch (err) {
            document.getElementById('containerKwitansi').innerHTML = `<div class="alert alert-danger text-center shadow-sm">Koneksi bermasalah: ${err.message}</div>`;
        }
    };

    function renderKwitansiMassal(listData) {
        const wadah = document.getElementById('containerKwitansi');
        if (!listData || listData.length === 0) {
            wadah.innerHTML = `<div class="text-center py-5 text-muted bg-white rounded shadow-sm">Belum ada data transaksi lunas untuk dicetak.</div>`;
            return;
        }

        let html = '';
        listData.forEach((item) => {
            let tglFormatted = formatTanggal(item.tglBayar);
            let namaPetugas = item.operator || "Petugas EMS";
            if(namaPetugas.toLowerCase().includes('via ')) {
                namaPetugas = namaPetugas.split(/via /i)[1]; 
            }

            // String QR Identik dengan kwitansi.html
            let isiQR = "BUKTI SETORAN SAH - No. TRX: " + item.noKwitansi + " | Sekolah: " + item.namaSekolah + " | Nominal: Rp " + Number(item.nominal).toLocaleString('id-ID');
            let qrUrl = "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=" + encodeURIComponent(isiQR);

            html += `
                <div class="receipt-container">
                    <!-- HEADER -->
                    <div class="receipt-header d-flex justify-content-between align-items-center">
                        <div>
                            <h3 class="fw-bold mb-1" style="letter-spacing: 1px;">BUKTI SETORAN KONTRIBUSI</h3>
                            <p class="mb-0 text-white-50 small">K3S SD/MI KOTA KUPANG - WORKSHOP MANAJEMEN</p>
                        </div>
                        <div class="text-end">
                            <span class="badge bg-success bg-opacity-25 text-success border border-success px-3 py-2 fs-6">
                                <i class="bi bi-check-circle-fill me-1"></i> LUNAS (${item.metode})
                            </span>
                        </div>
                    </div>

                    <!-- BODY -->
                    <div class="receipt-body">
                        
                        <div class="row mb-4">
                            <div class="col-6">
                                <p class="small text-muted mb-1">No. Referensi / TRX:</p>
                                <h6 class="fw-bold font-monospace">${item.noKwitansi}</h6>
                            </div>
                            <div class="col-6 text-end">
                                <p class="small text-muted mb-1">Tanggal Transaksi:</p>
                                <h6 class="fw-bold">${tglFormatted}</h6>
                            </div>
                        </div>

                        <hr class="border-secondary opacity-25 mb-4">

                        <table class="table table-custom">
                            <tr>
                                <td>Telah Terima Dari</td>
                               <td>:</td>
                                <td>
                                    <h5 class="fw-bold text-dark mb-0">${item.namaSekolah}</h5>
                                    <p class="small text-muted mb-0">NPSN: ${item.npsn}</p>
                                </td>
                            </tr>
                            <tr>
                                <td>Guna Membayar</td>
                                <td>:</td>
                                <td>
                                    <div class="fs-6 lh-base text-dark">
                                        Kontribusi Sekolah Peserta Workshop Manajemen Kepsek - Pembayaran <span class="fw-bold">${item.metode}</span> sebesar:
                                    </div>
                                    <div class="nominal-box">
                                        <h2 class="fw-bold mb-0 text-dark">${formatRp(item.nominal)}</h2>
                                    </div>
                                </td>
                            </tr>
                        </table>

                        <!-- BARIS BAWAH: QR CODE VALIDASI & Tanda Tangan Validator -->
                        <div class="row align-items-end mt-4 pt-3 border-top border-light">
                            <div class="col-5 d-flex align-items-center gap-3">
                                <div class="qr-box-container">
                                    <img src="${qrUrl}" width="85" height="85" alt="QR Validasi">
                                </div>
                                <div class="text-muted" style="font-size: 0.7rem; line-height: 1.2;">
                                    <i class="bi bi-shield-lock-fill text-primary"></i> Scan untuk verifikasi sah setoran sistem.
                                </div>
                            </div>
                            
                            <div class="col-7 validator-area">
                                <p class="mb-4 text-muted small">Kupang, ${tglFormatted}<br>Penerima / Validator,</p>
                                <div class="validator-name">${namaPetugas}</div>
                                <p class="small text-muted mt-1 mb-0">Petugas EMS</p>
                            </div>
                        </div>

                        <!-- DISCLAIMER -->
                        <div class="disclaimer-box d-flex align-items-start">
                            <i class="bi bi-info-circle-fill fs-5 me-3 mt-1"></i>
                            <div>
                                <strong>Perhatian:</strong><br>
                                Dokumen ini merupakan bukti pengumpulan kontribusi sekolah yang sah dan terekam di dalam sistem (EMS). <strong>E-Kwitansi Resmi Panitia</strong> akan diserahkan secara terpisah oleh Bendahara Panitia Kegiatan.
                            </div>
                        </div>

                    </div>
                </div>
            `;
        });
        wadah.innerHTML = html;
    }
</script>
</body>
</html>

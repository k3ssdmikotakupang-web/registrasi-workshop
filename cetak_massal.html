<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cetak Massal E-Kwitansi Resmi - EMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Courier+Prime:wght@700&display=swap');

        body { 
            background-color: #475569; 
            color: #1e293b; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            margin: 0; padding: 20px 0;
        }

        .btn-top-area {
            max-width: 21cm;
            margin: 0 auto 20px auto;
            text-align: right;
        }

        /* UKURAN KERTAS KUITANSI PAS: 10.5cm x 21cm */
        .kwitansi-box { 
            background: #ffffff; 
            border: 1.5px solid #0f172a; 
            width: 21cm; 
            height: 10.5cm; 
            margin: 0 auto 20px auto; 
            padding: 0; 
            border-radius: 4px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            position: relative; 
            overflow: hidden; 
            box-sizing: border-box;
            page-break-after: always; /* KUNCI PEMISAH HALAMAN PRINTER */
            break-after: page;
        }

        .receipt-header {
            background: #0f172a;
            color: #ffffff;
            padding: 10px 18px;
            border-bottom: 3px solid #00f2fe;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .receipt-body { padding: 8px 18px; }

        .k-title { font-weight: 800; font-size: 1.1rem; color: #ffffff; text-transform: uppercase; margin-bottom: 0px; }
        .k-subtitle { font-size: 0.65rem; color: #94a3b8; font-weight: 600; text-transform: uppercase; }
        
        .k-no { 
            display: inline-block; padding: 2px 8px; border: 1px solid rgba(0, 242, 254, 0.4); 
            font-family: 'Courier Prime', monospace; font-size: 0.75rem; font-weight: bold; 
            background: rgba(0, 242, 254, 0.1); color: #00f2fe; border-radius: 4px;
        }

        .k-row { display: flex; margin-bottom: 4px; align-items: baseline; font-size: 0.78rem; }
        .k-label { width: 27%; font-weight: 600; color: #64748b; }
        .k-value { width: 73%; font-weight: 700; color: #0f172a; border-bottom: 1px dotted #cbd5e1; padding-bottom: 1px; }

        .k-nominal-box { 
            background: #f8fafc; border: 1.5px solid #0f172a; padding: 2px 12px; 
            font-size: 1.15rem; font-weight: 800; color: #0f172a; border-radius: 6px; display: inline-block; margin: 1px 0; 
        }

        .k-footer { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 4px; border-top: 1px solid #e2e8f0; padding-top: 6px; }
        .k-qr-box { padding: 2px; border: 1px solid #cbd5e1; border-radius: 4px; background: #ffffff; display: inline-block; }
        
        .k-ttd-container { width: 36%; text-align: center; font-size: 0.72rem; }
        .k-sign-box { margin-top: 18px; }
        .k-sign-name { font-weight: 800; font-size: 0.8rem; border-bottom: 1.5px solid #0f172a; padding-bottom: 1px; display: inline-block; width: 100%; color: #0f172a; }
        .k-sign-nip { font-size: 0.6rem; color: #64748b; margin-top: 1px; }
        
        .badge-status {
            background: rgba(34, 197, 94, 0.1); border: 1px solid #22c55e; color: #15803d;
            padding: 2px 8px; border-radius: 20px; font-weight: 700; font-size: 0.65rem;
        }

        /* PENGATURAN CETAK (FORCE 10.5 x 21 CM PER HALAMAN) */
        @media print {
            @page { size: 21cm 10.5cm; margin: 0; }
            body { background: #ffffff !important; padding: 0 !important; margin: 0 !important; }
            .btn-top-area { display: none !important; }
            .kwitansi-box { border: 1px solid #000 !important; box-shadow: none !important; margin: 0 !important; width: 21cm !important; height: 10.5cm !important; }
            .receipt-header { -webkit-print-color-adjust: exact; print-color-adjust: exact; background: #0f172a !important; color: #fff !important; }
        }
    </style>
</head>
<body>

<div class="btn-top-area">
    <button class="btn btn-light fw-bold px-4 py-2 shadow rounded-pill" onclick="window.print()">
        <i class="bi bi-printer-fill me-2"></i> Cetak Semua Kuitansi Massal
    </button>
</div>

<div id="container-kwitansi">
    <div class="text-center text-white py-5">
        <div class="spinner-border text-info" role="status"></div>
        <h5 class="mt-3">Memuat Seluruh Data E-Kwitansi...</h5>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwLdvXuLpbUvBE666hblNZm4y1HuoogGUl8vdHorb-aT9s6T5X6xHwXAcPaeEvrZ5RS/exec";

    async function muatDataMassal() {
        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'get_kwitansi_massal' })
            });
            const result = await response.json();

            if (result.status === 'success') {
                const list = result.data;
                const bendahara = result.bendahara;
                const container = document.getElementById('container-kwitansi');
                container.innerHTML = ''; // Kosongkan loading

                if(list.length === 0) {
                    container.innerHTML = '<div class="text-center text-white py-5"><h5>Tidak ada data transaksi lunas ditemukan.</h5></div>';
                    return;
                }

                list.forEach((item, index) => {
                    let tgl = new Date(item.tglBayar);
                    let tglStr = !isNaN(tgl) ? tgl.toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric' }) : item.tglBayar;
                    let nominalFmt = "Rp " + Number(item.nominal).toLocaleString('id-ID');
                    let qrUrl = "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=" + encodeURIComponent("RESMI PANITIA - No. TRX: " + item.noKwitansi + " | Sekolah: " + item.namaSekolah + " | Total: " + nominalFmt);

                    let htmlKwitansi = `
                        <div class="kwitansi-box">
                            <div class="receipt-header">
                                <div>
                                    <div class="k-title"><i class="bi bi-patch-check-fill me-1" style="color: #00f2fe;"></i> E-Kwitansi Resmi Panitia</div>
                                    <div class="k-subtitle">Workshop Manajemen Kepala SD/MI Kota Kupang 2026</div>
                                </div>
                                <div class="text-end">
                                    <div class="badge-status mb-1"><i class="bi bi-shield-check-fill"></i> LUNAS</div>
                                    <div><span class="k-no">${item.noKwitansi}</span></div>
                                </div>
                            </div>
                            
                            <div class="receipt-body">
                                <div class="k-row"><div class="k-label">Telah Terima Dari</div><div class="k-value">${item.namaPembayar}</div></div>
                                <div class="k-row"><div class="k-label">Asal Sekolah</div><div class="k-value">${item.namaSekolah} <span class="text-muted fw-normal">(NPSN: ${item.npsn})</span></div></div>
                                <div class="k-row"><div class="k-label">Metode Pembayaran</div><div class="k-value">${item.metode}</div></div>
                                <div class="k-row"><div class="k-label">Waktu Transaksi</div><div class="k-value">${tglStr}</div></div>
                                <div class="k-row"><div class="k-label">Tujuan Pembayaran</div><div class="k-value" style="border: none;">Kontribusi Keikutsertaan Workshop Manajemen Kepala SD/MI Kota Kupang Tahun 2026</div></div>
                                
                                <div class="text-center">
                                    <div class="small text-muted text-uppercase fw-bold" style="font-size: 0.6rem;">Jumlah Kontribusi Diterima:</div>
                                    <div class="k-nominal-box">${nominalFmt}</div>
                                </div>
                            </div>
                            
                            <div class="receipt-body pt-0 pb-2">
                                <div class="k-footer">
                                    <div class="d-flex align-items-center gap-2">
                                        <div class="k-qr-box"><img src="${qrUrl}" width="65" height="65"></div>
                                        <div class="text-muted" style="font-size: 0.58rem; max-width: 150px; line-height: 1.1;">
                                            <i class="bi bi-info-circle text-primary"></i> Scan QR untuk verifikasi keaslian dokumen.
                                        </div>
                                    </div>
                                    
                                    <div class="k-ttd-container">
                                        <div class="text-muted">Kupang, ${tglStr}</div>
                                        <div class="fw-bold text-dark mb-0">Bendahara Panitia,</div>
                                        <div class="k-sign-box">
                                            <div class="k-sign-name text-uppercase">${bendahara.nama}</div>
                                            <div class="k-sign-nip">NIP. ${bendahara.nip || '-'}</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += htmlKwitansi;
                });

            } else {
                document.getElementById('container-kwitansi').innerHTML = `<div class="text-center text-danger py-5"><h5>Gagal memuat: ${result.message}</h5></div>`;
            }
        } catch (e) {
            document.getElementById('container-kwitansi').innerHTML = `<div class="text-center text-danger py-5"><h5>Kesalahan koneksi server.</h5></div>`;
        }
    }

    muatDataMassal();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cetak Massal E-Kwitansi Resmi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8fafc; font-family: 'Segoe UI', sans-serif; color: #1e293b; }
        .kwitansi-box {
            background: #ffffff;
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            page-break-inside: avoid;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        @media print {
            body { background: white; }
            .no-print { display: none !important; }
            .kwitansi-box { border: 1px solid #000; box-shadow: none; margin-bottom: 20px; }
        }
    </style>
</head>
<body>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4 no-print">
        <div>
            <h3 class="fw-bold mb-1">Cetak Massal E-Kwitansi Lunas</h3>
            <p class="text-muted small mb-0">Menampilkan seluruh kuitansi resmi kontribusi peserta yang sudah divalidasi.</p>
        </div>
        <button class="btn btn-primary fw-bold px-4 shadow-sm" onclick="window.print()">
            <i class="bi bi-printer-fill me-2"></i> Cetak Semua Kuitansi
        </button>
    </div>

    <div id="loadingArea" class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2 text-muted">Menyiapkan data kuitansi massal dari server...</p>
    </div>

    <div id="containerKwitansi"></div>
</div>

<script>
    // ⚠️ PASTE API URL KAPTEN DI SINI (Sama seperti file GitHub lainnya)
    const API_URL = "https://script.google.com/macros/s/AKfycbwLdvXuLpbUvBE666hblNZm4y1HuoogGUl8vdHorb-aT9s6T5X6xHwXAcPaeEvrZ5RS/exec";
    
    const formatRp = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);

    window.onload = async function() {
        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'get_kwitansi_massal' })
            });
            const result = await response.json();
            
            document.getElementById('loadingArea').style.display = 'none';
            if (result.status === 'success') {
                renderKwitansi(result.data, result.bendahara);
            } else {
                document.getElementById('containerKwitansi').innerHTML = `<div class="alert alert-danger">Gagal memuat data: ${result.message}</div>`;
            }
        } catch (err) {
            document.getElementById('loadingArea').style.display = 'none';
            document.getElementById('containerKwitansi').innerHTML = `<div class="alert alert-danger">Error koneksi server: ${err.message}</div>`;
        }
    };

    function renderKwitansi(listData, bendahara) {
        const wadah = document.getElementById('containerKwitansi');
        if (!listData || listData.length === 0) {
            wadah.innerHTML = `<div class="text-center py-5 text-muted">Belum ada data transaksi lunas untuk dicetak.</div>`;
            return;
        }

        let html = '';
        listData.forEach((item) => {
            let tglFormatted = item.tglBayar ? new Date(item.tglBayar).toLocaleDateString('id-ID', {day: '2-digit', month: 'long', year: 'numeric'}) : '-';
            
            html += `
                <div class="kwitansi-box">
                    <div class="row border-bottom pb-3 mb-3 align-items-center">
                        <div class="col-8">
                            <h5 class="fw-bold text-dark mb-0"><i class="bi bi-receipt me-2 text-primary"></i>E-KWITANSI RESMI EMS</h5>
                            <small class="text-muted">No. Transaksi: ${item.noKwitansi} | NPSN: ${item.npsn}</small>
                        </div>
                        <div class="col-4 text-end">
                            <span class="badge bg-success bg-opacity-10 text-success border border-success px-3 py-2">LUNAS (${item.metode})</span>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <p class="mb-1 text-muted small">Sudah terima dari:</p>
                            <h6 class="fw-bold text-dark">${item.namaSekolah}</h6>
                        </div>
                        <div class="col-md-6 text-md-end">
                            <p class="mb-1 text-muted small">Tanggal Pembayaran:</p>
                            <h6 class="fw-bold text-dark">${tglFormatted}</h6>
                        </div>
                    </div>
                    <div class="bg-light p-3 rounded mb-3 border">
                        <div class="row align-items-center">
                            <div class="col-md-8">
                                <p class="mb-1 text-muted small">Untuk Pembayaran:</p>
                                <span class="fw-semibold">Kontribusi Kegiatan Educational Management Symposium (EMS)</span>
                            </div>
                            <div class="col-md-4 text-md-end">
                                <p class="mb-1 text-muted small">Jumlah Nominal:</p>
                                <h4 class="fw-bold text-success mb-0">${formatRp(item.nominal)}</h4>
                            </div>
                        </div>
                    </div>
                    <div class="row mt-4 pt-2 align-items-end">
                        <div class="col-6">
                            <small class="text-muted">Validator / Operator:</small>
                            <div class="fw-bold text-dark">${item.operator}</div>
                        </div>
                        <div class="col-6 text-end">
                            <small class="text-muted">Mengetahui,</small>
                            <div class="fw-bold text-dark mt-4">${bendahara.nama}</div>
                            <small class="text-muted">Bendahara Panitia</small>
                        </div>
                    </div>
                </div>
            `;
        });
        wadah.innerHTML = html;
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

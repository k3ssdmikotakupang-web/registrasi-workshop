<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cetak Massal E-Kwitansi Resmi Panitia - EMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Courier+Prime:wght@700&display=swap');

        body { 
            background-color: #cbd5e1; 
            color: #1e293b; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            padding: 30px 0;
            min-height: 100vh;
        }

        .page-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px; 
            margin-bottom: 25px;
        }

        /* Tampilan Layar (Biasa) */
        .kwitansi-box { 
            background: #ffffff; 
            border: 1.5px solid #0f172a; 
            width: 17.5cm; /* Lebar disesuaikan agar aman dari potongan kanan */
            height: 9.8cm;  /* Tinggi disesuaikan agar pas 3 tumpuk */
            margin: 0 auto; 
            padding: 0; 
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            position: relative; 
            overflow: hidden; 
            box-sizing: border-box;
        }

        .receipt-header {
            background: #0f172a;
            color: #ffffff;
            padding: 8px 16px;
            border-bottom: 3px solid #00f2fe;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .receipt-body { padding: 6px 16px; }

        .k-title { 
            font-weight: 800; 
            font-size: 1.05rem; 
            letter-spacing: 0.5px; 
            color: #ffffff;
            text-transform: uppercase; 
            margin-bottom: 0px; 
        }
        
        .k-subtitle { font-size: 0.6rem; color: #94a3b8; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .k-no { 
            display: inline-block; 
            padding: 2px 8px; 
            border: 1px solid rgba(0, 242, 254, 0.4); 
            font-family: 'Courier Prime', monospace; 
            font-size: 0.7rem; 
            font-weight: bold; 
            background: rgba(0, 242, 254, 0.1);
            color: #00f2fe;
            border-radius: 4px;
        }

        .k-row { display: flex; margin-bottom: 3px; align-items: baseline; font-size: 0.75rem; }
        .k-label { width: 27%; font-weight: 600; color: #64748b; }
        .k-value { width: 73%; font-weight: 700; color: #0f172a; border-bottom: 1px dotted #cbd5e1; padding-bottom: 1px; }

        .k-nominal-box { 
            background: #f8fafc;
            border: 1.5px solid #0f172a; 
            padding: 2px 12px; 
            font-size: 1.1rem; 
            font-weight: 800; 
            color: #0f172a;
            border-radius: 6px;
            display: inline-block; 
            margin: 1px 0; 
        }

        .k-footer { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-end; 
            margin-top: 2px; 
            border-top: 1px solid #e2e8f0; 
            padding-top: 4px; 
        }

        .k-qr-box { padding: 3px; border: 1px solid #cbd5e1; border-radius: 4px; background: #ffffff; display: inline-block; }
        
        .k-ttd-container { width: 36%; text-align: center; font-size: 0.7rem; }
        .k-sign-box { margin-top: 10px; }
        
        .k-sign-name { 
            font-weight: 800; 
            font-size: 0.75rem; 
            border-bottom: 1.5px solid #0f172a; 
            padding-bottom: 1px; 
            display: inline-block; 
            width: 100%; 
            color: #0f172a; 
        }
        .k-sign-nip { font-size: 0.55rem; color: #64748b; margin-top: 1px; }
        
        .badge-status {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid #22c55e;
            color: #15803d;
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.6rem;
            letter-spacing: 0.5px;
        }

        /* 🖨️ SETELAN CETAK PRESISI ANTI-POTONG KANAN */
        @media print {
            @page {
                size: 21.59cm 33cm; /* Ukuran F4 / Legal */
                margin: 6mm 10mm;   /* Margin seimbang kiri-kanan 10mm */
            }
            body { 
                background: #ffffff !important; 
                padding: 0 !important; 
                margin: 0 !important; 
                -webkit-print-color-adjust: exact; 
                print-color-adjust: exact; 
            }
            
            .container {
                max-width: 100% !important;
                width: 100% !important;
                padding: 0 !important;
                margin: 0 !important;
            }

            .no-print { display: none !important; }
            
            .page-wrapper {
                page-break-after: always;
                margin-bottom: 0 !important;
                gap: 5mm !important;
            }
            
            .kwitansi-box { 
                border: 1.5px solid #000 !important; 
                box-shadow: none !important; 
                /* DI-CENTER-KAN DENGAN AMAN DAN LEBAR 17.5CM (BEBAS DARI HARDWARE MARGIN PRINTER) */
                margin: 0 auto 5mm auto !important; 
                width: 17.5cm !important; 
                height: 9.8cm !important; 
                page-break-inside: avoid !important;
            }
            
            .receipt-header { 
                -webkit-print-color-adjust: exact; 
                print-color-adjust: exact; 
                background: #0f172a !important; 
                color: #fff !important; 
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4 no-print bg-white p-4 rounded shadow-sm">
        <div>
            <h4 class="fw-bold mb-1 text-dark"><i class="bi bi-printer-fill text-primary me-2"></i>Cetak Massal E-Kwitansi Resmi</h4>
            <p class="text-muted small mb-0">Ukuran disesuaikan ke 17.5cm agar aman dari batas potong kanan printer F4/Legal.</p>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-secondary fw-bold px-3 rounded-pill" onclick="window.close()">Tutup</button>
            <button class="btn btn-primary fw-bold px-4 rounded-pill shadow" onclick="window.print()">
                <i class="bi bi-printer-fill me-2"></i> Cetak Semua Kwitansi
            </button>
        </div>
    </div>

    <div id="loadingArea" class="text-center py-5">
        <div class="spinner-border text-primary" role="status" style="width: 2.5rem; height: 2.5rem;"></div>
        <h6 class="mt-3 text-secondary">Menyiapkan format kuitansi F4 dari server...</h6>
    </div>

    <div id="containerKwitansi"></div>
</div>

<script>
    // ⚠️ WAJIB PASTE API URL KAPTEN DI SINI! ⚠️
    const API_URL = "https://script.google.com/macros/s/AKfycbwLdvXuLpbUvBE666hblNZm4y1HuoogGUl8vdHorb-aT9s6T5X6xHwXAcPaeEvrZ5RS/exec";

    function formatRp(angka) {
        return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
    }

    window.onload = async function() {
        try {
            const [resKwitansi, resPejabat] = await Promise.all([
                fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'get_kwitansi_massal' })
                }).then(r => r.json()),
                
                fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'get_pejabat_kepanitiaan' })
                }).then(r => r.json())
            ]);
            
            document.getElementById('loadingArea').style.display = 'none';

            if (resKwitansi.status === 'success') {
                let namaBendahara = "Bendahara Panitia";
                let nipBendahara = "";
                
                if (resPejabat.status === 'success' && resPejabat.data && resPejabat.data.bendahara) {
                    namaBendahara = resPejabat.data.bendahara.nama || "Bendahara Panitia";
                    let rawNip = resPejabat.data.bendahara.nip;
                    nipBendahara = (rawNip === '-' || !rawNip) ? '' : rawNip;
                }

                renderKwitansiMassal(resKwitansi.data, namaBendahara, nipBendahara);
            } else {
                document.getElementById('containerKwitansi').innerHTML = `<div class="alert alert-danger text-center shadow-sm">Gagal memuat data: ${resKwitansi.message}</div>`;
            }
        } catch (err) {
            document.getElementById('loadingArea').style.display = 'none';
            document.getElementById('containerKwitansi').innerHTML = `<div class="alert alert-danger text-center shadow-sm">Koneksi bermasalah: ${err.message}</div>`;
        }
    };

    function renderKwitansiMassal(listData, namaBendahara, nipBendahara) {
        const wadah = document.getElementById('containerKwitansi');
        if (!listData || listData.length === 0) {
            wadah.innerHTML = `<div class="text-center py-5 text-muted bg-white rounded shadow-sm">Belum ada data transaksi lunas untuk dicetak.</div>`;
            return;
        }

        let fullHtml = '';
        
        for (let i = 0; i < listData.length; i += 3) {
            let chunk = listData.slice(i, i + 3); 
            
            fullHtml += `<div class="page-wrapper">`; 
            
            chunk.forEach((item) => {
                let tglFormattedFull = '-';
                let tglFormattedPendek = '-';

                if (item.tglBayar) {
                    let tgl = new Date(item.tglBayar);
                    if (!isNaN(tgl)) {
                        let optionsDate = { day: '2-digit', month: 'long', year: 'numeric' };
                        let optionsTime = { hour: '2-digit', minute:'2-digit' };
                        tglFormattedFull = tgl.toLocaleDateString('id-ID', optionsDate) + ' | Pukul ' + tgl.toLocaleTimeString('id-ID', optionsTime) + ' WITA';
                        tglFormattedPendek = tgl.toLocaleDateString('id-ID', optionsDate);
                    } else {
                        tglFormattedFull = item.tglBayar;
                        tglFormattedPendek = item.tglBayar.split(' ')[0];
                    }
                }

                let isiQR = "RESMI PANITIA - No. TRX: " + item.noKwitansi + " | Pembayar: " + item.namaSekolah + " | Total: Rp " + Number(item.nominal).toLocaleString('id-ID');
                let qrUrl = "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=" + encodeURIComponent(isiQR);

                fullHtml += `
                    <div class="kwitansi-box">
                        <div class="receipt-header">
                            <div>
                                <div class="k-title"><i class="bi bi-patch-check-fill me-1" style="color: #00f2fe;"></i> E-Kwitansi Resmi Panitia</div>
                                <div class="k-subtitle">Workshop Manajemen Kepala SD/MI Kota Kupang 2026</div>
                            </div>
                            <div class="text-end">
                                <div class="badge-status mb-1"><i class="bi bi-shield-check-fill"></i> LUNAS (${item.metode})</div>
                                <div><span class="k-no">${item.noKwitansi}</span></div>
                            </div>
                        </div>
                        
                        <div class="receipt-body">
                            <div class="k-row"><div class="k-label">Telah Terima Dari</div><div class="k-value">${item.namaSekolah}</div></div>
                            <div class="k-row"><div class="k-label">Asal Sekolah</div><div class="k-value"><span>${item.namaSekolah}</span> <span class="text-muted fw-normal">(NPSN: <span>${item.npsn}</span>)</span></div></div>
                            <div class="k-row"><div class="k-label">Metode Pembayaran</div><div class="k-value">${item.metode}</div></div>
                            <div class="k-row"><div class="k-label">Waktu Transaksi</div><div class="k-value">${tglFormattedFull}</div></div>
                            <div class="k-row"><div class="k-label">Tujuan Pembayaran</div><div class="k-value" style="border: none;">Kontribusi Keikutsertaan Workshop Manajemen Kepala SD/MI Kota Kupang Tahun 2026</div></div>
                            
                            <div class="text-center">
                                <div class="small text-muted text-uppercase fw-bold" style="font-size: 0.6rem;">Jumlah Kontribusi Diterima:</div>
                                <div class="k-nominal-box">${formatRp(item.nominal)}</div>
                            </div>
                        </div>
                        
                        <div class="receipt-body pt-0 pb-2">
                            <div class="k-footer">
                                <div class="d-flex align-items-center gap-2">
                                    <div class="k-qr-box"><img src="${qrUrl}" width="55" height="55"></div>
                                    <div class="text-muted" style="font-size: 0.55rem; max-width: 130px; line-height: 1.1;">
                                        <i class="bi bi-info-circle text-primary"></i> Scan QR untuk verifikasi keaslian dokumen.
                                    </div>
                                </div>
                                
                                <div class="k-ttd-container">
                                    <div class="text-muted">Kupang, <span>${tglFormattedPendek}</span></div>
                                    <div class="fw-bold text-dark mb-0">Bendahara Panitia,</div>
                                    <div class="k-sign-box">
                                        <div class="k-sign-name text-uppercase">${namaBendahara}</div>
                                        <div class="k-sign-nip">NIP. <span>${nipBendahara || '-'}</span></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            fullHtml += `</div>`; 
        }
        
        wadah.innerHTML = fullHtml;
    }
</script>
</body>
</html>

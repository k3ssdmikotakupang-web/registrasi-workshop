<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validasi & Terima Tunai - EMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        body { background-color: #0f172a; color: #ffffff; font-family: 'Segoe UI', sans-serif; padding-bottom: 50px; }
        .neon-nav { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0, 242, 254, 0.3); }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; }
        .text-neon { background: linear-gradient(to right, #00f2fe, #4facfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: bold; }
        
        .card-antrean {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-left: 4px solid #ffc107;
            border-radius: 10px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }
        .card-antrean.bayar-tunai { border-left-color: #f093fb; }
        .card-antrean.lunas-card { border-left-color: #20c997; background: rgba(32, 201, 151, 0.03); }
        .card-antrean:hover { background: rgba(255, 255, 255, 0.08); }
        
        /* Modifikasi Nav Tabs */
        .nav-pills .nav-link { color: #64748b; border: 1px solid rgba(255,255,255,0.1); margin-right: 5px; border-radius: 8px; }
        .nav-pills .nav-link.active { background: linear-gradient(45deg, #00f2fe, #4facfe); color: white; border-color: transparent; }

        .swal2-popup.swal-dark { background: #1e293b !important; color: #ffffff !important; border: 1px solid rgba(255,255,255,0.1); border-radius: 15px !important; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark neon-nav sticky-top mb-4">
    <div class="container">
        <span class="navbar-brand text-neon"><i class="bi bi-check2-square"></i> Validasi & Terima Tunai</span>
        <button class="btn btn-sm btn-outline-light" onclick="kembaliKeDasbor()">
            <i class="bi bi-arrow-left"></i> Kembali
        </button>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h5 class="fw-bold mb-0">Loket Bendahara</h5>
            <p class="small text-white-50 mb-0" id="infoPetugas">Memuat data petugas...</p>
        </div>
        <button class="btn btn-sm btn-info" onclick="muatAntrean()"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
    </div>

    <!-- Sistem Tab (Pills) -->
    <ul class="nav nav-pills mb-4" id="pills-tab" role="tablist">
        <li class="nav-item flex-fill text-center" role="presentation">
            <button class="nav-link active w-100 fw-bold" id="pills-antrean-tab" data-bs-toggle="pill" data-bs-target="#pills-antrean" type="button" role="tab">Antrean (<span id="countAntrean">0</span>)</button>
        </li>
        <li class="nav-item flex-fill text-center" role="presentation">
            <button class="nav-link w-100 fw-bold" id="pills-lunas-tab" data-bs-toggle="pill" data-bs-target="#pills-lunas" type="button" role="tab">Sudah Lunas (<span id="countLunas">0</span>)</button>
        </li>
    </ul>

    <!-- Area Loading -->
    <div id="loadingArea" class="text-center py-5">
        <div class="spinner-border text-info" role="status" style="width: 3rem; height: 3rem;"></div>
        <p class="mt-3 text-white-50">Menarik data dari server...</p>
    </div>

    <!-- Konten Tab -->
    <div class="tab-content" id="pills-tabContent" style="display: none;">
        
        <!-- TAB 1: ANTREAN -->
        <div class="tab-pane fade show active" id="pills-antrean" role="tabpanel">
            <!-- Data Antrean masuk sini -->
        </div>

        <!-- TAB 2: LUNAS & CETAK KWITANSI -->
        <div class="tab-pane fade" id="pills-lunas" role="tabpanel">
            <!-- Data Lunas masuk sini -->
        </div>

    </div>
</div>

<script>
    // ⚠️ WAJIB PASTE API URL KAPTEN DI SINI! ⚠️
    const API_URL = "https://script.google.com/macros/s/AKfycbwLdvXuLpbUvBE666hblNZm4y1HuoogGUl8vdHorb-aT9s6T5X6xHwXAcPaeEvrZ5RS/exec";
    
    const userData = JSON.parse(localStorage.getItem('userLogin'));
    if(!userData || (userData.role !== 'Bendahara_Panitia' && userData.role !== 'Bendahara_Subrayon')) {
        window.location.href = "index.html";
    }

    document.getElementById('infoPetugas').innerText = `Petugas: ${userData.nama_pic} (${userData.role.replace('_', ' ')})`;
    const Toast = Swal.mixin({ customClass: { popup: 'swal-dark' }, confirmButtonColor: '#00f2fe' });

    async function fetchDenganAntrean(url, options, maksimalPercobaan = 3) {
        for (let i = 0; i < maksimalPercobaan; i++) {
            try {
                const response = await fetch(url, options);
                if (!response.ok) throw new Error('Jaringan bermasalah');
                return await response.json(); 
            } catch (err) {
                if (i === maksimalPercobaan - 1) throw err; 
                await new Promise(resolve => setTimeout(resolve, 1000 * (i + 1))); 
            }
        }
    }

    function kembaliKeDasbor() {
        if (userData.role === 'Bendahara_Panitia') window.location.href = 'dashboard_bendahara_panitia.html';
        else window.location.href = 'dashboard_bendahara_subrayon.html';
    }

    function formatRp(angka) {
        return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
    }

    function cetakKwitansi(idTrx) {
        if(!idTrx) {
            Swal.fire('Oops!', 'ID Transaksi belum terbentuk. Silakan refresh halaman.', 'error');
            return;
        }
        // Langsung arahkan ke halaman e-kwitansi VIP Kapten
        window.open(`verify.html?trx=${idTrx}`, '_blank');
    }

    async function muatAntrean() {
        document.getElementById('loadingArea').style.display = 'block';
        document.getElementById('pills-tabContent').style.display = 'none';
        
        const wadahAntrean = document.getElementById('pills-antrean');
        const wadahLunas = document.getElementById('pills-lunas');
        wadahAntrean.innerHTML = '';
        wadahLunas.innerHTML = '';

        try {
            const result = await fetchDenganAntrean(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'get_antrian_validasi', role: userData.role, subrayon: userData.subrayon })
            });

            document.getElementById('loadingArea').style.display = 'none';
            document.getElementById('pills-tabContent').style.display = 'block';

            if (result.status === 'success') {
                // Memisahkan data
                const dataPending = result.data.filter(item => item.status !== 'Lunas');
                const dataLunas = result.data.filter(item => item.status === 'Lunas');

                document.getElementById('countAntrean').innerText = dataPending.length;
                document.getElementById('countLunas').innerText = dataLunas.length;

                // --- RENDER TAB ANTREAN ---
                if (dataPending.length === 0) {
                    wadahAntrean.innerHTML = `<div class="text-center py-5 glass-card"><i class="bi bi-emoji-smile fs-1 text-white-50"></i><h6 class="mt-3 text-white-50">Hore! Antrean kosong.</h6></div>`;
                } else {
                    dataPending.forEach(item => {
                        let badgeInfo = ''; let btnAksi = ''; let classBorder = '';

                        if (item.status === 'Pending') {
                            classBorder = ''; 
                            badgeInfo = `<span class="badge bg-primary bg-opacity-25 text-primary border border-primary small"><i class="bi bi-cloud-check"></i> Bukti Transfer Ada</span>`;
                            let btnCekBukti = item.link_bukti ? `<button class="btn btn-sm btn-outline-info w-100 mb-2" onclick="window.open('${item.link_bukti}', '_blank')"><i class="bi bi-eye"></i> Cek Bukti Transfer</button>` : '';

                            btnAksi = `
                                <div class="col-12">${btnCekBukti}</div>
                                <div class="col-6"><button class="btn btn-sm btn-success w-100 fw-bold" onclick="eksekusiValidasi('${item.id_trx}', '${item.npsn}', 'Transfer', '${item.nama}')"><i class="bi bi-check-circle"></i> Sahkan Transfer</button></div>
                                <div class="col-6"><button class="btn btn-sm btn-outline-warning w-100 fw-bold" onclick="eksekusiValidasi('${item.id_trx}', '${item.npsn}', 'Tunai', '${item.nama}')">Beralih Tunai</button></div>
                            `;
                        } else {
                            classBorder = 'bayar-tunai'; 
                            badgeInfo = `<span class="badge bg-secondary bg-opacity-25 text-white-50 border border-secondary small"><i class="bi bi-clock"></i> Sudah Terdaftar (Belum Bayar)</span>`;
                            btnAksi = `<div class="col-12"><button class="btn btn-sm w-100 fw-bold text-dark" style="background: linear-gradient(45deg, #f093fb, #f5576c); border: none;" onclick="eksekusiValidasi('', '${item.npsn}', 'Tunai', '${item.nama}')"><i class="bi bi-cash-coin me-1"></i> Terima Pembayaran Tunai (Rp 2.240.000)</button></div>`;
                        }

                        wadahAntrean.innerHTML += `
                            <div class="card-antrean p-3 ${classBorder}">
                                <div class="d-flex justify-content-between align-items-start mb-2">
                                    <div><h6 class="fw-bold mb-1 ${item.status === 'Pending' ? 'text-warning' : 'text-white'}">${item.nama}</h6><div class="small text-white-50">NPSN: ${item.npsn} | Subrayon: ${item.subrayon}</div></div>
                                    <div class="text-end"><div class="fw-bold text-white">${formatRp(item.nominal)}</div><div class="mt-1">${badgeInfo}</div></div>
                                </div>
                                <hr class="border-secondary opacity-25 my-2">
                                <div class="row g-2 mt-1">${btnAksi}</div>
                            </div>
                        `;
                    });
                }

                // --- RENDER TAB LUNAS ---
                if (dataLunas.length === 0) {
                    wadahLunas.innerHTML = `<div class="text-center py-5 glass-card"><i class="bi bi-box-seam fs-1 text-white-50"></i><h6 class="mt-3 text-white-50">Belum ada sekolah yang lunas.</h6></div>`;
                } else {
                    dataLunas.forEach(item => {
                        let badgeInfo = `<span class="badge bg-success bg-opacity-25 text-success border border-success small"><i class="bi bi-check-circle-fill"></i> LUNAS (${item.metode})</span>`;
                        wadahLunas.innerHTML += `
                            <div class="card-antrean lunas-card p-3">
                                <div class="d-flex justify-content-between align-items-start mb-2">
                                    <div><h6 class="fw-bold mb-1 text-success">${item.nama}</h6><div class="small text-white-50">NPSN: ${item.npsn} | Subrayon: ${item.subrayon}</div></div>
                                    <div class="text-end"><div class="fw-bold text-white">${formatRp(item.nominal)}</div><div class="mt-1">${badgeInfo}</div></div>
                                </div>
                                <hr class="border-secondary opacity-25 my-2">
                                <div class="row mt-1">
                                    <div class="col-12"><button class="btn btn-sm btn-outline-info w-100 fw-bold" onclick="cetakKwitansi('${item.id_trx}')"><i class="bi bi-printer"></i> Cetak E-Kwitansi VIP</button></div>
                                </div>
                            </div>
                        `;
                    });
                }
            } else {
                wadahAntrean.innerHTML = `<div class="alert alert-danger small">Gagal mengambil data.</div>`;
            }
        } catch (error) {
            document.getElementById('loadingArea').style.display = 'none';
            document.getElementById('pills-tabContent').style.display = 'block';
            wadahAntrean.innerHTML = `<div class="alert alert-danger small">Gagal menghubungi server.</div>`;
        }
    }

    function eksekusiValidasi(idTrx, npsnSekolah, metodeBayar, namaSekolah) {
        let pesanAlert = metodeBayar === 'Tunai' ? 
            `Anda menerima uang Tunai dari ${namaSekolah}. Lanjutkan?` : 
            `Anda mensahkan bukti Transfer dari ${namaSekolah}. Lanjutkan?`;

        Swal.fire({
            title: 'Konfirmasi Pembayaran',
            text: pesanAlert,
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: 'Ya, Sahkan & Terbitkan Kwitansi!',
            cancelButtonText: 'Batal',
            customClass: { popup: 'swal-dark' }, background: '#1e293b', color: '#fff', confirmButtonColor: '#00f2fe'
        }).then(async (result) => {
            if (result.isConfirmed) {
                Toast.fire({ title: 'Memproses Validasi...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
                try {
                    const response = await fetchDenganAntrean(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: 'eksekusi_validasi', id_trx: idTrx, npsn: npsnSekolah, metode: metodeBayar, nama_validator: userData.nama_pic })
                    });
                    if (response.status === 'success') {
                        Swal.fire({ icon: 'success', title: 'Validasi Sukses!', text: 'Kwitansi otomatis terbit untuk sekolah tersebut.', customClass: { popup: 'swal-dark' }, background: '#1e293b', color: '#fff', confirmButtonColor: '#00f2fe' });
                        muatAntrean(); 
                    } else {
                        Swal.fire({ icon: 'error', title: 'Gagal', text: response.message, customClass: { popup: 'swal-dark' }, background: '#1e293b', color: '#fff' });
                    }
                } catch (error) {
                    Swal.fire({ icon: 'error', title: 'Jaringan Padat', text: 'Gagal mengirim data. Coba beberapa saat lagi.', customClass: { popup: 'swal-dark' }, background: '#1e293b', color: '#fff' });
                }
            }
        });
    }

    muatAntrean();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

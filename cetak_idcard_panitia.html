<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cetak ID Card Panitia - EMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f1f5f9; font-family: 'Segoe UI', sans-serif; }
        .idcard {
            width: 8.5cm; height: 12cm; background: #fff; border: 2px solid #0f172a;
            border-radius: 12px; padding: 15px; margin: 15px auto; text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); position: relative; page-break-inside: avoid;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .id-header { border-bottom: 2px solid #0f172a; padding-bottom: 8px; }
        .id-title { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; color: #1e293b; margin: 0; }
        .id-sub { font-size: 0.65rem; font-weight: 600; color: #64748b; }
        .id-photo-box { width: 90px; height: 90px; border: 2px dashed #cbd5e1; border-radius: 50%; margin: 10px auto; display: flex; align-items: center; justify-content: center; background: #f8fafc; font-size: 2rem; color: #94a3b8; }
        .id-name { font-size: 1rem; font-weight: 800; color: #0f172a; margin-bottom: 2px; line-height: 1.2; }
        .id-badge { background: #0f172a; color: #fff; font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; font-weight: 600; display: inline-block; margin-bottom: 10px; }
        .id-qr { width: 90px; height: 90px; margin: 0 auto; }
        .id-footer { font-size: 0.6rem; color: #64748b; border-top: 1px solid #e2e8f0; padding-top: 5px; }
        @media print {
            body { background: none; }
            .no-print { display: none !important; }
            .idcard { border: 1px solid #000; box-shadow: none; }
        }
    </style>
</head>
<body>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4 no-print">
        <h4 class="fw-bold text-dark mb-0"><i class="bi bi-person-badge me-2"></i> Cetak ID Card Panitia</h4>
        <div>
            <button class="btn btn-primary fw-bold" onclick="window.print()"><i class="bi bi-printer me-2"></i> Cetak Semua</button>
            <button class="btn btn-outline-dark ms-2" onclick="window.history.back()"><i class="bi bi-arrow-left"></i> Kembali</button>
        </div>
    </div>

    <div id="loading" class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="text-muted mt-2">Memuat data panitia...</p>
    </div>

    <div class="row" id="containerCard"></div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwLdvXuLpbUvBE666hblNZm4y1HuoogGUl8vdHorb-aT9s6T5X6xHwXAcPaeEvrZ5RS/exec";

    async function muatDataPanitia() {
        try {
            const res = await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'get_all_panitia' })
            });
            const result = await res.json();
            document.getElementById('loading').classList.add('d-none');

            if(result.status === 'success' && result.data.length > 0) {
                let html = '';
                result.data.forEach(p => {
                    let qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(p.id_panitia)}`;
                    html += `
                        <div class="col-md-4 col-sm-6">
                            <div class="idcard">
                                <div class="id-header">
                                    <p class="id-title">K3S SD/MI Kota Kupang</p>
                                    <span class="id-sub">Workshop Manajemen Kepala Sekolah 2026</span>
                                </div>
                                <div>
                                    <div class="id-photo-box"><i class="bi bi-person-fill"></i></div>
                                    <div class="id-name">${p.nama}</div>
                                    <div class="id-badge">${p.jabatan}</div>
                                </div>
                                <div>
                                    <img src="${qrUrl}" class="id-qr img-thumbnail mb-2" alt="QR Panitia">
                                    <div class="id-footer">ID: <strong>${p.id_panitia}</strong> | HP: ${p.hp}</div>
                                </div>
                            </div>
                        </div>
                    `;
                });
                document.getElementById('containerCard').innerHTML = html;
            } else {
                document.getElementById('containerCard').innerHTML = '<div class="col-12 text-center text-muted">Belum ada data panitia yang terdaftar.</div>';
            }
        } catch(e) {
            document.getElementById('loading').innerHTML = '<span class="text-danger">Gagal memuat data dari server.</span>';
        }
    }

    muatDataPanitia();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Pencairan Dana - EMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #0f172a; color: #ffffff; font-family: 'Segoe UI', sans-serif; }
        .neon-nav { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid #198754; }
        .scanner-container { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 15px; border: 1px solid #198754; box-shadow: 0 0 20px rgba(25, 135, 84, 0.2); }
        #reader { width: 100%; border-radius: 10px; overflow: hidden; }
        #reader video { object-fit: cover; border-radius: 10px; }
        .btn-kembali { background: transparent; color: #fff; border: 1px solid #fff; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark neon-nav sticky-top mb-4">
    <div class="container d-flex justify-content-between">
        <span class="navbar-brand fw-bold text-success"><i class="bi bi-cash-coin"></i> Scanner Pencairan</span>
        <button class="btn btn-sm btn-kembali" onclick="window.history.back()"><i class="bi bi-arrow-left"></i> Kembali</button>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="text-center mb-3">
                <h5 class="fw-bold text-warning">Validasi Transport & Lembur</h5>
                <p class="small text-white-50">Scan QR Code di ID Card Peserta/Panitia sebelum menyerahkan uang tunai.</p>
            </div>

            <div class="scanner-container mb-4">
                <div id="reader"></div>
            </div>

            <div class="alert alert-info text-center" id="statusScan">
                <div class="spinner-border spinner-border-sm me-2 d-none" id="loadingScan"></div>
                <span id="teksStatus">Menunggu scan QR Code...</span>
            </div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    // MASUKKAN API URL KAPTEN DI SINI
    const API_URL = "https://script.google.com/macros/s/AKfycbwLdvXuLpbUvBE666hblNZm4y1HuoogGUl8vdHorb-aT9s6T5X6xHwXAcPaeEvrZ5RS/exec";

    // Proteksi Keamanan
    const userData = JSON.parse(localStorage.getItem('userLogin'));
    if(!userData) window.location.href = "index.html";

    let html5QrcodeScanner;
    let isProcessing = false;

    // Inisialisasi Scanner
    function onScanSuccess(decodedText, decodedResult) {
        if (isProcessing) return; // Mencegah scan dobel beruntun
        
        isProcessing = true;
        document.getElementById('teksStatus').innerText = "Memvalidasi pencairan...";
        document.getElementById('loadingScan').classList.remove('d-none');
        document.getElementById('statusScan').className = "alert alert-warning text-center";

        // Jeda sejenak agar UI terlihat memproses
        setTimeout(() => { prosesPencairan(decodedText); }, 500);
    }

    function onScanFailure(error) {
        // Abaikan error saat tidak ada QR yang tertangkap kamera
    }

    html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 250} }, false);
    html5QrcodeScanner.render(onScanSuccess, onScanFailure);

    // Kirim Data ke Backend
    async function prosesPencairan(idQrCode) {
        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ 
                    action: 'proses_pencairan_dana', 
                    id_qr: idQrCode 
                })
            });
            const result = await response.json();

            if(result.status === 'success') {
                document.getElementById('statusScan').className = "alert alert-success text-center fw-bold";
                document.getElementById('teksStatus').innerText = "BERHASIL DICAIRKAN!";
                Swal.fire('Valid!', result.message, 'success');
            } else if (result.status === 'warning') {
                document.getElementById('statusScan').className = "alert alert-danger text-center fw-bold";
                document.getElementById('teksStatus').innerText = "DANA SUDAH DIAMBIL!";
                Swal.fire('AWAS DOBEL!', result.message, 'warning');
            } else {
                document.getElementById('statusScan').className = "alert alert-danger text-center fw-bold";
                document.getElementById('teksStatus').innerText = "QR TIDAK DIKENALI!";
                Swal.fire('Gagal', result.message, 'error');
            }
        } catch (error) {
            document.getElementById('statusScan').className = "alert alert-danger text-center";
            document.getElementById('teksStatus').innerText = "Koneksi terputus!";
            Swal.fire('Error', 'Gagal terhubung ke server', 'error');
        } finally {
            document.getElementById('loadingScan').classList.add('d-none');
            // Jeda 3 detik sebelum siap scan orang berikutnya
            setTimeout(() => {
                isProcessing = false;
                document.getElementById('statusScan').className = "alert alert-info text-center";
                document.getElementById('teksStatus').innerText = "Silakan scan QR berikutnya...";
            }, 3000);
        }
    }
</script>
</body>
</html>
